  <style>
    /* ── Tokens. Oscuro es el tema por defecto; "rosa" es la variante clara. ── */
    :root{
      color-scheme:dark;
      --bg:#0A0A0B; --side:#0D0D0F; --surface:#121214; --surface-2:#19191C; --line:#232327; --edge:#232327;
      --ink:#EDEDEF; --ink-2:#A1A1AA; --ink-3:#6E6E78;
      --pink:#EDEDEF; --pink-deep:#EDEDEF; --pink-soft:rgba(255,255,255,0.06);
      --g1:#EDEDEF; --g2:#EDEDEF; --on-acc:#0A0A0B;
      --pill:#2A2A30; --pill-ink:#EDEDEF; --sel:#19191C;
      --glass:25 25 28; --acc:255 255 255; --sh:0 0 0;
      --c-inc:#EDEDEF; --c-exp:#55555F;
      --violet:#8B8B96; --violet-soft:rgba(255,255,255,0.06); --violet-ink:#EDEDEF; --violet-bar:rgba(255,255,255,0.2);
      --scrim:rgba(0,0,0,0.62); --mute:rgba(255,255,255,0.06);
      --good:#3FB950; --good-soft:rgba(63,185,80,0.12);
      --bad:#F0616D;  --bad-soft:rgba(240,97,109,0.12); --bad-line:rgba(240,97,109,0.25);
      --warn:#D4A72C; --warn-soft:rgba(212,167,44,0.12);
      --shadow:0 0 0 rgba(0,0,0,0);
      --pop:0 16px 48px rgba(0,0,0,0.5);
      --grain-op:0.05; --grain-inv:0;
      --glow-a:rgb(255 255 255 / 0.075); --glow-b:rgb(255 255 255 / 0.04);
      --sheen:rgb(255 255 255 / 0.035); --edge-hi:rgb(255 255 255 / 0.06);
      --btn-bg:linear-gradient(180deg,#FFFFFF 0%,#D6D6DB 100%);
      --btn-glow:inset 0 1px 0 rgb(255 255 255 / 0.7), 0 0 0 1px rgb(255 255 255 / 0.08), 0 6px 20px rgb(255 255 255 / 0.07);
    }
    :root[data-theme="rosa"]{
      color-scheme:light;
      --bg:#FBF8F9; --side:#F6F1F3; --surface:#FFFFFF; --surface-2:#F7F2F4; --line:#ECE3E6; --edge:#ECE3E6;
      --ink:#1D1418; --ink-2:#6B5A61; --ink-3:#9C8B92;
      --pink:#D6336C; --pink-deep:#D6336C; --pink-soft:rgba(214,51,108,0.08);
      --g1:#D6336C; --g2:#D6336C; --on-acc:#FFFFFF;
      --pill:#FFFFFF; --pill-ink:#1D1418; --sel:#F7F2F4;
      --glass:255 255 255; --acc:60 30 40; --sh:60 30 40;
      --c-inc:#D6336C; --c-exp:#7C6AD6;
      --violet:#7C6AD6; --violet-soft:#F0EDFB; --violet-ink:#4B3BA8; --violet-bar:rgba(124,106,214,0.3);
      --scrim:rgba(20,10,14,0.35); --mute:#F1ECEE;
      --good:#1A7F4B; --good-soft:#E6F4EC;
      --bad:#C9304B;  --bad-soft:#FBEAED; --bad-line:#F2C9D1;
      --warn:#9A6700; --warn-soft:#FBF1D9;
      --shadow:0 1px 2px rgba(60,30,40,0.05);
      --pop:0 16px 48px rgba(60,30,40,0.18);
      --grain-op:0.035; --grain-inv:1;
      --glow-a:rgb(255 255 255 / 0.9); --glow-b:rgb(214 51 108 / 0.04);
      --sheen:rgb(255 255 255 / 0); --edge-hi:rgb(255 255 255 / 0.9);
      --btn-bg:var(--pink-deep);
      --btn-glow:0 1px 2px rgb(60 30 40 / 0.12);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;}
    body{font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.45;overflow-x:hidden;min-height:100vh;color:var(--ink);background:var(--bg);
      -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01';}
    button,input,select,textarea{font-family:inherit;}

    /* ══ Shell ══ */
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:232px;z-index:30;background:var(--side);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:14px 10px;}
    .side-label{font-size:11px;font-weight:500;color:var(--ink-3);padding:14px 10px 6px;}
    .nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;
      color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s;border:0;background:none;width:100%;text-align:left;}
    .nav-item:hover{background:rgb(var(--acc) / 0.05);color:var(--ink);}
    .nav-item.active{background:rgb(var(--acc) / 0.08);color:var(--ink);}
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;padding:6px 6px env(safe-area-inset-bottom,10px);
      background:var(--side);border-top:1px solid var(--line);}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:10px;font-weight:500;
      color:var(--ink-3);cursor:pointer;border:0;background:none;}
    .bnav-item.active{color:var(--ink);}
    .main-content{min-height:100vh;max-width:1180px;padding-bottom:48px;}
    @media(min-width:768px){.main-content{margin-left:232px;}}
    .mobile-only{display:none!important;}
    .topbar{display:none;}
    @media(max-width:767px){
      .sidebar{width:280px;z-index:61;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--pop);padding-top:calc(14px + env(safe-area-inset-top,0px));}
      .sidebar.open{transform:none;}
      .sidebar .nav-item{height:42px;font-size:14px;}
      .drawer-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);animation:fadeUp .15s ease-out;}
      .topbar{display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;z-index:30;height:calc(52px + env(safe-area-inset-top,0px));padding:0 8px;padding-top:env(safe-area-inset-top,0px);
        background:var(--side);border-bottom:1px solid var(--line);}
      .main-content{margin-left:0;padding-bottom:96px;padding-top:calc(52px + env(safe-area-inset-top,0px));}
      .page-header{flex-wrap:wrap;}
      .modal-bg{align-items:flex-end!important;padding:0!important;}
      .modal-box{max-width:100%!important;border-radius:16px 16px 0 0!important;max-height:92vh!important;animation:sheetUp .22s ease-out!important;}
      .modal-body{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
      .page{padding:18px 14px 0!important;}
      input,textarea,select{font-size:16px!important;}
      .btn-p,.btn-g,.btn-d{min-height:40px;}
    }

    /* ══ Superficies ══ */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
    .card.click{cursor:pointer;}
    .card.click:hover{border-color:rgb(var(--acc) / 0.2);}

    /* ══ Controles ══ */
    input,textarea,select{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;width:100%;
      outline:none;font-size:13px;transition:border-color .12s,box-shadow .12s;}
    input:hover,textarea:hover,select:hover{border-color:rgb(var(--acc) / 0.2);}
    input:focus,textarea:focus,select:focus{border-color:rgb(var(--acc) / 0.45);box-shadow:0 0 0 3px rgb(var(--acc) / 0.08);}
    input:disabled,select:disabled{opacity:.6;}
    input::placeholder,textarea::placeholder{color:var(--ink-3);}
    .btn-p,.btn-g,.btn-d{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:8px;
      font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,opacity .12s,border-color .12s;white-space:nowrap;}
    .btn-p{background:var(--pink-deep);color:var(--on-acc);border:1px solid transparent;}
    .btn-p:hover{opacity:.88;}
    .btn-p:disabled{opacity:.5;cursor:default;}
    .btn-g{background:transparent;color:var(--ink);border:1px solid var(--line);}
    .btn-g:hover{background:rgb(var(--acc) / 0.05);border-color:rgb(var(--acc) / 0.2);}
    .btn-d{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line);}
    .btn-d:hover{opacity:.85;}
    .icon-btn{background:none;border:0;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:6px;display:inline-flex;}
    .icon-btn:hover{color:var(--ink);background:rgb(var(--acc) / 0.06);}
    .check-box{width:18px;height:18px;border-radius:50%;border:1.5px solid rgb(var(--acc) / 0.3);background:transparent;display:flex;align-items:center;
      justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0;}
    .check-box:hover{border-color:rgb(var(--acc) / 0.6);}
    .check-box.done{background:var(--pink-deep);border-color:var(--pink-deep);}
    .prog-track{height:4px;background:rgb(var(--acc) / 0.08);border-radius:2px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:2px;background:var(--pink-deep);transition:width .4s ease;}
    .tab-pill{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:transparent;
      color:var(--ink-2);transition:all .12s;white-space:nowrap;}
    .tab-pill:hover{color:var(--ink);}
    .tab-pill.active{background:rgb(var(--acc) / 0.09);color:var(--ink);border-color:rgb(var(--acc) / 0.14);}
    .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;}
    .seg button{height:28px;border:0;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:var(--ink-2);}
    .seg button.on{background:var(--pill);color:var(--pill-ink);box-shadow:0 1px 2px rgb(var(--sh) / 0.2);}

    /* ══ Modal ══ */
    .modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:var(--scrim);
      backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
    .modal-box{background:var(--surface);border:1px solid var(--line);box-shadow:var(--pop);border-radius:12px;width:100%;max-width:440px;
      display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden;}
    .modal-header-sticky{flex-shrink:0;padding:14px 18px;border-bottom:1px solid var(--line);}
    .modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 18px;}
    @media(max-width:767px){.modal-box{max-height:calc(100vh - 100px);}}

    /* ══ Etiquetas ══ */
    .badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap;}
    .b-pink{background:rgb(var(--acc) / 0.08);color:var(--ink);}
    .b-violet{background:var(--violet-soft);color:var(--violet-ink);}
    .b-good{background:var(--good-soft);color:var(--good);}
    .b-bad{background:var(--bad-soft);color:var(--bad);}
    .b-warn{background:var(--warn-soft);color:var(--warn);}
    .b-mute{background:var(--mute);color:var(--ink-2);}

    ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:rgb(var(--acc) / 0.12);border-radius:4px;}
    @keyframes sheetUp{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
    .fade-up{animation:fadeUp .16s ease-out;}

    /* ══ Layout y texto ══ */
    .page{padding:26px 32px 0;}
    .page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
    .h1{font-size:20px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
    .h3{font-size:13px;font-weight:600;color:var(--ink);}
    .muted{font-size:13px;color:var(--ink-2);}
    .tiny{font-size:12px;color:var(--ink-3);}
    .over{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);}
    .col{display:flex;flex-direction:column;gap:2px;}
    .stack{display:flex;flex-direction:column;gap:10px;}
    .rowx{display:flex;align-items:center;gap:8px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    .cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start;}
    @media(max-width:980px){.kpis{grid-template-columns:1fr 1fr;}.cols2{grid-template-columns:1fr;}}
    @media(max-width:420px){.cards{grid-template-columns:1fr;}}
    label.lbl{font-size:12px;font-weight:500;color:var(--ink-2);display:block;margin-bottom:5px;}
    .empty-state{text-align:center;padding:40px 20px;}
    .empty-ic{width:40px;height:40px;border-radius:10px;background:rgb(var(--acc) / 0.06);color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
    .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .chip{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .num{font-variant-numeric:tabular-nums;}
    .list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
    .list-row:last-child{border-bottom:0;}
    .bar{width:12px;border-radius:3px 3px 0 0;transition:height .4s;}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
    .logo-word{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
    .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;
      font-size:13px;font-weight:500;box-shadow:var(--pop);max-width:calc(100vw - 32px);text-align:center;}

    /* ══ Textura y luz ══ */
    body{background:
      radial-gradient(1100px 520px at 28% -12%, var(--glow-a), transparent 62%),
      radial-gradient(700px 420px at 105% -5%, var(--glow-b), transparent 60%),
      var(--bg);background-attachment:fixed;}
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;background-image:url(grain.svg);background-size:180px;
      opacity:var(--grain-op);filter:invert(var(--grain-inv));}
    .card,.modal-box,.auth-card{background:linear-gradient(180deg,var(--sheen),transparent 140px),var(--surface);
      box-shadow:inset 0 1px 0 var(--edge-hi),var(--shadow);}
    .modal-box,.auth-card{box-shadow:inset 0 1px 0 var(--edge-hi),var(--pop);}
    .sidebar{background:linear-gradient(180deg,var(--sheen),transparent 320px),var(--side);}
    .nav-item.active{box-shadow:inset 0 1px 0 var(--edge-hi);}
    .btn-p,.fab{background:var(--btn-bg);box-shadow:var(--btn-glow);}
    .cal-day.today .cal-num{box-shadow:0 0 14px rgb(255 255 255 / 0.18);}
    .prog-fill{box-shadow:0 0 10px rgb(var(--acc) / 0.18);}

    /* ══ Botón + ══ */
    .fab-wrap{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
    .fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;
      box-shadow:var(--pop);transition:transform .15s ease, opacity .12s;}
    .fab:hover{opacity:.9;}
    .fab-menu{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:170px;box-shadow:var(--pop);}
    @media(max-width:767px){.fab-wrap{bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;}.fab{width:54px;height:54px;}}

    /* ══ Acceso ══ */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
    .auth-card{width:100%;max-width:360px;padding:28px 24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--pop);text-align:center;}

    /* ══ Calendario ══ */
    .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden;}
    .cal-head{font-size:11px;font-weight:500;color:var(--ink-3);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);}
    .cal-day{min-height:96px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:6px;cursor:pointer;
      text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0;transition:background .12s;}
    button.cal-day:hover{background:rgb(var(--acc) / 0.03);}
    .cal-day.sel{background:rgb(var(--acc) / 0.06);}
    .cal-day.off{cursor:default;background:rgb(var(--acc) / 0.015);}
    .cal-num{font-size:12px;font-weight:500;color:var(--ink-2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .cal-day.today .cal-num{background:var(--pink-deep);color:var(--on-acc);font-weight:600;}
    .cal-chips{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;}
    .cal-chip{font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:rgb(var(--acc) / 0.07);border-left:2px solid var(--pink-deep);}
    .cal-more{font-size:11px;color:var(--ink-3);padding-left:4px;}
    .cal-layout{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;align-items:start;}
    @media(max-width:1100px){.cal-layout{grid-template-columns:1fr;}}
    @media(max-width:767px){
      .cal-head{padding:6px 0;text-align:center;}
      .cal-day{min-height:52px;padding:4px 2px;align-items:center;}
      .cal-chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;}
      .cal-chip{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;border:0;background:var(--pink-deep);}
      .cal-more{display:none;}
    }
  </style>
</head>

const pad = n => String(n).padStart(2,'0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const buildPdf = (d,{biz,profile,clientName:cn,phone,paid}) => {
  const doc = new JsPDF({unit:'pt',format:'letter'});

  const pr=profile||{}, k=D_KIND[d.kind], until=docValidUntil(d);
  const ink=[20,20,22], gray=[107,107,116], hair=[225,225,230];
  const T=(t,x,y,o={})=>doc.text(pdfTxt(t),x,y,o);
  const font=(size,style='normal',c=ink)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); doc.setTextColor(...c); };
  // Encabezado
  font(17,'bold'); T(biz||'Mi negocio',M,62);
  const contact=[pr.phone&&('WhatsApp '+pr.phone),pr.instagram&&('@'+pr.instagram.replace(/^@/,'')),pr.email,pr.address].filter(Boolean).join('  ·  ');
  if(contact){ font(9,'normal',gray); doc.text(doc.splitTextToSize(pdfTxt(contact),300),M,78); }
  font(9,'bold',gray); T(k.title,R,52,{align:'right'});
  font(20,'bold'); T(folioOf(d),R,74,{align:'right'});
  font(9,'normal',gray); T(fmtLong(d.date),R,90,{align:'right'});
  doc.setDrawColor(...ink); doc.setLineWidth(1.5); doc.line(M,108,R,108);
  // Cliente
  let y=134;
  font(8,'bold',gray); T('CLIENTE',M,y); if(until) T('VÁLIDA HASTA',R,y,{align:'right'});
  font(11,'bold'); T(cn||'-',M,y+16); if(until){ font(10); T(fmtLong(until),R,y+16,{align:'right'}); }
  if(phone){ font(9,'normal',gray); T(phone,M,y+30); }
  // Conceptos
  y=192;
  const cols={qty:380,price:470,amt:R};
  const head=()=>{ font(8,'bold',gray); T('CONCEPTO',M,y); T('CANT.',cols.qty,y,{align:'right'}); T('PRECIO',cols.price,y,{align:'right'}); T('IMPORTE',cols.amt,y,{align:'right'});
    doc.setDrawColor(...hair); doc.setLineWidth(0.8); doc.line(M,y+8,R,y+8); y+=26; };
  head();
  (d.items||[]).forEach(i=>{
    const lines=doc.splitTextToSize(pdfTxt(i.desc),300), h=lines.length*13;
    if(y+h>H-140){ doc.addPage(); y=60; head(); }
    font(10); doc.text(lines,M,y);
    T(String(i.qty),cols.qty,y,{align:'right'}); T(fmtMoney(i.price),cols.price,y,{align:'right'});
    T(fmtMoney((Number(i.qty)||0)*(Number(i.price)||0)),cols.amt,y,{align:'right'});
    y+=h+8; doc.setDrawColor(...hair); doc.line(M,y-4,R,y-4); y+=10;
  });
  // Totales
  if(y>H-220){ doc.addPage(); y=60; }
  y+=6;
  const row=(l,v,bold)=>{ font(bold?12:10,bold?'bold':'normal',bold?ink:gray); T(l,400,y); font(bold?12:10,bold?'bold':'normal'); T(v,R,y,{align:'right'}); y+=bold?20:16; };
  row('Subtotal',fmtMoney(docSub(d)));
  if(Number(d.discount)) row('Descuento','- '+fmtMoney(d.discount));
  if(Number(d.taxRate)) row(taxLabel(d),fmtMoney(docTax(d)));
  doc.setDrawColor(...ink); doc.setLineWidth(1.5); doc.line(400,y-8,R,y-8); y+=8;
  row('Total',fmtMoney(docTotal(d)),true);
  if(d.kind==='nv'){ row('Pagado',fmtMoney(paid)); row('Saldo',fmtMoney(Math.max(0,docTotal(d)-paid)),true); }
  // Notas
  if(d.notes){
    const lines=doc.splitTextToSize(pdfTxt(d.notes),R-M-28), h=lines.length*13+22;
    if(y+h>H-70){ doc.addPage(); y=60; }
    y+=12; doc.setFillColor(245,245,247); doc.roundedRect(M,y,R-M,h,6,6,'F');
    font(9.5,'normal',[60,60,66]); doc.text(lines,M+14,y+18); y+=h;
  }
  // Pie
  const pages=doc.getNumberOfPages();
  for(let pg=1;pg<=pages;pg++){ doc.setPage(pg); doc.setDrawColor(...hair); doc.setLineWidth(0.8); doc.line(M,H-46,R,H-46);
    font(8,'normal',[138,138,147]); T('Este documento no es un comprobante fiscal.',M,H-32); T(folioOf(d)+(pages>1?`  ·  ${pg}/${pages}`:''),R,H-32,{align:'right'}); }
  return doc;
};

const runRecurring = (db,put) => {
  const rules=db.recurring||[]; if(!rules.length) return;
  const today=todayKey(), cur=today.slice(0,7);
  const add=[]; let changed=false;
  const next=rules.map(r=>{
    if(r.active===false) return r;
    let last=r.lastMonth||shiftMonth(r.startMonth||cur,-1), m=shiftMonth(last,1), upd=r;
    while(m<=cur){
      const date=`${m}-${pad(Math.min(Number(r.day)||1,daysIn(m)))}`;
      if(date>today) break;
      if(!db.txns.some(t=>t.recurringId===r.id&&(t.date||'').startsWith(m)))
        add.push({id:uid(),type:'expense',amount:Number(r.amount)||0,category:r.category||'Otro gasto',note:r.note||'',date,projectId:'',recurringId:r.id});
      upd={...upd,lastMonth:m}; changed=true; m=shiftMonth(m,1);
    }
    return upd;
  });
  if(add.length) put('txns',[...add,...db.txns]);
  if(changed) put('recurring',next);
};

  <svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke=${c} stroke-width=${sw} stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML=${{__html:ICON[n]||''}}/>
`;

const Modal = ({open,onClose,title,children,wide}) => {
  if(!open) return null;
  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal-box fade-up" style=${wide?{maxWidth:'720px'}:null} onClick=${e=>e.stopPropagation()}>
        <div class="modal-header-sticky">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <h3 style="font-size:16px;font-weight:600">${title}</h3>
            <button class="icon-btn" onClick=${onClose} aria-label="Cerrar"><${Ic} n="x" s=${16}/></button>
          </div>
        </div>
        <div class="modal-body">${children}</div>
      </div>
    </div>
  `;
};
const EMPTY_IC = {'🏷️':'tag','🔁':'repeat','🧾':'doc','💸':'finance','📅':'cal','💖':'check','💼':'proj','👤':'user'};
const Empty = ({emo,title,text}) => html`
  <div class="card empty-state"><div class="empty-ic"><${Ic} n=${EMPTY_IC[emo]||'plus'} s=${18}/></div>
    ${title&&html`<p class="h3" style="margin-bottom:4px">${title}</p>`}
    <p class="muted">${text}</p>

// Confirmación antes de eliminar: App registra el diálogo en bus.ask
const bus = {ask:null};
const ask = (msg,fn,detail) => { if(bus.ask) bus.ask({msg,fn,detail}); else fn(); };
const FormActions = ({isEdit,onDelete,onSave,label,what,detail}) => html`
  <div style="display:flex;gap:8px;margin-top:4px">
    ${isEdit&&html`<button class="btn-d" style="flex:1" onClick=${()=>ask(`¿Eliminar ${what||'este registro'}?`,onDelete,detail)}>Eliminar</button>`}
    <button class="btn-p" style="flex:2;justify-content:center" onClick=${onSave}>${isEdit?'Guardar cambios':label}</button>
  </div>`;
const TimePick = ({value,onChange}) => {
  const [h,m] = (value||'').split(':');
  const mins = ['00','10','20','30','40','50'];
  if(m&&!mins.includes(m)){ mins.push(m); mins.sort(); }
  const lab = n => `${n%12||12} ${n<12?'AM':'PM'}`;
  return html`
    <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:6px">
      <select aria-label="Hora" value=${h||''} style="padding-left:10px;padding-right:4px" onChange=${e=>onChange(e.target.value?`${e.target.value}:${m||'00'}`:'')}>
        <option value="">Sin hora</option>
        ${Array.from({length:24},(_,i)=>html`<option value=${pad(i)}>${lab(i)}</option>`)}
      </select>
      <select aria-label="Minutos" value=${h?(m||'00'):''} disabled=${!h} style="padding-left:10px;padding-right:4px" onChange=${e=>onChange(`${h}:${e.target.value}`)}>
        ${!h&&html`<option value="">min</option>`}
        ${mins.map(x=>html`<option value=${x}>:${x}</option>`)}
      </select>
    </div>`;
};

  return html`<div>
      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar cita':'Nueva cita'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div>

            <select value=${f.projectId||''} onChange=${e=>pickProject(e.target.value)}>

            </select>
            ${projects.length===0&&html`<p class="tiny" style="margin-top:6px">Aún no tienes proyectos. <a href="#" style="color:var(--pink-deep);font-weight:600" onClick=${e=>{e.preventDefault();setF(null);setTab('projects');}}>Crea uno</a> para poder elegirlo aquí.</p>`}
          </div>
          ${(db.services||[]).length>0&&html`<div><label class="lbl">Servicio</label>
            <select value=${f.serviceId||''} onChange=${e=>pickService(e.target.value)}><option value="">Sin servicio</option>

                <b class="num" style="font-size:13px">${fmtMoney(t.amount)}</b>
                <button class="icon-btn" style="padding:2px" onClick=${()=>ask('¿Quitar este pago?',()=>delPay(t.id),'También se borra de Finanzas.')} aria-label="Quitar pago"><${Ic} n="x" s=${12}/></button>
              </div>`)}

          <div><label class="lbl">Estado</label><select value=${f.status} onChange=${e=>setF({...f,status:e.target.value})}>${Object.entries(A_STATUS).map(([k,v])=>html`<option value=${k}>${v.l}</option>`)}</select></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Agendar cita" what="esta cita" detail="Los pagos que ya registraste se quedan en Finanzas." onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>

      <${Modal} open=${!!pay} onClose=${()=>setPay(null)} title="Agregar pago">
        ${pay&&html`<div class="stack" style="gap:12px">
          <p class="muted"><b style="color:var(--ink)">${name(pay.appt)}</b>${clientName(db,pay.appt)?` · ${clientName(db,pay.appt)}`:''} — falta <b class="num" style="color:var(--ink)">${fmtMoney(owed(pay.appt))}</b></p>
          <div class="grid2">
            <div><label class="lbl">Monto del pago</label><input type="number" inputmode="decimal" min="0" value=${pay.amount} onInput=${e=>setPay({...pay,amount:e.target.value})} autoFocus/></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${pay.date} onInput=${e=>setPay({...pay,date:e.target.value})}/></div>
          </div>
          <p class="tiny">Se acredita como ingreso en Finanzas.</p>
          <button class="btn-p" style="width:100%;justify-content:center" onClick=${savePay}>Registrar pago</button>
        </div>`}
      <//>

      <${Modal} open=${!!cur} onClose=${()=>setView(null)} title="Cita">
        ${cur&&html`<div class="stack" style="gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="min-width:0">
              <p style="font-size:16px;font-weight:600">${name(cur)}</p>

const TxnForm = ({db,put}) => {
  const today = todayKey();
  const {txns,projects} = db;
  const [f,setF] = useState(null);
  const blank = type => ({type,amount:'',category:FCATS[type][0],note:'',date:today,projectId:''});
  const saveF = () => {
    if(!Number(f.amount))return;
    const {repeat,...rest} = f;
    let item = {...rest,amount:Number(f.amount)};
    if(repeat&&!f.id&&f.type==='expense'){
      const rid=uid();
      put('recurring',[...(db.recurring||[]),{id:rid,amount:item.amount,category:item.category,note:item.note,day:Number((item.date||todayKey()).slice(8))||1,
        startMonth:(item.date||todayKey()).slice(0,7),lastMonth:(item.date||todayKey()).slice(0,7),active:true}]);
      item={...item,recurringId:rid};
    }
    put('txns',upsert(txns,item)); setF(null);
  };
  const del = id => put('txns',txns.filter(x=>x.id!==id));
  const cats = f ? [...new Set([...FCATS[f.type],f.category])] : [];
  act.newTxn = type => { setScan(null); setF(blank(type)); };
  // Foto de ticket → se reduce en el navegador, Claude la lee en /api/scan-receipt y no se guarda.
  const fileRef = useRef(null);
  const [scan,setScan] = useState(null);   // null | {busy} | {ok,msg} | {err}
  act.scanExpense = () => { setScan(null); setF(blank('expense')); fileRef.current&&fileRef.current.click(); };
  const shrink = async file => {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.82).split(',')[1];
  };
  const onPhoto = async e => {
    const file = e.target.files&&e.target.files[0]; e.target.value='';
    if(!file) return;
    if(!sb){ setScan({err:'El escaneo necesita que inicies sesión en la app.'}); return; }
    setScan({busy:true});
    try{
      const {data} = await sb.auth.getSession();
      if(!data.session){ setScan({err:'Inicia sesión para escanear tickets.'}); return; }
      const image = await shrink(file);
      const r = await fetch('/api/scan-receipt',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({image,media_type:'image/jpeg'})});
      if(r.status===404||r.status===405&&location.hostname==='localhost'){ setScan({err:'El escaneo solo funciona en el sitio publicado en Vercel.'}); return; }
      const out = await r.json().catch(()=>({error:'Respuesta inválida.'}));
      if(!r.ok){ setScan({err:out.error||'No se pudo leer el ticket.'}); return; }
      setF(cur=>({...(cur||blank('expense')),type:'expense',
        amount: out.amount?String(out.amount):(cur&&cur.amount)||'',
        date: /^\d{4}-\d{2}-\d{2}$/.test(out.date)?out.date:(cur&&cur.date)||today,
        category: FCATS.expense.includes(out.category)?out.category:'Otro gasto',
        note: [out.merchant,out.concept].filter(Boolean).join(' — ')}));
      setScan({ok:true,msg:'Listo. Revisa los datos antes de guardar.'});
    }catch(err){ setScan({err:'No se pudo procesar la foto. Intenta con otra.'}); }
  };
  act.editTxn = t => setF({projectId:'',...t,amount:String(t.amount)});
  return html`<div>
      <input ref=${fileRef} type="file" accept="image/*" capture="environment" style="display:none" onChange=${onPhoto}/>
      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar movimiento':'Nuevo movimiento'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div class="seg">
            ${[['income','Ingreso'],['expense','Gasto']].map(([tp,l])=>html`<button class=${f.type===tp?'on':''} onClick=${()=>setF({...f,type:tp,category:FCATS[tp][0]})}>${l}</button>`)}
          </div>
          ${f.type==='expense'&&!f.id&&planHas('scan')&&html`
            <button class="btn-g" style="width:100%;min-height:38px" disabled=${scan&&scan.busy} onClick=${()=>fileRef.current&&fileRef.current.click()}>
              <${Ic} n="cam" s=${15}/>${scan&&scan.busy?'Leyendo el ticket…':'Llenar con foto del ticket'}
            </button>
            ${scan&&scan.err&&html`<p class="tiny" style="color:var(--bad);margin-top:-4px">${scan.err}</p>`}
            ${scan&&scan.ok&&html`<p class="tiny" style="color:var(--good);margin-top:-4px">${scan.msg}</p>`}`}
          <div><label class="lbl">Monto</label><input type="number" inputmode="decimal" min="0" value=${f.amount} onInput=${e=>setF({...f,amount:e.target.value})} placeholder="0" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Categoría</label><select value=${f.category} onChange=${e=>setF({...f,category:e.target.value})}>${cats.map(c=>html`<option value=${c}>${c}</option>`)}</select></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
          </div>
          <div><label class="lbl">Descripción</label><input value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Cliente, proveedor o concepto"/></div>
          ${f.type==='expense'&&!f.id&&html`<label class="rowx" style="cursor:pointer"><input type="checkbox" style="width:auto" checked=${!!f.repeat} onChange=${e=>setF({...f,repeat:e.target.checked})}/><span class="muted">Repetir cada mes (gasto fijo: renta, suscripciones…)</span></label>`}
          ${projects.length>0&&html`<div><label class="lbl">Proyecto (opcional)</label><select value=${f.projectId||''} onChange=${e=>setF({...f,projectId:e.target.value})}><option value="">Sin proyecto</option>${projects.map(p=>html`<option value=${p.id}>${p.name}</option>`)}</select></div>`}
          <${FormActions} isEdit=${!!f.id} label="Guardar" what="este movimiento" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>

      <//>
  </div>`;
};

const DocForm = ({db,put,biz,profile}) => {
  const today = todayKey();
  const {txns} = db;
  const docs = db.docs||[], clients = db.clients||[];
  const [f,setF] = useState(null);
  const [pay,setPay] = useState(null);
  const blankItem = () => ({id:uid(),desc:'',qty:1,price:''});
  const pTax = Number(profile&&profile.taxRate)||0, pTaxName = (profile&&profile.taxName)||'IVA';
  const [note,setNote] = useState('');
  const blank = kind => ({kind,client:'',phone:'',date:today,validDays:kind==='cot'?15:'',items:[blankItem()],discount:'',taxRate:pTax,taxName:pTaxName,
    notes:(profile&&profile.terms)||'',status:kind==='cot'?'borrador':'pendiente',anticipo:''});
  act.newDoc = (kind,pre={}) => { loadPdf(); setNote(''); setPay(null); setF({...blank(kind),...pre}); };
  act.editDoc = d => { loadPdf(); setNote(''); setPay(null); setF({...d,client:clientName(db,d),phone:(clientOf(db,d.clientId)||{}).phone||'',
    items:(d.items||[]).map(i=>({...i,price:String(i.price)})),discount:d.discount?String(d.discount):'',anticipo:''}); };
  const setItem = (ix,patch) => setF({...f,items:f.items.map((it,i)=>i===ix?{...it,...patch}:it)});
  // Guarda sin cerrar y devuelve el documento guardado (para PDF y WhatsApp).
  const persist = (extra={}) => {
    const items = f.items.filter(i=>(i.desc||'').trim()||Number(i.price)).map(i=>({id:i.id||uid(),desc:(i.desc||'').trim(),qty:Number(i.qty)||1,price:Number(i.price)||0,svcId:i.svcId||''}));
    if(!items.length){ alert('Agrega al menos un concepto.'); return null; }
    const nm=(f.client||'').trim();
    const cid=ensureClient(clients,put,nm,f.phone,today);
    const {phone,anticipo,...rest} = f;
    const item = {...rest,...extra,client:nm,clientId:cid,items,discount:Number(f.discount)||0,validDays:Number(f.validDays)||0,taxRate:Number(f.taxRate)||0,taxName:f.taxName||pTaxName,
      id:f.id||uid(),folio:f.folio||nextFolio(docs,f.kind),createdAt:f.createdAt||today};
    put('docs',f.id?docs.map(x=>x.id===item.id?item:x):[...docs,item]);
    if(!f.id&&f.kind==='nv'&&Number(anticipo)>0)
      put('txns',[{id:uid(),type:'income',amount:Number(anticipo),category:'Anticipo',note:`${folioOf(item)}${nm?' — '+nm:''}`,date:today,docId:item.id,projectId:''},...txns]);
    setF({...item,client:nm,phone:f.phone,items:item.items.map(i=>({...i,price:String(i.price)})),discount:item.discount?String(item.discount):'',anticipo:''});
    return item;
  };
  const ctx = d => ({biz,profile,clientName:(f.client||'').trim(),phone:(f.phone||'').trim(),paid:docPaid(txns,d.id)});
  const doPdf = async () => {
    const d=persist(); if(!d) return;
    try{ await loadPdf(); buildPdf(d,ctx(d)).save(`${folioOf(d)}.pdf`); setNote(''); }
    catch(e){ setNote('No se pudo generar el PDF. Revisa tu conexión e intenta de nuevo.'); }
  };
  // WhatsApp: en celular se comparte el PDF + mensaje con el menú de Compartir; si no se puede, se descarga y se abre el chat.
  const doWa = async () => {
    const d=persist(f.kind==='cot'&&(!f.status||f.status==='borrador')?{status:'enviada'}:{}); if(!d) return;
    const c=ctx(d);
    let pdf=null;
    try{ await loadPdf(); pdf=buildPdf(d,c); }catch(e){}
    if(pdf){
      const file=new File([pdf.output('blob')],`${folioOf(d)}.pdf`,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],text:docWaText(d,c)}); setNote(''); return; }
        catch(e){ if(e&&e.name==='AbortError') return; }
      }
      pdf.save(`${folioOf(d)}.pdf`);
    }
    window.open(docWaUrl(d,c),'_blank','noopener');
    setNote(pdf?'Se descargó el PDF y se abrió el chat: adjunta el archivo en WhatsApp.':'Se abrió el chat de WhatsApp, pero no se pudo generar el PDF.');
  };
  const toNota = () => {
    const d=persist({status:'aceptada'}); if(!d) return;
    setF({...blank('nv'),client:f.client,phone:f.phone,notes:d.notes,discount:d.discount?String(d.discount):'',taxRate:d.taxRate||0,taxName:d.taxName||pTaxName,fromId:d.id,
      items:d.items.map(i=>({...i,id:uid(),price:String(i.price)}))});
  };
  const toCita = () => { const d=persist(); if(!d) return; setF(null); act.newAppt({client:f.client,phone:f.phone,price:String(docTotal(d)),note:folioOf(d)}); };
  const savePay = () => {
    if(!(Number(pay.amount)>0)) return;
    const paidNow=docPaid(txns,f.id);
    put('txns',[{id:uid(),type:'income',amount:Number(pay.amount),category:paidNow>0?'Abono':'Anticipo',note:`${folioOf(f)}${f.client?' — '+f.client:''}`,date:pay.date,docId:f.id,projectId:''},...txns]);
    setPay(null);
  };
  const del = id => put('docs',docs.filter(d=>d.id!==id));
  if(!f) return null;
  const sub=docSub(f), tot=docTotal(f), isNv=f.kind==='nv';
  const paid=f.id?docPaid(txns,f.id):0, owe=isNv?Math.max(0,tot-paid):0;

    <div class="stack" style="gap:14px">
      ${st&&html`<div class="rowx" style="justify-content:space-between;flex-wrap:wrap">
        <span class=${'badge '+D_STATUS[st].b}>${D_STATUS[st].l}</span>
        ${f.fromId&&html`<span class="tiny">Viene de ${folioOf((docs.find(x=>x.id===f.fromId))||{kind:'cot',folio:0})}</span>`}
      </div>`}
      <${ClientField} clients=${clients} name=${f.client} phone=${f.phone||''} onChange=${v=>setF({...f,...v})}/>
      <div class="grid2">
        <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
        ${isNv
          ? html`<div><label class="lbl">Estado</label><select value=${f.status==='cancelada'?'cancelada':'activa'} onChange=${e=>setF({...f,status:e.target.value==='cancelada'?'cancelada':'pendiente'})}><option value="activa">Activa</option><option value="cancelada">Cancelada</option></select></div>`
          : html`<div class="grid2" style="gap:8px">
              <div><label class="lbl">Vigencia (días)</label><input type="number" min="0" value=${f.validDays} onInput=${e=>setF({...f,validDays:e.target.value})}/></div>
              <div><label class="lbl">Estado</label><select value=${f.status||'borrador'} onChange=${e=>setF({...f,status:e.target.value})}>${['borrador','enviada','aceptada','rechazada'].map(k=>html`<option value=${k}>${D_STATUS[k].l}</option>`)}</select></div>
            </div>`}
      </div>

      <div>
        ${(db.services||[]).filter(x=>x.active!==false).length>0&&html`<select value="" style="margin-bottom:8px" onChange=${e=>{const sv=(db.services||[]).find(x=>x.id===e.target.value); if(sv) setF({...f,items:[...f.items.filter(i=>(i.desc||'').trim()||Number(i.price)),{id:uid(),desc:sv.name,qty:1,price:String(sv.price),svcId:sv.id}]}); e.target.value='';}}>
          <option value="">+ Agregar del catálogo…</option>${(db.services||[]).filter(x=>x.active!==false).map(x=>html`<option value=${x.id}>${x.name} · ${fmtMoney(x.price)}</option>`)}
        </select>`}
        <div style="display:grid;grid-template-columns:1fr 64px 110px 28px;gap:6px;margin-bottom:5px">
          <span class="lbl" style="margin:0">Concepto</span><span class="lbl" style="margin:0">Cant.</span><span class="lbl" style="margin:0">Precio</span><span/>
        </div>
        <div class="stack" style="gap:6px">
          ${f.items.map((it,ix)=>html`
            <div style="display:grid;grid-template-columns:1fr 64px 110px 28px;gap:6px;align-items:center">
              <input value=${it.desc} placeholder="Ej. Sesión de fotos 1 hora" onInput=${e=>setItem(ix,{desc:e.target.value})}/>
              <input type="number" min="0" value=${it.qty} onInput=${e=>setItem(ix,{qty:e.target.value})}/>
              <input type="number" inputmode="decimal" min="0" value=${it.price} placeholder="0" onInput=${e=>setItem(ix,{price:e.target.value})}/>
              <button class="icon-btn" aria-label="Quitar concepto" onClick=${()=>setF({...f,items:f.items.length>1?f.items.filter((_,i)=>i!==ix):[blankItem()]})}><${Ic} n="x" s=${14}/></button>
            </div>`)}
          <button class="btn-g" style="justify-content:center" onClick=${()=>setF({...f,items:[...f.items,blankItem()]})}><${Ic} n="plus" s=${14}/>Agregar concepto</button>
        </div>

      <div style="display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start">
        <div><label class="lbl">Notas y condiciones</label><textarea rows="4" style="resize:vertical" value=${f.notes} onInput=${e=>setF({...f,notes:e.target.value})} placeholder="Ej. Anticipo del 50% para apartar la fecha."/></div>
        <div class="stack" style="gap:6px;padding:12px;background:var(--surface-2);border-radius:8px">

    </div>
  <//>`;
};

const chartBuckets = per => {
  const now = new Date();
  if(per==='año') return Array.from({length:5},(_,i)=>now.getFullYear()-4+i).map(y=>({id:String(y),l:String(y),full:`Año ${y}`,from:`${y}-01-01`,to:`${y}-12-31`}));
  if(per==='semana'){
    const mon = addDays(now,-((now.getDay()+6)%7));
    return Array.from({length:8},(_,i)=>addDays(mon,-7*(7-i))).map(st=>{
      const from=dKey(st), to=dKey(addDays(st,6));
      return {id:from,l:`${st.getDate()} ${st.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}`,full:`Semana del ${fmtDate(from)} al ${fmtDate(to)}`,from,to};
    });
  }
  const mo = todayKey().slice(0,7);
  return Array.from({length:6},(_,i)=>shiftMonth(mo,i-5)).map(ym=>({id:ym,l:new Date(ym+'-15T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.',''),full:fmtMonth(ym),from:ym+'-01',to:ym+'-31'}));
};

  const margin = inc ? Math.round(net/inc*100) : null;

  const maxV = Math.max(...series.flatMap(m=>[m.inc,m.exp]),1);

  const byCat={}; inMo.filter(t=>t.type==='expense').forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const debtors = appts.filter(a=>apptOwed(txns,a)>0);
  const todays = appts.filter(a=>a.date===today&&a.status!=='cancelada').sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const pastDebt = appts.filter(a=>a.date<today&&apptOwed(txns,a)>0);
  const owedTotal = debtors.reduce((s,a)=>s+apptOwed(txns,a),0);

  const kpis = [
    {l:'Ingresos del mes', v:fmtMoney(inc), d:delta(inc,pInc), goodUp:true, i:'up', bg:'var(--pink-soft)', c:C_INC},
    {l:'Gastos del mes',   v:fmtMoney(exp), d:delta(exp,pExp), goodUp:false, i:'down', bg:'var(--violet-soft)', c:C_EXP},
    {l:'Utilidad',         v:fmtMoney(net), sub:margin===null?'Sin ingresos aún':`Margen ${margin}%`, i:'finance', bg:net>=0?'var(--good-soft)':'var(--bad-soft)', c:net>=0?'var(--good)':'var(--bad)'},
    {l:'Por cobrar',       v:fmtMoney(owedTotal), sub:debtors.length?`${debtors.length} cita${debtors.length===1?'':'s'} con saldo`:'Nadie te debe', i:'cal', bg:'var(--warn-soft)', c:'var(--warn)'},
  ];

  return html`
    <div class="page fade-up">

        ${todays.length===0&&html`<p class="muted" style="padding:6px 0">No tienes citas hoy.</p>`}
        ${todays.map(a=>{const ow=apptOwed(txns,a);const st=A_STATUS[a.status]||A_STATUS.pendiente;return html`
          <div class="list-row">
            <div class=${'check-box'+(a.status==='hecha'?' done':'')} onClick=${()=>act.toggleDone(a)} title="Marcar como realizada">${a.status==='hecha'&&html`<${Ic} n="check" s=${12} c="var(--on-acc)"/>`}</div>
            <span class="num" style="width:44px;font-weight:600;flex-shrink:0">${a.time||'—'}</span>
            <div style="flex:1;min-width:0;cursor:pointer" onClick=${()=>act.viewAppt(a)}>
              <p class="ellip" style=${{fontSize:13,fontWeight:600,textDecoration:a.status==='hecha'?'line-through':'none'}}>${apptName(db,a)}</p>
              <p class="tiny ellip">${clientName(db,a)||'Sin cliente'}</p>
            </div>
            ${ow>0?html`<button class="btn-g" style="min-height:28px;font-size:12px" onClick=${()=>act.pay(a)}>Cobrar ${fmtMoney(ow)}</button>`:html`<span class=${'badge '+(a.price>0&&a.status!=='cancelada'?'b-good':st.b)}>${a.price>0&&a.status!=='cancelada'?'Pagado':st.l}</span>`}
          </div>`;})}
        ${pastDebt.length>0&&html`<p class="tiny" style="margin-top:10px">Además, ${pastDebt.length} cita${pastDebt.length===1?'':'s'} anterior${pastDebt.length===1?'':'es'} te deben <b class="num" style="color:var(--ink)">${fmtMoney(pastDebt.reduce((s,a)=>s+apptOwed(txns,a),0))}</b>. <a href="#" style="color:var(--ink-2)" onClick=${e=>{e.preventDefault();setTab('appts');}}>Ver citas</a></p>`}
      </div>

      <div class="kpis">
        ${kpis.map(k=>html`
          <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <span class="muted" style="font-weight:500">${k.l}</span>
              <div class="chip" style=${{background:k.bg,width:30,height:30,borderRadius:8}}><${Ic} n=${k.i} s=${15} c=${k.c}/></div>
            </div>
            <p class="num" style="font-size:24px;font-weight:600;letter-spacing:-0.02em">${k.v}</p>
            <p class="tiny" style="margin-top:4px">
              ${k.sub || (k.d===null ? 'Sin datos del mes pasado' : html`<span style=${{fontWeight:600,color:(k.d>=0)===k.goodUp?'var(--good)':'var(--bad)'}}>${k.d>=0?'▲':'▼'} ${Math.abs(k.d)}%</span> vs mes pasado`)}
            </p>
          </div>
        `)}
      </div>

      ${(()=>{ const goal=Number((profile||{}).monthGoal)||0, left=daysIn(mo)-Number(today.slice(8))+1, falta=Math.max(0,goal-inc), pct=goal?Math.min(100,Math.round(inc/goal*100)):0;
        return html`<div class="card" style="margin-bottom:16px">
          <${CardHead} title="Meta del mes" action=${gEdit===null?(goal?'Cambiar':'+ Definir meta'):''} onAction=${()=>setGEdit(goal?String(goal):'')}/>
          ${gEdit!==null?html`<div class="rowx" style="flex-wrap:wrap"><input type="number" min="0" value=${gEdit} onInput=${e=>setGEdit(e.target.value)} placeholder="Ingresos que quieres este mes" style="max-width:220px"/>
              <button class="btn-p" onClick=${()=>{setProfile({...(profile||{}),monthGoal:Number(gEdit)||0});setGEdit(null);}}>Guardar</button><button class="btn-g" onClick=${()=>setGEdit(null)}>Cancelar</button></div>`
          : !goal ? html`<p class="muted">Ponte una meta de ingresos y te digo cuánto te falta cada día.</p>`
          : html`<div class="rowx" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap"><span class="num" style="font-size:20px;font-weight:600">${fmtMoney(inc)} <span class="muted" style="font-size:13px;font-weight:400">de ${fmtMoney(goal)}</span></span><span class="num muted" style="font-weight:600">${pct}%</span></div>
              <div class="prog-track" style="height:6px"><div class="prog-fill" style=${{width:pct+'%'}}/></div>
              <p class="tiny" style="margin-top:8px">${falta>0?`Te faltan ${fmtMoney(falta)} en ${left} día${left===1?'':'s'}: unos ${fmtMoney(Math.ceil(falta/left))} por día.`:'¡Meta cumplida este mes!'}</p>`}
        </div>`; })()}

      <div class="cols2">
        <div class="stack" style="gap:16px">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
              <p class="h3">Ingresos vs gastos</p>
              <div class="rowx" style="gap:6px">
                ${[['semana','Semanal'],['mes','Mensual'],['año','Anual']].map(([v,l])=>html`<button class=${'tab-pill'+(per===v?' active':'')} style="padding:5px 12px;font-size:11px" onClick=${()=>{setPer(v);setHov(null);}}>${l}</button>`)}
              </div>

            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
              <p class="tiny" style="text-transform:capitalize">${shown.full}</p>
              <div style="display:flex;gap:14px;flex-wrap:wrap">
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_INC}}/>Ingresos <b class="num" style="color:var(--ink)">${fmtMoney(shown.inc)}</b></span>
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_EXP}}/>Gastos <b class="num" style="color:var(--ink)">${fmtMoney(shown.exp)}</b></span>
              </div>
            </div>
            <div style="position:relative;height:150px;border-bottom:1px solid rgb(var(--acc) / 0.18)">
              <div style="position:absolute;left:0;right:0;top:0;border-top:1px dashed rgb(var(--acc) / 0.14)"/>
              <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgb(var(--acc) / 0.14)"/>
              <span class="tiny num" style="position:absolute;left:0;top:2px">${fmtMoney(maxV)}</span>
              <div style="position:absolute;inset:0;display:flex;align-items:flex-end">
                ${series.map(m=>html`
                  <div onMouseEnter=${()=>setHov(m.id)} onMouseLeave=${()=>setHov(null)} onClick=${()=>setHov(m.id)}
                       style=${{flex:1,height:'100%',display:'flex',alignItems:'flex-end',justifyContent:'center',gap:2,cursor:'default',borderRadius:8,background:shown.id===m.id?'rgb(var(--acc) / 0.05)':'transparent'}}>
                    <div class="bar" style=${{background:C_INC,height:`${m.inc?Math.max(3,m.inc/maxV*140):0}px`}}/>
                    <div class="bar" style=${{background:C_EXP,height:`${m.exp?Math.max(3,m.exp/maxV*140):0}px`}}/>
                  </div>
                `)}
              </div>
            </div>
            <div style="display:flex;margin-top:6px">
              ${series.map(m=>html`<span class="tiny" style=${{flex:1,textAlign:'center',fontSize:10,fontWeight:shown.id===m.id?600:400,color:shown.id===m.id?'var(--ink)':'var(--ink-3)'}}>${m.l}</span>`)}
            </div>
          </div>

          <div class="card">
            <${CardHead} title="Proyectos y sus metas" action="Ver todos" onAction=${()=>setTab('projects')}/>
            ${active.length===0&&html`<p class="muted" style="padding:10px 0">Aún no hay proyectos activos.</p>`}
            ${active.map(p=>{const st=projStats(db,p);return html`
              <div class="list-row">
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${p.name}</p>
                  <p class="tiny ellip">${goalText(p,st)}</p>
                </div>
                <div class="prog-track" style="width:80px"><div class="prog-fill" style=${{width:`${st.pct}%`}}/></div>
                <span class="num muted" style="min-width:34px;text-align:right;font-weight:600">${st.pct}%</span>
              </div>`;})}
          </div>
        </div>

        <div class="stack" style="gap:16px">
          <div class="card">
            <${CardHead} title="Próximas citas" action="Calendario" onAction=${()=>setTab('cal')}/>
            ${upcoming.length===0&&html`<p class="muted" style="padding:10px 0">No tienes citas pendientes.</p>`}
            ${upcoming.map(a=>html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>act.viewAppt(a)}>
                <div class="chip" style="background:var(--pink-soft);flex-direction:column;width:42px;height:42px">
                  <span style="font-size:14px;font-weight:700;color:var(--pink-deep);line-height:1">${Number(a.date.slice(8))}</span>
                  <span style="font-size:9px;font-weight:600;color:var(--pink-deep);text-transform:uppercase">${new Date(a.date+'T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.','')}</span>
                </div>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${apptName(db,a)}</p>
                  <p class="tiny ellip">${a.date===today?'Hoy':fmtDate(a.date)}${a.time?` · ${a.time}`:''}${clientName(db,a)?` · ${clientName(db,a)}`:''}</p>
                </div>
                ${apptOwed(txns,a)>0&&html`<span class="badge b-warn num">Falta ${fmtMoney(apptOwed(txns,a))}</span>`}

                <span class="num" style="font-size:12px;font-weight:600;min-width:72px;text-align:right">${fmtMoney(a)}</span>

};

// PAGE: FINANCE  (ingresos y egresos)
// ══════════════════════════════════════════════════════════════════════════
const PageFinance = ({db,put}) => {
  const [rf,setRf] = useState(null);
  const rules = db.recurring||[];
  const saveRf = () => { if(!Number(rf.amount)||!rf.note.trim())return; const it={...rf,amount:Number(rf.amount),day:Math.min(28,Math.max(1,Number(rf.day)||1))};
    if(!rf.id){ const cur=todayKey().slice(0,7); it.id=uid(); it.startMonth=rf.thisMonth?cur:shiftMonth(cur,1); delete it.thisMonth; put('recurring',[...rules,it]); }
    else put('recurring',rules.map(r=>r.id===it.id?it:r));
    setRf(null); setTimeout(()=>runRecurring({...db,recurring:rf.id?rules.map(r=>r.id===it.id?it:r):[...rules,it]},put),0); };
  const today = todayKey();
  const {txns,projects} = db;
  const [ym,setYm] = useState(today.slice(0,7));
  const [scope,setScope] = useState('mes');
  const [kind,setKind] = useState('todos');


  const pfx = scope==='mes'?ym:ym.slice(0,4);
  const inP = txns.filter(t=>(t.date||'').startsWith(pfx));
  const inc = sum(inP,'income'), exp = sum(inP,'expense'), bal = inc-exp;
  const list = inP.filter(t=>kind==='todos'||t.type===kind).sort((a,b)=>b.date.localeCompare(a.date));
  const byDay={}; list.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t);});
  const pName = id => (projects.find(p=>p.id===id)||{}).name;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Ingresos y egresos</h2><p class="muted">${scope==='mes'?fmtMonth(ym):`Año ${ym.slice(0,4)}`}</p></div>
        <div class="rowx" style="gap:8px">
          <button class="btn-g" onClick=${()=>act.newTxn('expense')}><${Ic} n="down" s=${14}/>Gasto</button>
          <button class="btn-p" onClick=${()=>act.newTxn('income')}><${Ic} n="up" s=${14} c="var(--on-acc)"/>Ingreso</button>
        </div>
      </div>

      <div class="rowx" style="margin-bottom:16px;flex-wrap:wrap">
        <div class="rowx" style="gap:2px;background:var(--pill);border:1px solid var(--line);border-radius:20px;padding:2px">
          <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,scope==='mes'?-1:-12))} aria-label="Anterior"><${Ic} n="left" s=${16}/></button>
          <span style="font-size:12px;font-weight:600;min-width:110px;text-align:center">${scope==='mes'?fmtMonth(ym):ym.slice(0,4)}</span>
          <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,scope==='mes'?1:12))} aria-label="Siguiente"><${Ic} n="right" s=${16}/></button>
        </div>
        ${[['mes','Mes'],['año','Año']].map(([v,l])=>html`<button class=${'tab-pill'+(scope===v?' active':'')} onClick=${()=>setScope(v)}>${l}</button>`)}
      </div>

      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        ${[
          {l:'Ingresos',v:inc,i:'up',bg:'var(--pink-soft)',c:C_INC},
          {l:'Gastos',v:exp,i:'down',bg:'var(--violet-soft)',c:C_EXP},
          {l:'Utilidad',v:bal,i:'finance',bg:bal>=0?'var(--good-soft)':'var(--bad-soft)',c:bal>=0?'var(--good)':'var(--bad)'},
        ].map(s=>html`
          <div class="card" style="padding:14px">
            <div class="rowx" style="gap:8px;margin-bottom:6px"><div class="chip" style=${{background:s.bg,width:26,height:26,borderRadius:9}}><${Ic} n=${s.i} s=${13} c=${s.c}/></div><span class="muted">${s.l}</span></div>
            <p class="num" style="font-size:19px;font-weight:700;letter-spacing:-0.3px">${fmtMoney(s.v)}</p>
          </div>`)}
      </div>

      <div class="rowx" style="margin-bottom:14px;overflow-x:auto">
        ${[['todos','Todos'],['income','Ingresos'],['expense','Gastos']].map(([v,l])=>html`<button class=${'tab-pill'+(kind===v?' active':'')} onClick=${()=>setKind(v)}>${l}</button>`)}
      </div>

      ${list.length===0&&html`<${Empty} emo="💸" title="Sin movimientos" text="Registra tu primer ingreso o gasto de este periodo."/>`}
      ${Object.entries(byDay).map(([day,ts])=>html`
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;padding:0 4px">
            <span class="muted" style="font-weight:600;text-transform:capitalize">${day===today?'Hoy':fmtDate(day)}</span>
            <span class="tiny num">${fmtMoney(sum(ts,'income')-sum(ts,'expense'))}</span>
          </div>
          <div class="card" style="padding:4px 16px">
            ${ts.map(t=>html`
              <div class="list-row">
                <div class="chip" style=${{background:t.type==='income'?'var(--pink-soft)':'var(--violet-soft)'}}><${Ic} n=${t.type==='income'?'up':'down'} s=${15} c=${t.type==='income'?C_INC:C_EXP}/></div>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:500">${t.note||t.category}</p>
                  <p class="tiny ellip">${t.category}${pName(t.projectId)?` · ${pName(t.projectId)}`:''}</p>
                </div>
                <p class="num" style="font-size:14px;font-weight:700;flex-shrink:0">${t.type==='income'?'+':'−'}${fmtMoney(t.amount)}</p>
                <button class="icon-btn" onClick=${()=>act.editTxn(t)} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
              </div>`)}
          </div>
        </div>`)}



      <div class="card" style="margin-top:8px;margin-bottom:24px">
        <${CardHead} title="Gastos fijos" action="+ Nuevo gasto fijo" onAction=${()=>setRf({note:'',amount:'',category:FCATS.expense[1],day:String(Math.min(28,Number(todayKey().slice(8)))),active:true,thisMonth:true})}/>
        <p class="tiny" style="margin:-4px 0 6px">Se registran solos cada mes en el día que elijas.</p>
        ${rules.length===0&&html`<p class="muted" style="padding:6px 0">Sin gastos fijos. Ej. renta, internet, suscripciones.</p>`}
        ${rules.map(r=>html`
          <div class="list-row" style=${{cursor:'pointer',opacity:r.active===false?0.5:1}} onClick=${()=>setRf({...r,amount:String(r.amount),day:String(r.day)})}>
            <div class="chip" style="background:var(--violet-soft)"><${Ic} n="repeat" s=${14} c=${C_EXP}/></div>
            <div style="flex:1;min-width:0"><p class="ellip" style="font-size:13px;font-weight:500">${r.note}</p><p class="tiny">${r.category} · día ${r.day} de cada mes${r.active===false?' · pausado':''}</p></div>
            <b class="num">${fmtMoney(r.amount)}</b>
          </div>`)}
      </div>

      <${Modal} open=${!!rf} onClose=${()=>setRf(null)} title=${rf&&rf.id?'Editar gasto fijo':'Nuevo gasto fijo'}>
        ${rf&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Concepto</label><input value=${rf.note} onInput=${e=>setRf({...rf,note:e.target.value})} placeholder="Ej. Renta del estudio" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Monto</label><input type="number" inputmode="decimal" min="0" value=${rf.amount} onInput=${e=>setRf({...rf,amount:e.target.value})} placeholder="0"/></div>
            <div><label class="lbl">Día del mes</label><input type="number" min="1" max="28" value=${rf.day} onInput=${e=>setRf({...rf,day:e.target.value})}/></div>
          </div>
          <div><label class="lbl">Categoría</label><select value=${rf.category} onChange=${e=>setRf({...rf,category:e.target.value})}>${FCATS.expense.map(c=>html`<option value=${c}>${c}</option>`)}</select></div>
          ${!rf.id&&html`<label class="rowx" style="cursor:pointer"><input type="checkbox" style="width:auto" checked=${!!rf.thisMonth} onChange=${e=>setRf({...rf,thisMonth:e.target.checked})}/><span class="muted">Registrar también este mes</span></label>`}
          ${rf.id&&html`<label class="rowx" style="cursor:pointer"><input type="checkbox" style="width:auto" checked=${rf.active!==false} onChange=${e=>setRf({...rf,active:e.target.checked})}/><span class="muted">Activo</span></label>`}
          <p class="tiny">Si cambias el monto, aplica a los meses siguientes; lo ya registrado no cambia.</p>
          <${FormActions} isEdit=${!!rf.id} label="Crear gasto fijo" what="este gasto fijo" detail="Los gastos ya registrados se quedan en Finanzas." onSave=${saveRf} onDelete=${()=>{put('recurring',rules.filter(r=>r.id!==rf.id));setRf(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// PAGE: CITAS  (cada cita pertenece a un proyecto; pagos → Finanzas)
// ══════════════════════════════════════════════════════════════════════════
const PageAppts = ({db,put,setTab}) => {
  const today = todayKey();
  const {appts,txns,projects} = db;
  const clients = db.clients||[];
  const [onlyDebt,setOnlyDebt] = useState(false);
  const name = a => apptName(db,a);
  const paid = a => apptPaid(txns,a.id);
  const owed = a => apptOwed(txns,a);
  const owedTotal = appts.reduce((s,a)=>s+owed(a),0);
  const toggle = a => act.toggleDone(a);
  const key = a => a.date+(a.time||'');
  const asc = appts.filter(a=>!onlyDebt||owed(a)>0).sort((a,b)=>key(a).localeCompare(key(b)));
  const groups = [
    ['Hoy', asc.filter(a=>a.date===today)],
    ['Próximas', asc.filter(a=>a.date>today)],
    ['Anteriores', asc.filter(a=>a.date<today).reverse().slice(0,15)],
  ].filter(g=>g[1].length);
  const pending = appts.filter(a=>a.status==='pendiente'&&a.date>=today).length;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Citas</h2><p class="muted">${pending} pendiente${pending===1?'':'s'} · por cobrar <b class="num" style="color:var(--ink)">${fmtMoney(owedTotal)}</b></p></div>
        <button class="btn-p" onClick=${()=>act.newAppt()}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nueva cita</button>
      </div>
      <div class="rowx" style="margin-bottom:16px">

                    <span class=${'badge '+st.b}>${st.l}</span>

                    ${clientName(db,a)&&html`<span class="muted rowx" style="gap:6px"><${Ic} n="user" s=${13} c="var(--ink-3)"/>${clientName(db,a)}</span>`}

// PAGE: CLIENTES  (directorio + historial de citas y pagos de cada cliente)
// ══════════════════════════════════════════════════════════════════════════
const PageClients = ({db,put}) => {
  const today = todayKey();
  const {appts,txns} = db;
  const clients = db.clients||[];
  const [q,setQ] = useState('');
  const [onlyDebt,setOnlyDebt] = useState(false);
  const [view,setView] = useState(null);
  const [f,setF] = useState(null);
  const blank = {name:'',phone:'',instagram:'',email:'',note:''};
  const statsOf = c => {
    const ap = appts.filter(a=>a.clientId===c.id);
    const live = ap.filter(a=>a.status!=='cancelada');
    const byDate = (x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||''));
    return {
      ap: [...ap].sort(byDate).reverse(),
      count: live.length,
      spent: live.reduce((s,a)=>s+(Number(a.price)||0),0),
      paid: ap.reduce((s,a)=>s+apptPaid(txns,a.id),0),
      owe: ap.reduce((s,a)=>s+apptOwed(txns,a),0),
      last: live.filter(a=>a.date<=today).sort(byDate).pop(),
      next: live.filter(a=>a.date>=today&&a.status==='pendiente').sort(byDate)[0],
    };
  };
  const saveF = () => {
    if(!f.name.trim())return;
    const item = {...f,name:f.name.trim(),phone:f.phone.trim(),instagram:f.instagram.trim(),email:f.email.trim()};
    put('clients',f.id?clients.map(c=>c.id===f.id?{...c,...item}:c):[...clients,{...item,id:uid(),createdAt:today}]);
    setF(null);
  };
  const del = id => { put('clients',clients.filter(c=>c.id!==id)); setView(null); };

  // Clientes escritos en citas antiguas que aún no están en el directorio
  const orphans = [...new Set(appts.filter(a=>!clientOf(db,a.clientId)&&(a.client||'').trim()).map(a=>a.client.trim()))];
  const importOrphans = () => {
    const list = [...clients];
    const idFor = nm => { const ex=list.find(c=>c.name.trim().toLowerCase()===nm.toLowerCase()); if(ex) return ex.id;
      const c={id:uid(),name:nm,phone:'',instagram:'',email:'',note:'',createdAt:today}; list.push(c); return c.id; };
    const ap = appts.map(a=>(!clientOf(db,a.clientId)&&(a.client||'').trim())?{...a,clientId:idFor(a.client.trim())}:a);
    put('clients',list); put('appts',ap);
  };

  const rows = clients.map(c=>({c,st:statsOf(c)}))
    .filter(({c,st})=>(!onlyDebt||st.owe>0)&&(!q.trim()||[c.name,c.phone,c.instagram,c.email].join(' ').toLowerCase().includes(q.trim().toLowerCase())))
    .sort((x,y)=>x.c.name.localeCompare(y.c.name,'es'));
  const owedAll = clients.reduce((s,c)=>s+statsOf(c).owe,0);
  const cur = view && clients.find(c=>c.id===view);
  const cst = cur && statsOf(cur);
  const Avatar = ({n,big}) => html`<div style=${{width:big?44:36,height:big?44:36,borderRadius:'50%',background:'rgb(var(--acc) / 0.08)',color:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:big?15:12,fontWeight:600,flexShrink:0}}>${initials(n)}</div>`;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Clientes</h2><p class="muted">${clients.length} cliente${clients.length===1?'':'s'} · te deben <b class="num" style="color:var(--ink)">${fmtMoney(owedAll)}</b></p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nuevo cliente</button>
      </div>

      ${orphans.length>0&&html`
        <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <p class="h3">Encontramos ${orphans.length} cliente${orphans.length===1?'':'s'} en tus citas</p>
            <p class="tiny">${orphans.slice(0,4).join(', ')}${orphans.length>4?'…':''}. Agrégalos para ver su historial aquí.</p>
          </div>
          <button class="btn-g" onClick=${importOrphans}>Agregar a Clientes</button>
        </div>`}

      <div class="rowx" style="margin-bottom:14px;flex-wrap:wrap">
        <input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Buscar por nombre, teléfono o Instagram" style="max-width:320px;flex:1;min-width:200px"/>
        ${[[false,'Todos'],[true,'Me deben']].map(([v,l])=>html`<button class=${'tab-pill'+(onlyDebt===v?' active':'')} onClick=${()=>setOnlyDebt(v)}>${l}</button>`)}
      </div>

      ${clients.length===0&&orphans.length===0&&html`<${Empty} emo="👤" title="Aún no tienes clientes" text="Se agregan solos al agendar una cita, o puedes crearlos aquí."/>`}
      ${clients.length>0&&rows.length===0&&html`<${Empty} emo="👤" title="Sin resultados" text="Ningún cliente coincide con tu búsqueda."/>`}

      <div class="cards">
        ${rows.map(({c,st})=>html`
          <div class="card click" onClick=${()=>setView(c.id)}>
            <div class="rowx" style="gap:12px;margin-bottom:12px">
              <${Avatar} n=${c.name}/>
              <div style="flex:1;min-width:0">
                <p class="ellip" style="font-size:14px;font-weight:600">${c.name}</p>
                <p class="tiny ellip">${[c.phone,c.instagram&&('@'+c.instagram.replace(/^@/,''))].filter(Boolean).join(' · ')||'Sin datos de contacto'}</p>
              </div>
              ${st.owe>0&&html`<span class="badge b-warn num">Debe ${fmtMoney(st.owe)}</span>`}
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--surface-2);border-radius:8px">
              ${[['Citas',st.count],['Gastado',fmtMoney(st.spent)],['Pagado',fmtMoney(st.paid)]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:600">${v}</p></div>`)}
            </div>
            <p class="tiny" style="margin-top:10px;text-transform:capitalize">
              ${st.next?`Próxima cita: ${fmtDate(st.next.date)}${st.next.time?' · '+st.next.time:''}`:st.last?`Última visita: ${fmtDate(st.last.date)}`:'Sin citas todavía'}
            </p>
          </div>`)}
      </div>

      <${Modal} open=${!!cur} onClose=${()=>setView(null)} title="Cliente">
        ${cur&&html`<div class="stack" style="gap:14px">
          <div class="rowx" style="gap:12px">
            <${Avatar} n=${cur.name} big=${true}/>
            <div style="flex:1;min-width:0">
              <p style="font-size:16px;font-weight:600">${cur.name}</p>
              <p class="tiny">Cliente desde ${cur.createdAt?fmtDate(cur.createdAt):'—'}</p>
            </div>
            <button class="icon-btn" onClick=${()=>{setView(null);setF({...blank,...cur});}} aria-label="Editar"><${Ic} n="edit" s=${15}/></button>
          </div>
          ${(cur.phone||cur.instagram||cur.email)&&html`
            <div class="rowx" style="flex-wrap:wrap;gap:6px">
              ${waLink(cur.phone)&&html`<a class="btn-g" style="text-decoration:none" href=${waLink(cur.phone)} target="_blank" rel="noopener">WhatsApp · ${cur.phone}</a>`}
              ${igLink(cur.instagram)&&html`<a class="btn-g" style="text-decoration:none" href=${igLink(cur.instagram)} target="_blank" rel="noopener">Instagram</a>`}
              ${cur.email&&html`<a class="btn-g" style="text-decoration:none" href=${'mailto:'+cur.email}>Correo</a>`}
            </div>`}
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--surface-2);border-radius:8px">
            ${[['Citas',cst.count],['Gastado',fmtMoney(cst.spent)],['Pagado',fmtMoney(cst.paid)],['Debe',fmtMoney(cst.owe)]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:600">${v}</p></div>`)}
          </div>
          ${cur.note&&html`<p class="muted">${cur.note}</p>`}
          ${(db.docs||[]).some(d=>d.clientId===cur.id)&&html`<div>
            <p class="over" style="margin-bottom:4px">Documentos</p>
            ${(db.docs||[]).filter(d=>d.clientId===cur.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(d=>{const st=docStatus(txns,d);return html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>{setView(null);act.editDoc(d);}}>
                <span class="num" style="font-weight:600;width:80px">${folioOf(d)}</span>
                <span class="tiny" style="flex:1;text-transform:capitalize">${fmtDate(d.date)}</span>
                <span class="num" style="font-weight:600">${fmtMoney(docTotal(d))}</span>
                <span class=${'badge '+D_STATUS[st].b}>${D_STATUS[st].l}</span>
              </div>`;})}
          </div>`}
          <div>
            <p class="over" style="margin-bottom:4px">Historial</p>
            ${cst.ap.length===0&&html`<p class="muted" style="padding:8px 0">Todavía no tiene citas.</p>`}
            ${cst.ap.map(a=>{const st=A_STATUS[a.status]||A_STATUS.pendiente;const ow=apptOwed(txns,a);return html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>{setView(null);act.viewAppt(a);}}>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:500">${apptName(db,a)}</p>
                  <p class="tiny" style="text-transform:capitalize">${fmtDate(a.date)}${a.time?' · '+a.time:''}${a.price?' · '+fmtMoney(a.price):''}</p>
                </div>
                ${ow>0?html`<span class="badge b-warn num">Falta ${fmtMoney(ow)}</span>`:html`<span class=${'badge '+st.b}>${st.l}</span>`}
              </div>`;})}
          </div>
        </div>`}
      <//>

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar cliente':'Nuevo cliente'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Nombre</label><input value=${f.name} onInput=${e=>setF({...f,name:e.target.value})} placeholder="Nombre completo" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Teléfono / WhatsApp</label><input type="tel" inputmode="tel" value=${f.phone} onInput=${e=>setF({...f,phone:e.target.value})} placeholder="10 dígitos"/></div>
            <div><label class="lbl">Instagram</label><input value=${f.instagram} onInput=${e=>setF({...f,instagram:e.target.value})} placeholder="@usuario"/></div>
          </div>
          <div><label class="lbl">Correo</label><input type="email" value=${f.email} onInput=${e=>setF({...f,email:e.target.value})} placeholder="opcional"/></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas (gustos, alergias, preferencias…)" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Guardar cliente" what="este cliente" detail="Sus citas y pagos no se borran." onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// PAGE: SERVICIOS  (catálogo de precios y qué se vende más)
// ══════════════════════════════════════════════════════════════════════════
const PageServices = ({db,put}) => {
  const today=todayKey(), mo=today.slice(0,7);
  const services=db.services||[];
  const [f,setF] = useState(null);
  const blank={name:'',price:'',duration:'',desc:'',active:true};
  const saveF = () => { if(!f.name.trim())return; put('services',upsert(services,{...f,name:f.name.trim(),price:Number(f.price)||0,duration:Number(f.duration)||0})); setF(null); };
  const statOf = sv => {
    const ap=db.appts.filter(a=>a.serviceId===sv.id&&a.status!=='cancelada');
    const items=(db.docs||[]).filter(d=>d.kind==='nv'&&d.status!=='cancelada').flatMap(d=>(d.items||[]).filter(i=>i.svcId===sv.id).map(i=>({...i,date:d.date})));
    const all=[...ap.map(a=>({n:1,v:Number(a.price)||0,date:a.date})),...items.map(i=>({n:Number(i.qty)||1,v:(Number(i.qty)||0)*(Number(i.price)||0),date:i.date}))];
    return {n:all.reduce((s,x)=>s+x.n,0),v:all.reduce((s,x)=>s+x.v,0),nMo:all.filter(x=>(x.date||'').startsWith(mo)).reduce((s,x)=>s+x.n,0)};
  };
  const rows=services.map(sv=>({sv,st:statOf(sv)})).sort((a,b)=>(b.sv.active!==false)-(a.sv.active!==false)||b.st.v-a.st.v);
  const top=rows.find(r=>r.st.v>0);
  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Servicios</h2><p class="muted">Tu catálogo de precios para citas y cotizaciones</p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nuevo servicio</button>
      </div>
      ${services.length===0&&html`<${Empty} emo="🏷️" title="Aún no tienes servicios" text="Agrega lo que vendes con su precio y elígelo al agendar o cotizar."/>`}
      ${rows.length>0&&html`<div class="card" style="padding:4px 16px">
        ${rows.map(({sv,st})=>html`
          <div class="list-row" style=${{cursor:'pointer',opacity:sv.active===false?0.5:1}} onClick=${()=>setF({...blank,...sv,price:String(sv.price),duration:sv.duration?String(sv.duration):''})}>
            <div style="flex:1;min-width:0">
              <p class="ellip" style="font-size:13px;font-weight:600">${sv.name} ${top&&top.sv.id===sv.id?html`<span class="badge b-good" style="margin-left:6px">Más vendido</span>`:''}${sv.active===false?html`<span class="badge b-mute" style="margin-left:6px">Pausado</span>`:''}</p>
              <p class="tiny ellip">${sv.duration?sv.duration+' min · ':''}${st.n} vendido${st.n===1?'':'s'} (${st.nMo} este mes) · ${fmtMoney(st.v)} en total</p>
            </div>
            <b class="num" style="font-size:14px">${fmtMoney(sv.price)}</b>
          </div>`)}
      </div>`}
      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar servicio':'Nuevo servicio'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Nombre</label><input value=${f.name} onInput=${e=>setF({...f,name:e.target.value})} placeholder="Ej. Sesión individual 1 hora" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Precio</label><input type="number" inputmode="decimal" min="0" value=${f.price} onInput=${e=>setF({...f,price:e.target.value})} placeholder="0"/></div>
            <div><label class="lbl">Duración (min, opcional)</label><input type="number" min="0" value=${f.duration} onInput=${e=>setF({...f,duration:e.target.value})} placeholder="60"/></div>
          </div>
          <textarea rows="2" style="resize:vertical" value=${f.desc} onInput=${e=>setF({...f,desc:e.target.value})} placeholder="Qué incluye (opcional)"/>
          ${f.id&&html`<label class="rowx" style="cursor:pointer"><input type="checkbox" style="width:auto" checked=${f.active!==false} onChange=${e=>setF({...f,active:e.target.checked})}/><span class="muted">Disponible para nuevas citas y cotizaciones</span></label>`}
          <${FormActions} isEdit=${!!f.id} label="Guardar servicio" what="este servicio" detail="Tus citas y documentos anteriores no cambian." onSave=${saveF} onDelete=${()=>{put('services',services.filter(x=>x.id!==f.id));setF(null);}}/>
        </div>`}
      <//>
    </div>`;
};

  <style>
    /* ── Tokens. Oscuro es el tema por defecto; "rosa" es la variante clara. ── */
    :root{
      color-scheme:dark;
      --bg:#0A0A0B; --side:#0D0D0F; --surface:#121214; --surface-2:#19191C; --line:#232327; --edge:#232327;
      --ink:#EDEDEF; --ink-2:#A1A1AA; --ink-3:#6E6E78;
      --pink:#EDEDEF; --pink-deep:#EDEDEF; --pink-soft:rgba(255,255,255,0.06);
      --g1:#EDEDEF; --g2:#EDEDEF; --on-acc:#0A0A0B;
      --pill:#2A2A30; --pill-ink:#EDEDEF; --sel:#19191C;
      --glass:25 25 28; --acc:255 255 255; --sh:0 0 0;
      --c-inc:#EDEDEF; --c-exp:#55555F;
      --violet:#8B8B96; --violet-soft:rgba(255,255,255,0.06); --violet-ink:#EDEDEF; --violet-bar:rgba(255,255,255,0.2);
      --scrim:rgba(0,0,0,0.62); --mute:rgba(255,255,255,0.06);
      --good:#3FB950; --good-soft:rgba(63,185,80,0.12);
      --bad:#F0616D;  --bad-soft:rgba(240,97,109,0.12); --bad-line:rgba(240,97,109,0.25);
      --warn:#D4A72C; --warn-soft:rgba(212,167,44,0.12);
      --shadow:0 0 0 rgba(0,0,0,0);
      --pop:0 16px 48px rgba(0,0,0,0.5);
    }
    :root[data-theme="rosa"]{
      color-scheme:light;
      --bg:#FBF8F9; --side:#F6F1F3; --surface:#FFFFFF; --surface-2:#F7F2F4; --line:#ECE3E6; --edge:#ECE3E6;
      --ink:#1D1418; --ink-2:#6B5A61; --ink-3:#9C8B92;
      --pink:#D6336C; --pink-deep:#D6336C; --pink-soft:rgba(214,51,108,0.08);
      --g1:#D6336C; --g2:#D6336C; --on-acc:#FFFFFF;
      --pill:#FFFFFF; --pill-ink:#1D1418; --sel:#F7F2F4;
      --glass:255 255 255; --acc:60 30 40; --sh:60 30 40;
      --c-inc:#D6336C; --c-exp:#7C6AD6;
      --violet:#7C6AD6; --violet-soft:#F0EDFB; --violet-ink:#4B3BA8; --violet-bar:rgba(124,106,214,0.3);
      --scrim:rgba(20,10,14,0.35); --mute:#F1ECEE;
      --good:#1A7F4B; --good-soft:#E6F4EC;
      --bad:#C9304B;  --bad-soft:#FBEAED; --bad-line:#F2C9D1;
      --warn:#9A6700; --warn-soft:#FBF1D9;
      --shadow:0 1px 2px rgba(60,30,40,0.05);
      --pop:0 16px 48px rgba(60,30,40,0.18);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;}
    body{font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.45;overflow-x:hidden;min-height:100vh;color:var(--ink);background:var(--bg);
      -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01';}
    button,input,select,textarea{font-family:inherit;}

    /* ══ Shell ══ */
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:232px;z-index:30;background:var(--side);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:14px 10px;}
    .side-label{font-size:11px;font-weight:500;color:var(--ink-3);padding:14px 10px 6px;}
    .nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;
      color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s;border:0;background:none;width:100%;text-align:left;}
    .nav-item:hover{background:rgb(var(--acc) / 0.05);color:var(--ink);}
    .nav-item.active{background:rgb(var(--acc) / 0.08);color:var(--ink);}
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;padding:6px 6px env(safe-area-inset-bottom,10px);
      background:var(--side);border-top:1px solid var(--line);}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:10px;font-weight:500;
      color:var(--ink-3);cursor:pointer;border:0;background:none;}
    .bnav-item.active{color:var(--ink);}
    .main-content{min-height:100vh;max-width:1180px;padding-bottom:48px;}
    @media(min-width:768px){.main-content{margin-left:232px;}.mobile-only{display:none!important;}}
    @media(max-width:767px){
      .sidebar{display:none;}
      .bottom-nav{display:flex;}
      .main-content{margin-left:0;padding-bottom:92px;}
      .page{padding:18px 14px 0!important;}
      input,textarea,select{font-size:16px!important;}
      .btn-p,.btn-g,.btn-d{min-height:40px;}
    }

    /* ══ Superficies ══ */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
    .card.click{cursor:pointer;}
    .card.click:hover{border-color:rgb(var(--acc) / 0.2);}

    /* ══ Controles ══ */
    input,textarea,select{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;width:100%;
      outline:none;font-size:13px;transition:border-color .12s,box-shadow .12s;}
    input:hover,textarea:hover,select:hover{border-color:rgb(var(--acc) / 0.2);}
    input:focus,textarea:focus,select:focus{border-color:rgb(var(--acc) / 0.45);box-shadow:0 0 0 3px rgb(var(--acc) / 0.08);}
    input:disabled,select:disabled{opacity:.6;}
    input::placeholder,textarea::placeholder{color:var(--ink-3);}
    .btn-p,.btn-g,.btn-d{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:8px;
      font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,opacity .12s,border-color .12s;white-space:nowrap;}
    .btn-p{background:var(--pink-deep);color:var(--on-acc);border:1px solid transparent;}
    .btn-p:hover{opacity:.88;}
    .btn-p:disabled{opacity:.5;cursor:default;}
    .btn-g{background:transparent;color:var(--ink);border:1px solid var(--line);}
    .btn-g:hover{background:rgb(var(--acc) / 0.05);border-color:rgb(var(--acc) / 0.2);}
    .btn-d{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line);}
    .btn-d:hover{opacity:.85;}
    .icon-btn{background:none;border:0;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:6px;display:inline-flex;}
    .icon-btn:hover{color:var(--ink);background:rgb(var(--acc) / 0.06);}
    .check-box{width:18px;height:18px;border-radius:50%;border:1.5px solid rgb(var(--acc) / 0.3);background:transparent;display:flex;align-items:center;
      justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0;}
    .check-box:hover{border-color:rgb(var(--acc) / 0.6);}
    .check-box.done{background:var(--pink-deep);border-color:var(--pink-deep);}
    .prog-track{height:4px;background:rgb(var(--acc) / 0.08);border-radius:2px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:2px;background:var(--pink-deep);transition:width .4s ease;}
    .tab-pill{height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:transparent;
      color:var(--ink-2);transition:all .12s;white-space:nowrap;}
    .tab-pill:hover{color:var(--ink);}
    .tab-pill.active{background:rgb(var(--acc) / 0.09);color:var(--ink);border-color:rgb(var(--acc) / 0.14);}
    .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;}
    .seg button{height:28px;border:0;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:var(--ink-2);}
    .seg button.on{background:var(--pill);color:var(--pill-ink);box-shadow:0 1px 2px rgb(var(--sh) / 0.2);}

    /* ══ Modal ══ */
    .modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:var(--scrim);
      backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
    .modal-box{background:var(--surface);border:1px solid var(--line);box-shadow:var(--pop);border-radius:12px;width:100%;max-width:440px;
      display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden;}
    .modal-header-sticky{flex-shrink:0;padding:14px 18px;border-bottom:1px solid var(--line);}
    .modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 18px;}
    @media(max-width:767px){.modal-box{max-height:calc(100vh - 100px);}}

    /* ══ Etiquetas ══ */
    .badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap;}
    .b-pink{background:rgb(var(--acc) / 0.08);color:var(--ink);}
    .b-violet{background:var(--violet-soft);color:var(--violet-ink);}
    .b-good{background:var(--good-soft);color:var(--good);}
    .b-bad{background:var(--bad-soft);color:var(--bad);}
    .b-warn{background:var(--warn-soft);color:var(--warn);}
    .b-mute{background:var(--mute);color:var(--ink-2);}

    ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:rgb(var(--acc) / 0.12);border-radius:4px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
    .fade-up{animation:fadeUp .16s ease-out;}

    /* ══ Layout y texto ══ */
    .page{padding:26px 32px 0;}
    .page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
    .h1{font-size:20px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
    .h3{font-size:13px;font-weight:600;color:var(--ink);}
    .muted{font-size:13px;color:var(--ink-2);}
    .tiny{font-size:12px;color:var(--ink-3);}
    .over{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);}
    .col{display:flex;flex-direction:column;gap:2px;}
    .stack{display:flex;flex-direction:column;gap:10px;}
    .rowx{display:flex;align-items:center;gap:8px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    .cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start;}
    @media(max-width:980px){.kpis{grid-template-columns:1fr 1fr;}.cols2{grid-template-columns:1fr;}}
    @media(max-width:420px){.cards{grid-template-columns:1fr;}}
    label.lbl{font-size:12px;font-weight:500;color:var(--ink-2);display:block;margin-bottom:5px;}
    .empty-state{text-align:center;padding:40px 20px;}
    .empty-ic{width:40px;height:40px;border-radius:10px;background:rgb(var(--acc) / 0.06);color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
    .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .chip{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .num{font-variant-numeric:tabular-nums;}
    .list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
    .list-row:last-child{border-bottom:0;}
    .bar{width:12px;border-radius:3px 3px 0 0;transition:height .4s;}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
    .logo-word{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
    .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;
      font-size:13px;font-weight:500;box-shadow:var(--pop);max-width:calc(100vw - 32px);text-align:center;}

    /* ══ Acceso ══ */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
    .auth-card{width:100%;max-width:360px;padding:28px 24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--pop);text-align:center;}

    /* ══ Calendario ══ */
    .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden;}
    .cal-head{font-size:11px;font-weight:500;color:var(--ink-3);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);}
    .cal-day{min-height:96px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:6px;cursor:pointer;
      text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0;transition:background .12s;}
    button.cal-day:hover{background:rgb(var(--acc) / 0.03);}
    .cal-day.sel{background:rgb(var(--acc) / 0.06);}
    .cal-day.off{cursor:default;background:rgb(var(--acc) / 0.015);}
    .cal-num{font-size:12px;font-weight:500;color:var(--ink-2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .cal-day.today .cal-num{background:var(--pink-deep);color:var(--on-acc);font-weight:600;}
    .cal-chips{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;}
    .cal-chip{font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:rgb(var(--acc) / 0.07);border-left:2px solid var(--pink-deep);}
    .cal-more{font-size:11px;color:var(--ink-3);padding-left:4px;}
    .cal-layout{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;align-items:start;}
    @media(max-width:1100px){.cal-layout{grid-template-columns:1fr;}}
    @media(max-width:767px){
      .cal-head{padding:6px 0;text-align:center;}
      .cal-day{min-height:52px;padding:4px 2px;align-items:center;}
      .cal-chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;}
      .cal-chip{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;border:0;background:var(--pink-deep);}
      .cal-more{display:none;}
    }
  </style>
</head>
<body>
<div id="root" style="position:relative;z-index:1;min-height:100vh;"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useEffect } from 'https://esm.sh/preact@10.23.1/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ── NUBE (Supabase) ────────────────────────────────────────────────────────
// SUPA_KEY es la llave pública (anon / publishable). Vacía = solo este navegador.
const SUPA_URL = 'https://tefxfxbdylunaeajtcak.supabase.co';
const SUPA_KEY = 'sb_publishable_3CERy3XxHXUWnqyhXnqB4Q_y8IvLrS1';
let sb = null;
if(SUPA_KEY){
  try{ sb = (await import('https://esm.sh/@supabase/supabase-js@2')).createClient(SUPA_URL,SUPA_KEY); }catch{}
}
const KEYS = ['txns','appts','projects','goals'];

// ── UTILS ──────────────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,'0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dKey(new Date());
const load = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };
const save = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
const uid  = () => Date.now()+Math.random().toString(36).slice(2,6);
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const fmtMoney = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmtMonth = ym => { const s=new Date(ym+'-15T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'}); return s[0].toUpperCase()+s.slice(1); };
const shiftMonth = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const sum = (list,type) => list.filter(t=>t.type===type).reduce((s,t)=>s+(Number(t.amount)||0),0);
const upsert = (list,item) => item.id ? list.map(x=>x.id===item.id?item:x) : [...list,{...item,id:uid()}];

const FCATS = {
  income:['Ventas','Servicios','Anticipo','Abono','Comisiones','Inversión','Otro ingreso'],
  expense:['Insumos','Renta','Nómina','Marketing','Servicios','Software','Transporte','Impuestos','Equipo','Otro gasto'],
};
const C_INC = 'var(--c-inc)', C_EXP = 'var(--c-exp)';
const P_STATUS = {propuesta:{l:'Por iniciar',b:'b-warn'},curso:{l:'Activo',b:'b-pink'},pausa:{l:'En pausa',b:'b-mute'},listo:{l:'Terminado',b:'b-good'}};
const A_STATUS = {pendiente:{l:'Pendiente',b:'b-pink'},hecha:{l:'Realizada',b:'b-good'},cancelada:{l:'Cancelada',b:'b-mute'}};

const apptPaid = (txns,id) => txns.filter(t=>t.apptId===id&&t.type==='income').reduce((s,t)=>s+(Number(t.amount)||0),0);
const apptOwed = (txns,a) => a.status==='cancelada' ? 0 : Math.max(0,(Number(a.price)||0)-apptPaid(txns,a.id));
const projOf = (db,id) => db.projects.find(p=>p.id===id);
const apptName = (db,a) => (projOf(db,a.projectId)||{}).name || a.title || 'Cita';
// Avance del proyecto: por ventas (suma de precios de sus citas) o por cantidad de citas.
const projStats = (db,p) => {
  const ap = db.appts.filter(a=>a.projectId===p.id&&a.status!=='cancelada');
  const ids = new Set(ap.map(a=>a.id));
  const mine = db.txns.filter(t=>t.projectId===p.id||ids.has(t.apptId));
  const sold = ap.reduce((s,a)=>s+(Number(a.price)||0),0);
  const count = ap.length, target = Number(p.goalTarget)||0;
  const val = p.goalKind==='citas'?count:sold;
  return {count,sold,paid:sum(mine,'income'),spent:sum(mine,'expense'),target,pct:target?Math.min(100,Math.round(val/target*100)):0};
};
const goalText = (p,st) => !st.target ? 'Sin meta definida' : p.goalKind==='citas' ? `${st.count} de ${st.target} citas` : `${fmtMoney(st.sold)} de ${fmtMoney(st.target)} en ventas`;
const projRange = p => { const a=p.start||p.end||p.due||'', b=p.end||p.due||p.start||''; return a?[a,b]:null; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

// ── ICONS ─────────────────────────────────────────────────────────────────
const ICON = {
  home: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  finance:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  cal:  '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  proj: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>',
  goal: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/>',
  x:    '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',

const FormActions = ({isEdit,onDelete,onSave,label,what,detail}) => html`

const TimePick = ({value,onChange}) => {
  const [h,m] = (value||'').split(':');
  const mins = ['00','10','20','30','40','50'];
  if(m&&!mins.includes(m)){ mins.push(m); mins.sort(); }
  const lab = n => `${n%12||12} ${n<12?'AM':'PM'}`;
  return html`
    <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:6px">
      <select aria-label="Hora" value=${h||''} style="padding-left:10px;padding-right:4px" onChange=${e=>onChange(e.target.value?`${e.target.value}:${m||'00'}`:'')}>
        <option value="">Sin hora</option>
        ${Array.from({length:24},(_,i)=>html`<option value=${pad(i)}>${lab(i)}</option>`)}
      </select>
      <select aria-label="Minutos" value=${h?(m||'00'):''} disabled=${!h} style="padding-left:10px;padding-right:4px" onChange=${e=>onChange(`${h}:${e.target.value}`)}>
        ${!h&&html`<option value="">min</option>`}
        ${mins.map(x=>html`<option value=${x}>:${x}</option>`)}
      </select>
    </div>`;
};

const chartBuckets = per => {
  const now = new Date();
  if(per==='año') return Array.from({length:5},(_,i)=>now.getFullYear()-4+i).map(y=>({id:String(y),l:String(y),full:`Año ${y}`,from:`${y}-01-01`,to:`${y}-12-31`}));
  if(per==='semana'){
    const mon = addDays(now,-((now.getDay()+6)%7));
    return Array.from({length:8},(_,i)=>addDays(mon,-7*(7-i))).map(st=>{
      const from=dKey(st), to=dKey(addDays(st,6));
      return {id:from,l:`${st.getDate()} ${st.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}`,full:`Semana del ${fmtDate(from)} al ${fmtDate(to)}`,from,to};
    });
  }
  const mo = todayKey().slice(0,7);
  return Array.from({length:6},(_,i)=>shiftMonth(mo,i-5)).map(ym=>({id:ym,l:new Date(ym+'-15T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.',''),full:fmtMonth(ym),from:ym+'-01',to:ym+'-31'}));
};
const PageHome = ({db,setTab,biz,icon,openSettings}) => {
  const today = todayKey();
  const mo = today.slice(0,7);
  const {txns,appts,projects} = db;
  const inMo = txns.filter(t=>(t.date||'').startsWith(mo));
  const prev = txns.filter(t=>(t.date||'').startsWith(shiftMonth(mo,-1)));
  const inc = sum(inMo,'income'), exp = sum(inMo,'expense'), net = inc-exp;
  const pInc = sum(prev,'income'), pExp = sum(prev,'expense');
  const delta = (a,b) => b ? Math.round((a-b)/b*100) : null;
  const margin = inc ? Math.round(net/inc*100) : null;

  const [per,setPer] = useState('mes');
  const [hov,setHov] = useState(null);
  const series = chartBuckets(per).map(k=>{ const l=txns.filter(t=>(t.date||'')>=k.from&&(t.date||'')<=k.to); return {...k,inc:sum(l,'income'),exp:sum(l,'expense')}; });
  const maxV = Math.max(...series.flatMap(m=>[m.inc,m.exp]),1);
  const shown = series.find(m=>m.id===hov) || series[series.length-1];

  const upcoming = appts.filter(a=>a.status!=='cancelada'&&a.status!=='hecha'&&a.date>=today)
    .sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,5);
  const active = projects.filter(p=>p.status==='curso'||p.status==='propuesta').slice(0,5);
  const byCat={}; inMo.filter(t=>t.type==='expense').forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const debtors = appts.filter(a=>apptOwed(txns,a)>0);
  const owedTotal = debtors.reduce((s,a)=>s+apptOwed(txns,a),0);

  const kpis = [
    {l:'Ingresos del mes', v:fmtMoney(inc), d:delta(inc,pInc), goodUp:true, i:'up', bg:'var(--pink-soft)', c:C_INC},
    {l:'Gastos del mes',   v:fmtMoney(exp), d:delta(exp,pExp), goodUp:false, i:'down', bg:'var(--violet-soft)', c:C_EXP},
    {l:'Utilidad',         v:fmtMoney(net), sub:margin===null?'Sin ingresos aún':`Margen ${margin}%`, i:'finance', bg:net>=0?'var(--good-soft)':'var(--bad-soft)', c:net>=0?'var(--good)':'var(--bad)'},
    {l:'Por cobrar',       v:fmtMoney(owedTotal), sub:debtors.length?`${debtors.length} cita${debtors.length===1?'':'s'} con saldo`:'Nadie te debe', i:'cal', bg:'var(--warn-soft)', c:'var(--warn)'},
  ];

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col">
          <p class="over">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</p>
          <h1 class="h1">${biz||'Mi negocio'}${icon?' '+icon:''}</h1>
        </div>
        <button class="icon-btn mobile-only" onClick=${openSettings} aria-label="Ajustes"><${Ic} n="settings" s=${20}/></button>
      </div>

      <div class="kpis">
        ${kpis.map(k=>html`
          <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <span class="muted" style="font-weight:500">${k.l}</span>
              <div class="chip" style=${{background:k.bg,width:30,height:30,borderRadius:8}}><${Ic} n=${k.i} s=${15} c=${k.c}/></div>
            </div>
            <p class="num" style="font-size:24px;font-weight:600;letter-spacing:-0.02em">${k.v}</p>
            <p class="tiny" style="margin-top:4px">
              ${k.sub || (k.d===null ? 'Sin datos del mes pasado' : html`<span style=${{fontWeight:600,color:(k.d>=0)===k.goodUp?'var(--good)':'var(--bad)'}}>${k.d>=0?'▲':'▼'} ${Math.abs(k.d)}%</span> vs mes pasado`)}
            </p>
          </div>
        `)}
      </div>

      <div class="cols2">
        <div class="stack" style="gap:16px">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
              <p class="h3">Ingresos vs gastos</p>
              <div class="rowx" style="gap:6px">
                ${[['semana','Semanal'],['mes','Mensual'],['año','Anual']].map(([v,l])=>html`<button class=${'tab-pill'+(per===v?' active':'')} style="padding:5px 12px;font-size:11px" onClick=${()=>{setPer(v);setHov(null);}}>${l}</button>`)}
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
              <p class="tiny" style="text-transform:capitalize">${shown.full}</p>
              <div style="display:flex;gap:14px;flex-wrap:wrap">
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_INC}}/>Ingresos <b class="num" style="color:var(--ink)">${fmtMoney(shown.inc)}</b></span>
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_EXP}}/>Gastos <b class="num" style="color:var(--ink)">${fmtMoney(shown.exp)}</b></span>
              </div>
            </div>
            <div style="position:relative;height:150px;border-bottom:1px solid rgb(var(--acc) / 0.18)">
              <div style="position:absolute;left:0;right:0;top:0;border-top:1px dashed rgb(var(--acc) / 0.14)"/>
              <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgb(var(--acc) / 0.14)"/>
              <span class="tiny num" style="position:absolute;left:0;top:2px">${fmtMoney(maxV)}</span>
              <div style="position:absolute;inset:0;display:flex;align-items:flex-end">
                ${series.map(m=>html`
                  <div onMouseEnter=${()=>setHov(m.id)} onMouseLeave=${()=>setHov(null)} onClick=${()=>setHov(m.id)}
                       style=${{flex:1,height:'100%',display:'flex',alignItems:'flex-end',justifyContent:'center',gap:2,cursor:'default',borderRadius:8,background:shown.id===m.id?'rgb(var(--acc) / 0.05)':'transparent'}}>
                    <div class="bar" style=${{background:C_INC,height:`${m.inc?Math.max(3,m.inc/maxV*140):0}px`}}/>
                    <div class="bar" style=${{background:C_EXP,height:`${m.exp?Math.max(3,m.exp/maxV*140):0}px`}}/>
                  </div>
                `)}
              </div>
            </div>
            <div style="display:flex;margin-top:6px">
              ${series.map(m=>html`<span class="tiny" style=${{flex:1,textAlign:'center',fontSize:10,fontWeight:shown.id===m.id?600:400,color:shown.id===m.id?'var(--ink)':'var(--ink-3)'}}>${m.l}</span>`)}
            </div>
          </div>

          <div class="card">
            <${CardHead} title="Proyectos y sus metas" action="Ver todos" onAction=${()=>setTab('projects')}/>
            ${active.length===0&&html`<p class="muted" style="padding:10px 0">Aún no hay proyectos activos.</p>`}
            ${active.map(p=>{const st=projStats(db,p);return html`
              <div class="list-row">
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${p.name}</p>
                  <p class="tiny ellip">${goalText(p,st)}</p>
                </div>
                <div class="prog-track" style="width:80px"><div class="prog-fill" style=${{width:`${st.pct}%`}}/></div>
                <span class="num muted" style="min-width:34px;text-align:right;font-weight:600">${st.pct}%</span>
              </div>`;})}
          </div>
        </div>

        <div class="stack" style="gap:16px">
          <div class="card">
            <${CardHead} title="Próximas citas" action="Calendario" onAction=${()=>setTab('cal')}/>
            ${upcoming.length===0&&html`<p class="muted" style="padding:10px 0">No tienes citas pendientes.</p>`}
            ${upcoming.map(a=>html`
              <div class="list-row">
                <div class="chip" style="background:var(--pink-soft);flex-direction:column;width:42px;height:42px">
                  <span style="font-size:14px;font-weight:700;color:var(--pink-deep);line-height:1">${Number(a.date.slice(8))}</span>
                  <span style="font-size:9px;font-weight:600;color:var(--pink-deep);text-transform:uppercase">${new Date(a.date+'T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.','')}</span>
                </div>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${apptName(db,a)}</p>
                  <p class="tiny ellip">${a.date===today?'Hoy':fmtDate(a.date)}${a.time?` · ${a.time}`:''}${a.client?` · ${a.client}`:''}</p>
                </div>
                ${apptOwed(txns,a)>0&&html`<span class="badge b-warn num">Falta ${fmtMoney(apptOwed(txns,a))}</span>`}
              </div>`)}
          </div>

          <div class="card">
            <${CardHead} title="En qué se va el dinero" action="Finanzas" onAction=${()=>setTab('finance')}/>
            ${cats.length===0&&html`<p class="muted" style="padding:10px 0">Sin gastos registrados este mes.</p>`}
            ${cats.map(([c,a])=>html`
              <div class="rowx" style="margin-bottom:8px">
                <span class="muted ellip" style="flex:1">${c}</span>
                <div class="prog-track" style="width:80px;background:var(--violet-soft)"><div style=${{height:'100%',borderRadius:4,background:C_EXP,width:`${Math.min(100,a/exp*100)}%`}}/></div>
                <span class="num" style="font-size:12px;font-weight:600;min-width:72px;text-align:right">${fmtMoney(a)}</span>

        </div>
      </div>
    </div>
  `;
};

const PageFinance = ({db,put}) => {
  const today = todayKey();
  const {txns,projects} = db;
  const [ym,setYm] = useState(today.slice(0,7));
  const [scope,setScope] = useState('mes');
  const [kind,setKind] = useState('todos');
  const [f,setF] = useState(null);
  const blank = type => ({type,amount:'',category:FCATS[type][0],note:'',date:today,projectId:''});
  const saveF = () => { if(!Number(f.amount))return; put('txns',upsert(txns,{...f,amount:Number(f.amount)})); setF(null); };
  const del = id => put('txns',txns.filter(x=>x.id!==id));

  const pfx = scope==='mes'?ym:ym.slice(0,4);

  const byDay={}; list.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t);});

  return html`

      <div class="page-header">

        <div class="rowx" style="gap:8px">

      </div>

      </div>

      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        ${[
          {l:'Ingresos',v:inc,i:'up',bg:'var(--pink-soft)',c:C_INC},
          {l:'Gastos',v:exp,i:'down',bg:'var(--violet-soft)',c:C_EXP},
          {l:'Utilidad',v:bal,i:'finance',bg:bal>=0?'var(--good-soft)':'var(--bad-soft)',c:bal>=0?'var(--good)':'var(--bad)'},
        ].map(s=>html`
          <div class="card" style="padding:14px">
            <div class="rowx" style="gap:8px;margin-bottom:6px"><div class="chip" style=${{background:s.bg,width:26,height:26,borderRadius:9}}><${Ic} n=${s.i} s=${13} c=${s.c}/></div><span class="muted">${s.l}</span></div>
            <p class="num" style="font-size:19px;font-weight:700;letter-spacing:-0.3px">${fmtMoney(s.v)}</p>

      <div class="rowx" style="margin-bottom:14px;overflow-x:auto">

      ${list.length===0&&html`<${Empty} emo="💸" title="Sin movimientos" text="Registra tu primer ingreso o gasto de este periodo."/>`}

          <div style="display:flex;justify-content:space-between;margin-bottom:6px;padding:0 4px">

            ${ts.map(t=>html`
              <div class="list-row">

                <div style="flex:1;min-width:0">

        ${f&&html`<div class="stack" style="gap:12px">
          <div class="seg">
            ${[['income','Ingreso'],['expense','Gasto']].map(([tp,l])=>html`<button class=${f.type===tp?'on':''} onClick=${()=>setF({...f,type:tp,category:FCATS[tp][0]})}>${l}</button>`)}
          </div>
          <div><label class="lbl">Monto</label><input type="number" inputmode="decimal" min="0" value=${f.amount} onInput=${e=>setF({...f,amount:e.target.value})} placeholder="0" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Categoría</label><select value=${f.category} onChange=${e=>setF({...f,category:e.target.value})}>${cats.map(c=>html`<option value=${c}>${c}</option>`)}</select></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
          </div>
          <div><label class="lbl">Descripción</label><input value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Cliente, proveedor o concepto"/></div>
          ${projects.length>0&&html`<div><label class="lbl">Proyecto (opcional)</label><select value=${f.projectId||''} onChange=${e=>setF({...f,projectId:e.target.value})}><option value="">Sin proyecto</option>${projects.map(p=>html`<option value=${p.id}>${p.name}</option>`)}</select></div>`}
          <${FormActions} isEdit=${!!f.id} label="Guardar" what="este movimiento" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// PAGE: CITAS  (cada cita pertenece a un proyecto; pagos → Finanzas)
// ══════════════════════════════════════════════════════════════════════════
const PageAppts = ({db,put,setTab}) => {
  const today = todayKey();
  const {appts,txns,projects} = db;
  const [f,setF] = useState(null);
  const [pay,setPay] = useState(null);
  const [onlyDebt,setOnlyDebt] = useState(false);
  const blank = {projectId:'',title:'',client:'',date:today,time:'',price:'',abono:'',note:'',status:'pendiente'};
  const name = a => apptName(db,a);
  const paid = a => apptPaid(txns,a.id);
  const owed = a => apptOwed(txns,a);
  const payTxn = (a,amount,category,date) => ({id:uid(),type:'income',amount:Number(amount),category,note:[name(a),a.client].filter(Boolean).join(' — '),date,apptId:a.id,projectId:a.projectId||''});
  const saveF = () => {
    if(!f.date)return;
    const {abono,...rest} = f;
    const item = {...rest,id:f.id||uid(),price:Number(f.price)||0};
    put('appts',f.id?appts.map(x=>x.id===item.id?item:x):[...appts,item]);
    if(!f.id&&Number(abono)>0) put('txns',[payTxn(item,abono,'Anticipo',today),...txns]);
    setF(null);
  };
  const pickProject = id => { const p=projects.find(x=>x.id===id); setF({...f,projectId:id,price:f.price||(p&&p.price?String(p.price):'')}); };
  const savePay = () => { if(!(Number(pay.amount)>0))return; put('txns',[payTxn(pay.appt,pay.amount,paid(pay.appt)>0?'Abono':'Anticipo',pay.date),...txns]); setPay(null); };
  const delPay = id => put('txns',txns.filter(t=>t.id!==id));
  const owedTotal = appts.reduce((s,a)=>s+owed(a),0);
  const del = id => put('appts',appts.filter(x=>x.id!==id));
  const toggle = a => put('appts',appts.map(x=>x.id===a.id?{...x,status:x.status==='hecha'?'pendiente':'hecha'}:x));
  const key = a => a.date+(a.time||'');
  const asc = appts.filter(a=>!onlyDebt||owed(a)>0).sort((a,b)=>key(a).localeCompare(key(b)));
  const groups = [
    ['Hoy', asc.filter(a=>a.date===today)],
    ['Próximas', asc.filter(a=>a.date>today)],
    ['Anteriores', asc.filter(a=>a.date<today).reverse().slice(0,15)],
  ].filter(g=>g[1].length);
  const pending = appts.filter(a=>a.status==='pendiente'&&a.date>=today).length;
  const options = f ? projects.filter(p=>p.status!=='listo'||p.id===f.projectId) : [];

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Citas</h2><p class="muted">${pending} pendiente${pending===1?'':'s'} · por cobrar <b class="num" style="color:var(--ink)">${fmtMoney(owedTotal)}</b></p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nueva cita</button>
      </div>
      <div class="rowx" style="margin-bottom:16px">
        ${[[false,'Todas'],[true,'Me deben']].map(([v,l])=>html`<button class=${'tab-pill'+(onlyDebt===v?' active':'')} onClick=${()=>setOnlyDebt(v)}>${l}</button>`)}
      </div>
      ${appts.length===0&&html`<${Empty} emo="📅" title="Tu agenda está vacía" text="Agenda tu primera cita y asígnala a un proyecto."/>`}
      ${appts.length>0&&groups.length===0&&html`<${Empty} emo="💖" title="Nadie te debe" text="Todas tus citas están liquidadas."/>`}
      ${groups.map(([gname,items])=>html`
        <div style="margin-bottom:20px">
          <p class="over" style="margin-bottom:8px">${gname}</p>
          <div class="cards">
            ${items.map(a=>{const st=A_STATUS[a.status]||A_STATUS.pendiente;const off=a.status!=='pendiente';return html`
              <div class="card" style=${{display:'flex',gap:12,alignItems:'flex-start',opacity:off?0.75:1}}>
                <div class=${'check-box'+(a.status==='hecha'?' done':'')} style="margin-top:2px" onClick=${()=>toggle(a)} title="Marcar como realizada">${a.status==='hecha'&&html`<${Ic} n="check" s=${13} c="var(--on-acc)"/>`}</div>
                <div style="flex:1;min-width:0">
                  <div class="rowx" style="justify-content:space-between;gap:8px">
                    <p class="ellip" style=${{fontSize:14,fontWeight:600,textDecoration:a.status==='cancelada'?'line-through':'none'}}>${name(a)}</p>
                    <span class=${'badge '+st.b}>${st.l}</span>
                  </div>
                  <div class="stack" style="gap:4px;margin-top:8px">
                    <span class="muted rowx" style="gap:6px;text-transform:capitalize"><${Ic} n="clock" s=${13} c="var(--ink-3)"/>${fmtDate(a.date)}${a.time?` · ${a.time}`:''}</span>
                    ${a.client&&html`<span class="muted rowx" style="gap:6px"><${Ic} n="user" s=${13} c="var(--ink-3)"/>${a.client}</span>`}
                    ${a.note&&html`<p class="tiny" style="margin-top:4px">${a.note}</p>`}
                  </div>
                  ${(a.price>0||paid(a)>0)&&html`
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding:10px;background:var(--surface-2);border-radius:12px">
                      ${[['Precio',a.price],['Abonado',paid(a)],['Falta',owed(a)]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:700">${fmtMoney(v)}</p></div>`)}
                    </div>
                    <div class="rowx" style="margin-top:8px;justify-content:space-between">
                      ${a.status==='cancelada'?html`<span class="tiny">Cancelada, no se cobra</span>`:owed(a)>0?html`<span class="badge b-warn">Debe ${fmtMoney(owed(a))}</span>`:html`<span class="badge b-good">Pagado</span>`}
                      ${owed(a)>0&&html`<button class="btn-g" style="padding:6px 12px;font-size:12px;min-height:0" onClick=${()=>setPay({appt:a,amount:String(owed(a)),date:today})}><${Ic} n="plus" s=${12}/>Agregar pago</button>`}
                    </div>`}
                </div>
                <button class="icon-btn" onClick=${()=>setF({...blank,...a})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
              </div>`;})}
          </div>
        </div>`)}

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar cita':'Nueva cita'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div>
            <label class="lbl">Proyecto</label>
            <select value=${f.projectId||''} onChange=${e=>pickProject(e.target.value)}>
              <option value="">${f.title?`Sin proyecto (${f.title})`:'Sin proyecto'}</option>
              ${options.map(p=>html`<option value=${p.id}>${p.name}</option>`)}
            </select>
            ${projects.length===0&&html`<p class="tiny" style="margin-top:6px">Aún no tienes proyectos. <a href="#" style="color:var(--pink-deep);font-weight:600" onClick=${e=>{e.preventDefault();setF(null);setTab('projects');}}>Crea uno</a> para poder elegirlo aquí.</p>`}
          </div>
          <div><label class="lbl">Cliente</label><input value=${f.client} onInput=${e=>setF({...f,client:e.target.value})} placeholder="Nombre del cliente"/></div>
          <div class="grid2">
            <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
            <div><label class="lbl">Hora</label><${TimePick} value=${f.time} onChange=${v=>setF({...f,time:v})}/></div>
          </div>
          <div class="grid2">
            <div><label class="lbl">Precio</label><input type="number" inputmode="decimal" min="0" value=${f.price} onInput=${e=>setF({...f,price:e.target.value})} placeholder="0"/></div>
            ${f.id?html`<div><label class="lbl">Falta por cobrar</label><input class="num" value=${fmtMoney(Math.max(0,(Number(f.price)||0)-apptPaid(txns,f.id)))} disabled/></div>`
                  :html`<div><label class="lbl">Anticipo (si dejó)</label><input type="number" inputmode="decimal" min="0" value=${f.abono} onInput=${e=>setF({...f,abono:e.target.value})} placeholder="0 = sin anticipo"/></div>`}
          </div>
          ${!f.id&&Number(f.price)>0&&html`<p class="tiny">Falta por cobrar: <b class="num" style="color:var(--ink)">${fmtMoney(Math.max(0,Number(f.price)-(Number(f.abono)||0)))}</b>${Number(f.abono)>0?' · el anticipo se registra en Finanzas con fecha de hoy':''}</p>`}
          ${f.id&&html`<div>
            <label class="lbl">Pagos recibidos</label>
            ${txns.filter(t=>t.apptId===f.id).length===0&&html`<p class="tiny">Sin pagos todavía.</p>`}
            ${txns.filter(t=>t.apptId===f.id).map(t=>html`
              <div class="list-row" style="padding:6px 0">
                <span class="muted" style="flex:1;text-transform:capitalize">${fmtDate(t.date)} · ${t.category}</span>
                <b class="num" style="font-size:13px">${fmtMoney(t.amount)}</b>
                <button class="icon-btn" style="padding:2px" onClick=${()=>ask('¿Quitar este pago?',()=>delPay(t.id),'También se borra de Finanzas.')} aria-label="Quitar pago"><${Ic} n="x" s=${12}/></button>
              </div>`)}
          </div>`}
          <div><label class="lbl">Estado</label><select value=${f.status} onChange=${e=>setF({...f,status:e.target.value})}>${Object.entries(A_STATUS).map(([k,v])=>html`<option value=${k}>${v.l}</option>`)}</select></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Agendar cita" what="esta cita" detail="Los pagos que ya registraste se quedan en Finanzas." onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>

      <${Modal} open=${!!pay} onClose=${()=>setPay(null)} title="Agregar pago">
        ${pay&&html`<div class="stack" style="gap:12px">
          <p class="muted"><b style="color:var(--ink)">${name(pay.appt)}</b>${pay.appt.client?` · ${pay.appt.client}`:''} — falta <b class="num" style="color:var(--ink)">${fmtMoney(owed(pay.appt))}</b></p>
          <div class="grid2">
            <div><label class="lbl">Monto del pago</label><input type="number" inputmode="decimal" min="0" value=${pay.amount} onInput=${e=>setPay({...pay,amount:e.target.value})} autoFocus/></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${pay.date} onInput=${e=>setPay({...pay,date:e.target.value})}/></div>
          </div>
          <p class="tiny">Se acredita como ingreso en Finanzas.</p>
          <button class="btn-p" style="width:100%;justify-content:center" onClick=${savePay}>Registrar pago</button>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// PAGE: PROYECTOS  (promoción o conjunto de trabajos con meta por ventas o citas)
// ══════════════════════════════════════════════════════════════════════════
const PageProjects = ({db,put}) => {
  const today = todayKey();
  const {projects} = db;
  const [f,setF] = useState(null);
  const [filter,setFilter] = useState('activos');
  const blank = {name:'',status:'curso',start:today,end:'',goalKind:'ventas',goalTarget:'',price:'',note:''};
  const saveF = () => { if(!f.name.trim())return; put('projects',upsert(projects,{...f,goalTarget:Number(f.goalTarget)||0,price:Number(f.price)||0})); setF(null); };
  const del = id => put('projects',projects.filter(x=>x.id!==id));
  const list = projects.filter(p=>filter==='todos'||(filter==='activos'?p.status!=='listo':p.status==='listo'));

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Proyectos</h2><p class="muted">${projects.filter(p=>p.status==='curso').length} activos · ${projects.filter(p=>p.status==='listo').length} terminados</p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nuevo</button>

      <div class="rowx" style="margin-bottom:16px;overflow-x:auto">
        ${[['activos','Activos'],['listos','Terminados'],['todos','Todos']].map(([v,l])=>html`<button class=${'tab-pill'+(filter===v?' active':'')} onClick=${()=>setFilter(v)}>${l}</button>`)}
      </div>
      ${list.length===0&&html`<${Empty} emo="💼" title="Sin proyectos aquí" text="Crea una promoción o un conjunto de trabajos, ponle una meta y asígnale citas."/>`}
      <div class="cards">
        ${list.map(p=>{
          const st=projStats(db,p); const ps=P_STATUS[p.status]||P_STATUS.curso; const r=projRange(p);
          return html`
            <div class="card">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px">
                <div style="min-width:0">
                  <p style="font-size:15px;font-weight:600">${p.name}</p>
                  <p class="tiny" style="margin-top:2px;text-transform:capitalize">${r?(r[0]===r[1]?fmtDate(r[0]):`${fmtDate(r[0])} → ${fmtDate(r[1])}`):'Sin fechas'}</p>
                </div>
                <div class="rowx" style="gap:2px;flex-shrink:0">
                  <span class=${'badge '+ps.b}>${ps.l}</span>
                  <button class="icon-btn" onClick=${()=>setF({...blank,...p,end:p.end||p.due||'',goalKind:p.goalKind||'ventas',goalTarget:p.goalTarget?String(p.goalTarget):'',price:p.price?String(p.price):''})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
                </div>
              </div>
              <p class="over" style="margin-bottom:6px">${p.goalKind==='citas'?'Meta por citas':'Meta por ventas'}</p>
              <div class="rowx" style="margin-bottom:4px">
                <div class="prog-track" style="flex:1"><div class="prog-fill" style=${{width:`${st.pct}%`}}/></div>
                <span class="num" style="font-size:16px;font-weight:700;min-width:44px;text-align:right">${st.pct}%</span>
              </div>
              <p class="muted num" style="margin-bottom:12px">${goalText(p,st)}</p>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--surface-2);border-radius:12px">
                ${[['Citas',st.count],['Vendido',fmtMoney(st.sold)],['Cobrado',fmtMoney(st.paid)]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:700">${v}</p></div>`)}
              </div>
              ${st.spent>0&&html`<p class="tiny num" style="margin-top:8px">Gastado en este proyecto: ${fmtMoney(st.spent)}</p>`}
              ${p.note&&html`<p class="tiny" style="margin-top:10px;padding-top:10px;border-top:1px solid rgb(var(--acc) / 0.10)">${p.note}</p>`}
            </div>`;
        })}
      </div>

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar proyecto':'Nuevo proyecto'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Nombre</label><input value=${f.name} onInput=${e=>setF({...f,name:e.target.value})} placeholder="Ej. Promo sesiones navideñas" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Inicia</label><input type="date" value=${f.start||''} onInput=${e=>setF({...f,start:e.target.value})}/></div>
            <div><label class="lbl">Termina</label><input type="date" value=${f.end||''} onInput=${e=>setF({...f,end:e.target.value})}/></div>
          </div>
          <div>
            <label class="lbl">¿Cómo mides la meta?</label>
            <div class="seg">

            </div>

          <div class="grid2">
            <div><label class="lbl">${f.goalKind==='citas'?'Meta (número de citas)':'Meta (ventas en $)'}</label><input type="number" inputmode="decimal" min="0" value=${f.goalTarget} onInput=${e=>setF({...f,goalTarget:e.target.value})} placeholder="0"/></div>
            <div><label class="lbl">Precio por cita (opcional)</label><input type="number" inputmode="decimal" min="0" value=${f.price} onInput=${e=>setF({...f,price:e.target.value})} placeholder="0"/></div>

          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Crear proyecto" what="este proyecto" detail="Sus citas no se borran; quedan sin proyecto." onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// PAGE: CALENDARIO  (citas y proyectos por venir)
// ══════════════════════════════════════════════════════════════════════════
const PageCalendar = ({db,setTab}) => {
  const today = todayKey();
  const {appts,txns} = db;
  const [ym,setYm] = useState(today.slice(0,7));
  const [sel,setSel] = useState(today);
  const [y,m] = ym.split('-').map(Number);
  const offset = (new Date(y,m-1,1).getDay()+6)%7;
  const nDays = new Date(y,m,0).getDate();
  const cells = [...Array(offset).fill(null),...Array.from({length:nDays},(_,i)=>`${ym}-${pad(i+1)}`)];
  while(cells.length%7) cells.push(null);
  const apptsOn = d => appts.filter(a=>a.date===d&&a.status!=='cancelada').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const go = d => { setSel(d); setYm(d.slice(0,7)); };

  const events = appts.filter(a=>a.status==='pendiente'&&a.date>=today)
    .map(a=>({date:a.date,time:a.time||'',text:apptName(db,a),sub:a.client||''}))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,8);
  const selA = apptsOn(sel);
  const longDate = d => { const t=new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}); return t[0].toUpperCase()+t.slice(1); };

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Calendario</h2><p class="muted">Tus citas por venir</p></div>
      </div>
      <div class="cal-layout">
        <div class="card">
          <div class="rowx" style="justify-content:space-between;margin-bottom:12px">
            <div class="rowx" style="gap:2px">
              <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,-1))} aria-label="Mes anterior"><${Ic} n="left" s=${16}/></button>
              <span style="font-size:14px;font-weight:600;min-width:130px;text-align:center">${fmtMonth(ym)}</span>
              <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,1))} aria-label="Mes siguiente"><${Ic} n="right" s=${16}/></button>
            </div>
            <button class="tab-pill" onClick=${()=>go(today)}>Hoy</button>
          </div>
          <div class="cal">
            ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>html`<div class="cal-head">${d}</div>`)}
            ${cells.map(d=>{
              if(!d) return html`<div class="cal-day off"/>`;
              const items=apptsOn(d).map(a=>({k:'a',t:(a.time?a.time+' ':'')+apptName(db,a)}));
              return html`
                <button class=${'cal-day'+(d===sel?' sel':'')+(d===today?' today':'')} onClick=${()=>setSel(d)}>
                  <span class="cal-num">${Number(d.slice(8))}</span>
                  <div class="cal-chips">
                    ${items.slice(0,3).map(it=>html`<span class=${'cal-chip '+it.k} title=${it.t}>${it.t}</span>`)}
                    ${items.length>3&&html`<span class="cal-more">+${items.length-3} más</span>`}
                  </div>
                </button>`;
            })}
          </div>
        </div>

        <div class="stack" style="gap:16px">
          <div class="card">
            <${CardHead} title=${sel===today?'Hoy':longDate(sel)} action="Ir a Citas" onAction=${()=>setTab('appts')}/>
            ${selA.length===0&&html`<p class="muted" style="padding:8px 0">Nada agendado este día.</p>`}
            ${selA.map(a=>html`
              <div class="list-row">
                <span class="dot" style="background:var(--pink-deep)"/>
                <div style="flex:1;min-width:0"><p class="ellip" style="font-size:13px;font-weight:600">${apptName(db,a)}</p><p class="tiny ellip">${a.time||'Sin hora'}${a.client?` · ${a.client}`:''}</p></div>
                ${apptOwed(txns,a)>0?html`<span class="badge b-warn num">Falta ${fmtMoney(apptOwed(txns,a))}</span>`:a.status==='hecha'?html`<span class="badge b-good">Realizada</span>`:null}
              </div>`)}
          </div>
          <div class="card">
            <${CardHead} title="Lo que viene"/>
            ${events.length===0&&html`<p class="muted" style="padding:8px 0">No hay nada próximo.</p>`}
            ${events.map(e=>html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>go(e.date)}>
                <span class="dot" style="background:var(--pink-deep)"/>
                <div style="flex:1;min-width:0"><p class="ellip" style="font-size:13px;font-weight:600">${e.text}</p><p class="tiny ellip">${e.sub}</p></div>
                <span class="tiny" style="text-transform:capitalize;white-space:nowrap">${e.date===today?'Hoy':fmtDate(e.date)}${e.time?` · ${e.time}`:''}</span>
              </div>`)}
          </div>
        </div>
      </div>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════════════════════════
const BIZ_ICONS = ['','✦','⭐','🎀','🌸','💎','🔥','🌙','📸','🎨','💄','💅','✂️','💼','☕','🧁'];
const Settings = ({open,onClose,biz,setBiz,icon,setIcon,session,theme,setTheme}) => {
  const [name,setName] = useState(biz);
  const [ic,setIc] = useState(icon);
  return html`
    <${Modal} open=${open} onClose=${onClose} title="Ajustes">
      <div class="stack" style="gap:14px">
        <div><label class="lbl">Nombre del negocio</label><input value=${name} onInput=${e=>setName(e.target.value)} placeholder="¿Cómo se llama tu negocio?"/></div>
        <div>
          <label class="lbl">Icono junto al nombre</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${BIZ_ICONS.map(e=>html`<button onClick=${()=>setIc(e)} style=${{minWidth:38,height:38,padding:'0 8px',borderRadius:12,cursor:'pointer',fontSize:e?18:11,color:'var(--ink-2)',
              background:ic===e?'var(--sel)':'rgb(var(--glass) / 0.5)',border:ic===e?'1.5px solid var(--pink-deep)':'1px solid rgb(var(--acc) / 0.2)'}}>${e||'Sin icono'}</button>`)}
          </div>
        </div>
        <button class="btn-p" style="width:100%;justify-content:center" onClick=${()=>{if(name.trim()!==biz)setBiz(name.trim());if(ic!==icon)setIcon(ic);onClose();}}>Guardar ajustes</button>
        <div>
          <label class="lbl">Tema de la app</label>
          <div class="seg">
            ${[['dark','Oscuro'],['rosa','Claro']].map(([k,l])=>html`<button class=${theme===k?'on':''} onClick=${()=>setTheme(k)}>${l}</button>`)}
          </div>
          <p class="tiny" style="margin-top:6px">El tema se guarda en este dispositivo.</p>
        </div>
        ${!SUPA_KEY&&html`<p class="tiny">Tus registros se guardan solo en este navegador.</p>`}
        ${session&&html`
          <div style="padding-top:12px;border-top:1px solid rgb(var(--acc) / 0.12)">
            <p class="muted" style="margin-bottom:10px">Sesión iniciada como <b style="color:var(--ink)">${session.user.email}</b>. Todo se guarda en tu cuenta.</p>
            <button class="btn-g" style="width:100%;justify-content:center" onClick=${()=>{onClose();sb.auth.signOut();}}>Cerrar sesión</button>
          </div>`}
      </div>
    <//>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// AUTH  (iniciar sesión / crear cuenta — cada cuenta tiene su propio negocio)
// ══════════════════════════════════════════════════════════════════════════
const Splash = ({text,children}) => html`
  <div class="auth-wrap"><div class="auth-card fade-up">
    <img src="icon.svg" width="40" height="40" alt="" style="border-radius:10px;margin-bottom:14px"/>
    <p class="muted">${text}</p>${children}
  </div></div>`;
const AuthScreen = () => {
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState('');
  const [pass,setPass] = useState('');
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const isUp = mode==='up';
  const go = async () => {
    if(!sb){ setMsg({t:'No se pudo conectar con la nube. Revisa tu internet y recarga.'}); return; }
    if(!email.trim()||pass.length<6){ setMsg({t:'Escribe tu correo y una contraseña de al menos 6 caracteres.'}); return; }
    setBusy(true); setMsg(null);
    const cred = {email:email.trim(),password:pass};
    const {data,error} = isUp ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
    setBusy(false);
    if(error){
      const m = (error.message||'').toLowerCase();
      setMsg({t: m.includes('already')?'Ese correo ya tiene cuenta. Inicia sesión.'
        : m.includes('rate')||error.status===429?'Demasiados intentos. Espera unos minutos.'
        : m.includes('not confirmed')?'Falta confirmar tu correo: abre el enlace que te enviamos.'
        : m.includes('signups not allowed')||m.includes('disabled')?'El registro de cuentas nuevas está desactivado.'
        : isUp?'No se pudo crear la cuenta: '+error.message:'Correo o contraseña incorrectos.'});
      return;
    }
    if(isUp&&!data.session){ setMsg({ok:true,t:'¡Cuenta creada! Te enviamos un correo: abre el enlace para confirmarla y luego inicia sesión aquí.'}); setMode('in'); setPass(''); }
  };
  return html`
    <div class="auth-wrap">
      <div class="auth-card fade-up">
        <img src="icon.svg" width="40" height="40" alt="" style="border-radius:10px;margin-bottom:14px"/>
        <p style="font-size:18px;font-weight:600;letter-spacing:-0.02em">${isUp?'Crea tu cuenta':'Inicia sesión en ritual.'}</p>
        <p class="muted" style="margin:4px 0 20px">Ingresos, citas y proyectos de tu negocio.</p>
        <div class="seg" style="margin-bottom:14px">
          ${[['in','Iniciar sesión'],['up','Crear cuenta']].map(([k,l])=>html`<button class=${mode===k?'on':''} onClick=${()=>{setMode(k);setMsg(null);}}>${l}</button>`)}
        </div>
        <div class="stack" style="gap:10px;text-align:left">
          <div><label class="lbl">Correo</label><input type="email" autocomplete="username" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="tu@correo.com"/></div>
          <div><label class="lbl">Contraseña</label><input type="password" autocomplete=${isUp?'new-password':'current-password'} value=${pass} onInput=${e=>setPass(e.target.value)} placeholder=${isUp?'Mínimo 6 caracteres':''} onKeyDown=${e=>{if(e.key==='Enter')go();}}/></div>
          ${msg&&html`<p class="tiny" style=${{color:msg.ok?'var(--good)':'var(--bad)',fontWeight:500}}>${msg.t}</p>`}
          <button class="btn-p" style="width:100%;justify-content:center;margin-top:4px" disabled=${busy} onClick=${go}>${busy?'Un momento…':isUp?'Crear mi cuenta':'Entrar'}</button>
          ${isUp&&html`<p class="tiny" style="text-align:center">Cada cuenta tiene su propio negocio. Nadie más ve tus registros.</p>`}
        </div>
      </div>
    </div>`;
};

// ══════════════════════════════════════════════════════════════════════════
// APP ROOT  — all data lives in `db`; `put` is the single write path
// ══════════════════════════════════════════════════════════════════════════
const EMPTY = {txns:[],appts:[],projects:[],goals:[]};
const App = () => {
  const [tab,setTab] = useState('home');
  const [showSet,setShowSet] = useState(false);
  const [biz,setBizS] = useState(()=>SUPA_KEY?'':load('ritual-name',''));
  const [icon,setIconS] = useState(()=>SUPA_KEY?'':load('ritual-icon',''));
  const [db,setDb] = useState(()=>SUPA_KEY?EMPTY:{txns:load('txns',[]),appts:load('appts',[]),projects:load('projects',[]),goals:load('goals',[])});
  const [session,setSession] = useState(SUPA_KEY&&sb?undefined:null);   // undefined = revisando sesión
  const [cloud,setCloud] = useState(SUPA_KEY?'cargando':'local');
  const [toast,setToast] = useState('');
  const flash = m => { setToast(m); setTimeout(()=>setToast(''),4000); };
  const [conf,setConf] = useState(null);
  bus.ask = setConf;
  const [theme,setThemeS] = useState(()=>document.documentElement.dataset.theme||'dark');
  const setTheme = v => { setThemeS(v); document.documentElement.dataset.theme=v; try{localStorage.setItem('ritual-theme',v);}catch{} };
  const uidNow = session&&session.user.id;

  const pushCloud = async (k,v) => {
    if(!sb||!uidNow)return;
    const {error} = await sb.from('ritual_data').upsert({owner:uidNow,key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'owner,key'});
    if(error) flash('No se pudo guardar en la nube: '+(error.message||'revisa tu conexión'));
  };
  const put = (k,v) => { setDb(d=>({...d,[k]:v})); if(SUPA_KEY) pushCloud(k,v); else save(k,v); };
  const setBiz = v => { setBizS(v); if(SUPA_KEY) pushCloud('name',v); else save('ritual-name',v); };
  const setIcon = v => { setIconS(v); if(SUPA_KEY) pushCloud('icon',v); else save('ritual-icon',v); };

  useEffect(()=>{
    if(!sb)return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,ses)=>setSession(ses||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  // Cada cuenta carga solo sus propios registros.
  useEffect(()=>{
    if(!sb)return;
    setDb(EMPTY); setBizS(''); setIconS(''); setTab('home'); setCloud('cargando');
    if(!uidNow)return;
    let dead=false;
    sb.from('ritual_data').select('key,value').eq('owner',uidNow).then(({data,error})=>{
      if(dead)return;
      if(error){ setCloud('error'); return; }
      const m = Object.fromEntries(data.map(r=>[r.key,r.value]));
      const n = {...EMPTY}; KEYS.forEach(k=>{ if(Array.isArray(m[k])) n[k]=m[k]; });
      setDb(n); setBizS(typeof m.name==='string'?m.name:''); setIconS(typeof m.icon==='string'?m.icon:''); setCloud('ok');
    });
    return ()=>{dead=true;};
  },[uidNow]);

  if(SUPA_KEY){
    if(session===undefined) return html`<${Splash} text="Cargando…"/>`;
    if(!session) return html`<${AuthScreen}/>`;
    if(cloud==='cargando') return html`<${Splash} text="Cargando tus registros…"/>`;
    if(cloud==='error') return html`<${Splash} text="No se pudieron cargar tus registros. Para no perder nada, la app no te deja editar hasta que carguen.">
      <div class="stack" style="margin-top:16px">
        <button class="btn-p" style="justify-content:center" onClick=${()=>location.reload()}>Reintentar</button>
        <button class="btn-g" style="justify-content:center" onClick=${()=>sb.auth.signOut()}>Cerrar sesión</button>
      </div><//>`;
  }

  const pages = {home:PageHome,finance:PageFinance,appts:PageAppts,projects:PageProjects,cal:PageCalendar};
  const Page  = pages[tab]||PageHome;

  return html`
    <div style="min-height:100vh">
      <nav class="sidebar">
        <div style="display:flex;align-items:center;gap:10px;padding:6px 10px 4px">
          <img src="icon.svg" width="24" height="24" alt="" style="border-radius:6px"/>
          <div style="min-width:0">
            <p class="logo-word ellip">${biz||'ritual.'}</p>
            ${biz&&html`<p class="tiny" style="font-size:11px;line-height:1.2">ritual.</p>`}
          </div>
        </div>
        <p class="side-label">Negocio</p>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1">
          ${TABS.map(t=>html`
            <button class=${'nav-item'+(tab===t.id?' active':'')} onClick=${()=>setTab(t.id)}>
              <${Ic} n=${t.icon} s=${16}/>${t.label}
            </button>
          `)}
        </div>
        <p class="tiny ellip" style="padding:0 10px 4px;font-size:11px">${session?session.user.email:'Guardado solo en este navegador'}</p>
        <button class="nav-item" onClick=${()=>setShowSet(true)}>
          <${Ic} n="settings" s=${16}/>Ajustes
        </button>
      </nav>

      <main class="main-content">
        <${Page} key=${tab} db=${db} put=${put} setTab=${setTab} biz=${biz} icon=${icon} openSettings=${()=>setShowSet(true)}/>
      </main>

      <nav class="bottom-nav">
        ${TABS.map(t=>html`
          <button class=${'bnav-item'+(tab===t.id?' active':'')} onClick=${()=>setTab(t.id)}>
            <${Ic} n=${t.icon} s=${20}/>
            <span>${t.id==='home'?'Inicio':t.label}</span>
          </button>
        `)}
      </nav>

      ${showSet&&html`<${Settings} open=${true} onClose=${()=>setShowSet(false)} biz=${biz} setBiz=${setBiz} icon=${icon} setIcon=${setIcon} session=${session} theme=${theme} setTheme=${setTheme}/>`}
      ${conf&&html`
        <div class="modal-bg" style="z-index:70" onClick=${()=>setConf(null)}>
          <div class="modal-box fade-up" style="max-width:360px" onClick=${e=>e.stopPropagation()}>
            <div class="modal-body" style="text-align:center;padding:26px 22px 22px">
              <div class="empty-ic" style="background:var(--bad-soft);color:var(--bad)"><${Ic} n="trash" s=${18}/></div>
              <p style="font-size:16px;font-weight:600;margin-bottom:6px">${conf.msg}</p>
              <p class="muted" style="margin-bottom:18px">${conf.detail?conf.detail+' ':''}Esta acción no se puede deshacer.</p>
              <div style="display:flex;gap:8px">
                <button class="btn-g" style="flex:1;justify-content:center" onClick=${()=>setConf(null)}>Cancelar</button>
                <button class="btn-d" style="flex:1" onClick=${()=>{const fn=conf.fn;setConf(null);fn();}}>Sí, eliminar</button>
              </div>
            </div>
          </div>
        </div>`}
      ${toast&&html`<div class="toast">${toast}</div>`}
    </div>
  `;
};

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>

// PAGE: PROYECTOS  (promoción o conjunto de trabajos con meta por ventas o citas)
// ══════════════════════════════════════════════════════════════════════════
const PageProjects = ({db,put}) => {
  const today = todayKey();
  const {projects} = db;
  const [f,setF] = useState(null);
  const [filter,setFilter] = useState('activos');
  const blank = {name:'',status:'curso',start:today,end:'',goalKind:'ventas',goalTarget:'',price:'',note:''};
  const saveF = () => { if(!f.name.trim())return; put('projects',upsert(projects,{...f,goalTarget:Number(f.goalTarget)||0,price:Number(f.price)||0})); setF(null); };
  const del = id => put('projects',projects.filter(x=>x.id!==id));
  const list = projects.filter(p=>filter==='todos'||(filter==='activos'?p.status!=='listo':p.status==='listo'));

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Proyectos</h2><p class="muted">${projects.filter(p=>p.status==='curso').length} activos · ${projects.filter(p=>p.status==='listo').length} terminados</p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="var(--on-acc)"/>Nuevo</button>
      </div>
      <div class="rowx" style="margin-bottom:16px;overflow-x:auto">
        ${[['activos','Activos'],['listos','Terminados'],['todos','Todos']].map(([v,l])=>html`<button class=${'tab-pill'+(filter===v?' active':'')} onClick=${()=>setFilter(v)}>${l}</button>`)}
      </div>
      ${list.length===0&&html`<${Empty} emo="💼" title="Sin proyectos aquí" text="Crea una promoción o un conjunto de trabajos, ponle una meta y asígnale citas."/>`}
      <div class="cards">
        ${list.map(p=>{
          const st=projStats(db,p); const ps=P_STATUS[p.status]||P_STATUS.curso; const r=projRange(p);
          return html`
            <div class="card">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px">
                <div style="min-width:0">
                  <p style="font-size:15px;font-weight:600">${p.name}</p>
                  <p class="tiny" style="margin-top:2px;text-transform:capitalize">${r?(r[0]===r[1]?fmtDate(r[0]):`${fmtDate(r[0])} → ${fmtDate(r[1])}`):'Sin fechas'}</p>
                </div>
                <div class="rowx" style="gap:2px;flex-shrink:0">
                  <span class=${'badge '+ps.b}>${ps.l}</span>
                  <button class="icon-btn" onClick=${()=>setF({...blank,...p,end:p.end||p.due||'',goalKind:p.goalKind||'ventas',goalTarget:p.goalTarget?String(p.goalTarget):'',price:p.price?String(p.price):''})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
                </div>
              </div>
              <p class="over" style="margin-bottom:6px">${p.goalKind==='citas'?'Meta por citas':'Meta por ventas'}</p>
              <div class="rowx" style="margin-bottom:4px">

};

const PageCalendar = ({db,setTab}) => {
  const today = todayKey();
  const {appts,txns} = db;
  const [ym,setYm] = useState(today.slice(0,7));
  const [sel,setSel] = useState(today);
  const [y,m] = ym.split('-').map(Number);
  const offset = (new Date(y,m-1,1).getDay()+6)%7;
  const nDays = new Date(y,m,0).getDate();
  const cells = [...Array(offset).fill(null),...Array.from({length:nDays},(_,i)=>`${ym}-${pad(i+1)}`)];
  while(cells.length%7) cells.push(null);
  const apptsOn = d => appts.filter(a=>a.date===d&&a.status!=='cancelada').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const go = d => { setSel(d); setYm(d.slice(0,7)); };

  const events = appts.filter(a=>a.status==='pendiente'&&a.date>=today)
    .map(a=>({a,date:a.date,time:a.time||'',text:apptName(db,a),sub:clientName(db,a)||''}))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,8);
  const selA = apptsOn(sel);
  const longDate = d => { const t=new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}); return t[0].toUpperCase()+t.slice(1); };

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Calendario</h2><p class="muted">Tus citas por venir</p></div>
      </div>
      <div class="cal-layout">
        <div class="card">
          <div class="rowx" style="justify-content:space-between;margin-bottom:12px">
            <div class="rowx" style="gap:2px">
              <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,-1))} aria-label="Mes anterior"><${Ic} n="left" s=${16}/></button>
              <span style="font-size:14px;font-weight:600;min-width:130px;text-align:center">${fmtMonth(ym)}</span>
              <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,1))} aria-label="Mes siguiente"><${Ic} n="right" s=${16}/></button>
            </div>
            <button class="tab-pill" onClick=${()=>go(today)}>Hoy</button>
          </div>
          <div class="cal">
            ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>html`<div class="cal-head">${d}</div>`)}
            ${cells.map(d=>{
              if(!d) return html`<div class="cal-day off"/>`;
              const items=apptsOn(d).map(a=>({k:'a',a,t:(a.time?a.time+' ':'')+apptName(db,a)}));
              return html`
                <button class=${'cal-day'+(d===sel?' sel':'')+(d===today?' today':'')} onClick=${()=>setSel(d)} onDblClick=${()=>act.newAppt({date:d})} title="Doble clic para agendar">
                  <span class="cal-num">${Number(d.slice(8))}</span>
                  <div class="cal-chips">
                    ${items.slice(0,3).map(it=>html`<span class=${'cal-chip '+it.k} title=${it.t} onClick=${e=>{e.stopPropagation();setSel(d);act.viewAppt(it.a);}}>${it.t}</span>`)}
                    ${items.length>3&&html`<span class="cal-more">+${items.length-3} más</span>`}
                  </div>
                </button>`;
            })}
          </div>
        </div>

        <div class="stack" style="gap:16px">
          <div class="card">
            <${CardHead} title=${sel===today?'Hoy':longDate(sel)} action="+ Agendar este día" onAction=${()=>act.newAppt({date:sel})}/>
            ${selA.length===0&&html`<p class="muted" style="padding:8px 0">Nada agendado este día. Tip: doble clic en un día para agendar.</p>`}
            ${selA.map(a=>html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>act.viewAppt(a)}>
                <span class="dot" style="background:var(--pink-deep)"/>
                <div style="flex:1;min-width:0"><p class="ellip" style="font-size:13px;font-weight:600">${apptName(db,a)}</p><p class="tiny ellip">${a.time||'Sin hora'}${clientName(db,a)?` · ${clientName(db,a)}`:''}</p></div>
                ${apptOwed(txns,a)>0?html`<span class="badge b-warn num">Falta ${fmtMoney(apptOwed(txns,a))}</span>`:a.status==='hecha'?html`<span class="badge b-good">Realizada</span>`:null}
              </div>`)}
          </div>
          <div class="card">
            <${CardHead} title="Lo que viene"/>
            ${events.length===0&&html`<p class="muted" style="padding:8px 0">No hay nada próximo.</p>`}
            ${events.map(e=>html`
              <div class="list-row" style="cursor:pointer" onClick=${()=>{go(e.date);act.viewAppt(e.a);}}>
                <span class="dot" style="background:var(--pink-deep)"/>
                <div style="flex:1;min-width:0"><p class="ellip" style="font-size:13px;font-weight:600">${e.text}</p><p class="tiny ellip">${e.sub}</p></div>
                <span class="tiny" style="text-transform:capitalize;white-space:nowrap">${e.date===today?'Hoy':fmtDate(e.date)}${e.time?` · ${e.time}`:''}</span>
              </div>`)}
          </div>
        </div>
      </div>
    </div>
  `;
};

        ${members.map(m=>html`<div class="list-row" style="padding:8px 0">
          <div style="flex:1;min-width:0"><p style="font-size:13px;font-weight:500" class="ellip">${m.name||m.email}</p><p class="tiny ellip">${m.email}</p></div>
          <button class="icon-btn" aria-label="Quitar del equipo" onClick=${()=>removeMember(m.email)}><${Ic} n="x" s=${14}/></button></div>`)}
        <div class="grid2" style="margin-top:8px"><input value=${nm} onInput=${e=>setNm(e.target.value)} placeholder="Nombre"/><input type="email" value=${em} onInput=${e=>setEm(e.target.value)} placeholder="correo@gmail.com"/></div>
        ${err&&html`<p class="tiny" style="color:var(--bad);margin-top:6px">${err}</p>`}
        <button class="btn-g" style="margin-top:8px" disabled=${busy||!em.trim()} onClick=${add}><${Ic} n="plus" s=${14}/>Agregar colaborador</button>`}
    </div>`}
    <div style=${sect}>
      <p class="h3" style="margin-bottom:4px">Sincronizar con tu calendario</p>
      <p class="tiny" style="margin-bottom:10px">${owner?'Tus citas':'Tus trabajos'} aparecen solos en el calendario de tu celular, y se actualizan cuando hay cambios.</p>
      ${!calTok ? html`<button class="btn-g" onClick=${getCalLink}><${Ic} n="cal" s=${14}/>Obtener mi link de calendario</button>` : html`
        <div class="rowx" style="flex-wrap:wrap;gap:6px">
          <a class="btn-g" style="text-decoration:none" href=${'https://calendar.google.com/calendar/r?cid='+encodeURIComponent(webcal)} target="_blank" rel="noopener">Agregar a Google Calendar</a>
          <a class="btn-g" style="text-decoration:none" href=${webcal}>Agregar a Apple / iPhone</a>
          <button class="btn-g" onClick=${()=>{navigator.clipboard&&navigator.clipboard.writeText(https).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});}}>${copied?'¡Copiado!':'Copiar link'}</button>
        </div>
        <p class="tiny" style="margin-top:8px">Google Calendar puede tardar unas horas en mostrar los cambios; en iPhone se actualiza más seguido. No compartas este link: quien lo tenga puede ver tu agenda.</p>`}
    </div>`;
};

const CollabHome = ({collab,updateJob,email}) => {
  const today = todayKey(), tomorrow = dKey(addDays(new Date(),1));
  const [rep,setRep] = useState({});
  const all = collab.flatMap(g=>(g.jobs||[]).map(j=>({...j,owner:g.owner,biz:g.biz}))).filter(j=>j.status!=='cancelada');
  const key = j => j.date+(j.time||'99');
  const upcoming = all.filter(j=>j.date>=today).sort((a,b)=>key(a).localeCompare(key(b)));
  const past = all.filter(j=>j.date<today).sort((a,b)=>key(b).localeCompare(key(a))).slice(0,10);
  const groups = {}; upcoming.forEach(j=>{ (groups[j.date]=groups[j.date]||[]).push(j); });
  const label = d => d===today?'Hoy':d===tomorrow?'Mañana':(()=>{const t=new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});return t[0].toUpperCase()+t.slice(1);})();
  const multi = new Set(collab.map(g=>g.owner)).size>1;
  const Card = ({j}) => { const done=j.status==='hecha', r=rep[j.id]??(j.report||'');
    return html`<div class="card" style=${{opacity:done?0.7:1}}>
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <p class="num" style="font-size:20px;font-weight:600;letter-spacing:-0.02em">${j.time||'Sin hora'}</p>
          <p style=${{fontSize:15,fontWeight:600,textDecoration:done?'line-through':'none'}}>${j.title}</p>
          ${multi&&html`<p class="tiny">${j.biz}</p>`}
        </div>
        <span class=${'badge '+(done?'b-good':'b-pink')}>${done?'Realizado':'Pendiente'}</span>
      </div>
      <div class="stack" style="gap:8px;margin-top:10px">
        ${j.client&&html`<div class="rowx" style="flex-wrap:wrap;gap:6px"><span class="muted rowx" style="gap:6px"><${Ic} n="user" s=${14} c="var(--ink-3)"/>${j.client}</span>
          ${j.phone&&html`<a class="btn-g" style="text-decoration:none;min-height:28px;font-size:12px" href=${'tel:'+j.phone.replace(/[^\d+]/g,'')}>Llamar</a>`}
          ${waLink(j.phone)&&html`<a class="btn-g" style="text-decoration:none;min-height:28px;font-size:12px" href=${waLink(j.phone)} target="_blank" rel="noopener">WhatsApp</a>`}</div>`}
        ${j.address&&html`<a class="muted rowx" style="gap:6px;text-decoration:none" href=${/^https?:/.test(j.address)?j.address:mapsLink(j.address)} target="_blank" rel="noopener"><${Ic} n="pin" s=${14} c="var(--ink-3)"/><span style="text-decoration:underline">${j.address}</span></a>`}
        ${j.notes&&html`<div style="padding:10px 12px;background:var(--surface-2);border-radius:8px"><p class="over" style="margin-bottom:4px">Indicaciones</p><p class="muted" style="white-space:pre-wrap">${j.notes}</p></div>`}
        <div><label class="lbl">Nota para tu jefe (opcional)</label>
          <div class="rowx"><input value=${r} onInput=${e=>setRep({...rep,[j.id]:e.target.value})} placeholder="Ej. Cliente pidió reagendar"/>
          ${r!==(j.report||'')&&html`<button class="btn-g" onClick=${()=>{updateJob(j.owner,j.id,{report:r});setRep({...rep,[j.id]:undefined});}}>Enviar</button>`}</div></div>
        <div class="rowx" style="flex-wrap:wrap;gap:6px;justify-content:space-between">
          <${CalButtons} ev=${{id:'job-'+j.id,date:j.date,time:j.time,dur:j.dur,title:j.title+(j.client?' · '+j.client:''),location:j.address,details:[j.client&&'Cliente: '+j.client,j.phone&&'Tel: '+j.phone,j.notes].filter(Boolean).join('\n')}}/>
          <button class=${done?'btn-g':'btn-p'} onClick=${()=>updateJob(j.owner,j.id,{status:done?'pendiente':'hecha',doneAt:done?'':new Date().toISOString()})}><${Ic} n="check" s=${14} c=${done?'currentColor':'var(--on-acc)'}/>${done?'Marcar pendiente':'Marcar realizado'}</button>
        </div>
      </div>
    </div>`; };
  return html`<div class="page fade-up" style="max-width:760px;margin:0 auto">
    <div class="page-header"><div class="col"><h2 class="h1">Mis trabajos</h2><p class="muted">${upcoming.filter(j=>j.status!=='hecha').length} pendientes · ${email}</p></div></div>
    ${upcoming.length===0&&html`<${Empty} emo="📅" title="No tienes trabajos asignados" text="Cuando te asignen una cita aparecerá aquí con la dirección y los datos del cliente."/>`}
    ${Object.entries(groups).map(([d,js])=>html`<div style="margin-bottom:20px"><p class="over" style="margin-bottom:8px">${label(d)}</p><div class="stack" style="gap:12px">${js.map(j=>html`<${Card} j=${j}/>`)}</div></div>`)}
    ${past.length>0&&html`<p class="over" style="margin:10px 0 8px">Anteriores</p><div class="card" style="padding:4px 16px">${past.map(j=>html`
      <div class="list-row"><span class="tiny" style="width:90px;text-transform:capitalize">${fmtDate(j.date)}</span><span class="ellip" style="flex:1;font-size:13px">${j.title}${j.client?' · '+j.client:''}</span><span class=${'badge '+(j.status==='hecha'?'b-good':'b-warn')}>${j.status==='hecha'?'Realizado':'Sin marcar'}</span></div>`)}</div>`}
  </div>`;
};

            <button class="btn-g" onClick=${exportBackup}><${Ic} n="download" s=${14}/>Descargar respaldo</button>
            <label class="btn-g" style="cursor:pointer">Restaurar desde archivo<input type="file" accept="application/json,.json" style="display:none" onChange=${e=>{const fl=e.target.files&&e.target.files[0]; e.target.value=''; if(!fl)return; fl.text().then(t=>{let o=null; try{o=JSON.parse(t);}catch{} onClose(); importBackup(o);});}}/></label>
          </div>
        </div>
        <div>
          <label class="lbl">Tema de la app</label>
          <div class="seg">
            ${[['dark','Oscuro'],['rosa','Claro']].map(([k,l])=>html`<button class=${theme===k?'on':''} onClick=${()=>setTheme(k)}>${l}</button>`)}
          </div>
          <p class="tiny" style="margin-top:6px">El tema se guarda en este dispositivo.</p>
        </div>
        ${!SUPA_KEY&&html`<p class="tiny">Tus registros se guardan solo en este navegador.</p>`}
        ${session&&html`
          <div style="padding-top:12px;border-top:1px solid rgb(var(--acc) / 0.12)">
            <p class="muted" style="margin-bottom:10px">Sesión iniciada como <b style="color:var(--ink)">${session.user.email}</b>. Todo se guarda en tu cuenta.</p>
            <button class="btn-g" style="width:100%;justify-content:center" onClick=${()=>{onClose();sb.auth.signOut();}}>Cerrar sesión</button>
          </div>`}
      </div>
    <//>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// AUTH  (iniciar sesión / crear cuenta — cada cuenta tiene su propio negocio)
// ══════════════════════════════════════════════════════════════════════════
const Splash = ({text,children}) => html`
  <div class="auth-wrap"><div class="auth-card fade-up">
    <img src="icon.svg" width="40" height="40" alt="" style="border-radius:10px;margin-bottom:14px"/>
    <p class="muted">${text}</p>${children}
  </div></div>`;
const AuthScreen = () => {
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState('');
  const [pass,setPass] = useState('');
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const isUp = mode==='up';
  const go = async () => {
    if(!sb){ setMsg({t:'No se pudo conectar con la nube. Revisa tu internet y recarga.'}); return; }
    if(!email.trim()||pass.length<6){ setMsg({t:'Escribe tu correo y una contraseña de al menos 6 caracteres.'}); return; }
    setBusy(true); setMsg(null);
    const cred = {email:email.trim(),password:pass};
    const {data,error} = isUp ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
    setBusy(false);
    if(error){
      const m = (error.message||'').toLowerCase();
      setMsg({t: m.includes('already')?'Ese correo ya tiene cuenta. Inicia sesión.'
        : m.includes('rate')||error.status===429?'Demasiados intentos. Espera unos minutos.'
        : m.includes('not confirmed')?'Falta confirmar tu correo: abre el enlace que te enviamos.'
        : m.includes('signups not allowed')||m.includes('disabled')?'El registro de cuentas nuevas está desactivado.'
        : isUp?'No se pudo crear la cuenta: '+error.message:'Correo o contraseña incorrectos.'});
      return;
    }
    if(isUp&&!data.session){ setMsg({ok:true,t:'¡Cuenta creada! Te enviamos un correo: abre el enlace para confirmarla y luego inicia sesión aquí.'}); setMode('in'); setPass(''); }
  };
  const google = async () => {
    if(!sb){ setMsg({t:'No se pudo conectar con la nube. Revisa tu internet y recarga.'}); return; }
    const {error} = await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error) setMsg({t:'No se pudo abrir el acceso con Google: '+error.message});
  };
  return html`
    <div class="auth-wrap">
      <div class="auth-card fade-up">
        <img src="icon.svg" width="40" height="40" alt="" style="border-radius:10px;margin-bottom:14px"/>
        <p style="font-size:18px;font-weight:600;letter-spacing:-0.02em">${isUp?'Crea tu cuenta':'Inicia sesión en ritual.'}</p>
        <p class="muted" style="margin:4px 0 20px">Ingresos, citas y proyectos de tu negocio.</p>
        <button class="btn-g" style="width:100%;min-height:38px;gap:10px" onClick=${google}>
          <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.500-4.800 7.200l7.500 5.800c4.400-4.100 7.100-10.100 7.100-17.500z"/><path fill="#FBBC05" d="M10.500 28.600c-.5-1.400-.8-3-.8-4.600s.3-3.200.8-4.600l-7.900-6.200C.9 16.500 0 20.100 0 24s.9 7.500 2.600 10.800l7.900-6.200z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.200-13.500-9.900l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>
          Continuar con Google
        </button>
        <div class="rowx" style="margin:14px 0;gap:10px"><div style="flex:1;height:1px;background:var(--line)"/><span class="tiny">o con tu correo</span><div style="flex:1;height:1px;background:var(--line)"/></div>
        <div class="seg" style="margin-bottom:14px">
          ${[['in','Iniciar sesión'],['up','Crear cuenta']].map(([k,l])=>html`<button class=${mode===k?'on':''} onClick=${()=>{setMode(k);setMsg(null);}}>${l}</button>`)}
        </div>
        <div class="stack" style="gap:10px;text-align:left">
          <div><label class="lbl">Correo</label><input type="email" autocomplete="username" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="tu@correo.com"/></div>
          <div><label class="lbl">Contraseña</label><input type="password" autocomplete=${isUp?'new-password':'current-password'} value=${pass} onInput=${e=>setPass(e.target.value)} placeholder=${isUp?'Mínimo 6 caracteres':''} onKeyDown=${e=>{if(e.key==='Enter')go();}}/></div>
          ${msg&&html`<p class="tiny" style=${{color:msg.ok?'var(--good)':'var(--bad)',fontWeight:500}}>${msg.t}</p>`}
          <button class="btn-p" style="width:100%;justify-content:center;margin-top:4px" disabled=${busy} onClick=${go}>${busy?'Un momento…':isUp?'Crear mi cuenta':'Entrar'}</button>
          ${isUp&&html`<p class="tiny" style="text-align:center">Cada cuenta tiene su propio negocio. Nadie más ve tus registros.</p>`}
          <p class="tiny" style="text-align:center;margin-top:6px">Al continuar aceptas los <a href="terminos.html" style="color:var(--ink-2)">Términos</a> y el <a href="privacidad.html" style="color:var(--ink-2)">Aviso de privacidad</a>.</p>
        </div>
      </div>
    </div>`;
};

// ══════════════════════════════════════════════════════════════════════════
// APP ROOT  — all data lives in `db`; `put` is the single write path
// ══════════════════════════════════════════════════════════════════════════
const EMPTY = {txns:[],appts:[],projects:[],goals:[],clients:[],docs:[],services:[],recurring:[]};
const App = () => {
  const [tab,setTab] = useState('home');
  const [showSet,setShowSet] = useState(false);
  const [biz,setBizS] = useState(()=>SUPA_KEY?'':load('ritual-name',''));
  const [icon,setIconS] = useState(()=>SUPA_KEY?'':load('ritual-icon',''));
  const [profile,setProfileS] = useState(()=>SUPA_KEY?{}:load('ritual-profile',{}));
  const [db,setDb] = useState(()=>SUPA_KEY?EMPTY:{txns:load('txns',[]),appts:load('appts',[]),projects:load('projects',[]),goals:load('goals',[]),clients:load('clients',[]),docs:load('docs',[]),services:load('services',[]),recurring:load('recurring',[])});
  const [session,setSession] = useState(SUPA_KEY&&sb?undefined:null);   // undefined = revisando sesión
  const [cloud,setCloud] = useState(SUPA_KEY?'cargando':'local');
  const [toast,setToast] = useState(null);
  const toastT = useRef(0);
  const flash = (msg,undo) => { clearTimeout(toastT.current); setToast({msg,undo}); toastT.current=setTimeout(()=>setToast(null),undo?7000:4000); };
  const [fab,setFab] = useState(false);
  const [menu,setMenu] = useState(false);
  const go = t => { setTab(t); setMenu(false); window.scrollTo(0,0); };
  const recRan = useRef('');
  const [saving,setSaving] = useState(0);
  const [failed,setFailed] = useState({});
  const dbRef = useRef(db); dbRef.current = db;
  const [conf,setConf] = useState(null);
  bus.ask = setConf;
  const [theme,setThemeS] = useState(()=>document.documentElement.dataset.theme||'dark');
  const setTheme = v => { setThemeS(v); document.documentElement.dataset.theme=v; try{localStorage.setItem('ritual-theme',v);}catch{} };
  const uidNow = session&&session.user.id;
  const myEmail = session ? (session.user.email||'').toLowerCase() : '';
  const [plan,setPlan] = useState('profesional');
  const [members,setMembers] = useState([]);
  const [invites,setInvites] = useState([]);
  const [mode,setModeS] = useState('own');
  const setMode = v => { setModeS(v); try{localStorage.setItem('ritual-mode-'+uidNow,JSON.stringify(v));}catch{} setMenu(false); window.scrollTo(0,0); };
  const [jobsRemote,setJobsRemote] = useState({});
  const [collab,setCollab] = useState([]);
  const [calTok,setCalTok] = useState('');
  const lastPush = useRef({});
  APP.plan = plan; APP.members = (PLANS[plan]||PLANS.profesional).feat.includes('team') ? members : [];

  // Cada guardado se rastrea: "Guardando…", "Guardado" o "Sin conexión" con reintento.
  const pushCloud = async (k,v) => {
    if(!sb||!uidNow)return;
    setSaving(n=>n+1);
    let error=null;
    lastPush.current[k]=Date.now();
    try{ ({error} = await sb.from('ritual_data').upsert({owner:uidNow,key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'owner,key'})); }catch(e){ error=e; }
    setSaving(n=>n-1);
    setFailed(f=>{ const n={...f}; if(error) n[k]=v; else delete n[k]; return n; });
  };
  const nFailed = Object.keys(failed).length;
  const retry = () => Object.entries(failed).forEach(([k,v])=>pushCloud(k,v));
  useEffect(()=>{
    if(!nFailed)return;
    const t=setInterval(retry,20000);
    window.addEventListener('online',retry);
    return ()=>{ clearInterval(t); window.removeEventListener('online',retry); };
  },[failed]);
  useEffect(()=>{
    const warn = e => { if(saving>0||nFailed>0){ e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('beforeunload',warn);
    return ()=>window.removeEventListener('beforeunload',warn);
  },[saving,nFailed]);
  // Eliminar con opción de deshacer: se guarda una foto de los datos antes de borrar.
  const confirmDelete = () => {
    const fn=conf.fn, snap=dbRef.current;
    setConf(null); fn();
    flash('Eliminado.',()=>{ const now=dbRef.current; KEYS.forEach(k=>{ if(now[k]!==snap[k]) put(k,snap[k]); }); flash('Listo, se restauró.'); });
  };
  // Gastos fijos: una vez por sesión, cuando ya cargaron los datos.
  useEffect(()=>{ const k=(uidNow||'local')+(cloud); if((cloud==='ok'||cloud==='local')&&recRan.current!==k){ recRan.current=k; runRecurring(db,put); } },[cloud,uidNow]);
  const exportBackup = () => {
    const data={app:'ritual.',version:1,exportedAt:new Date().toISOString(),biz,icon,profile,data:db};
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
    a.download=`ritual-respaldo-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove();
  };
  const importBackup = obj => {
    if(!obj||obj.app!=='ritual.'||!obj.data){ flash('Ese archivo no es un respaldo de ritual.'); return; }
    ask('¿Restaurar este respaldo?',()=>{
      KEYS.forEach(k=>{ if(Array.isArray(obj.data[k])) put(k,obj.data[k]); });
      if(typeof obj.biz==='string') setBiz(obj.biz); if(typeof obj.icon==='string') setIcon(obj.icon); if(obj.profile&&typeof obj.profile==='object') setProfile(obj.profile);
      flash('Respaldo restaurado.');
    },`Reemplaza tus datos actuales por los del ${obj.exportedAt?fmtLong(obj.exportedAt.slice(0,10)):'respaldo'}.`);
  };
  const saveState = !SUPA_KEY ? {t:'Guardado en este navegador',c:'var(--ink-3)'}
    : nFailed ? {t:'Sin conexión · Reintentar',c:'var(--bad)',click:retry}
    : saving ? {t:'Guardando…',c:'var(--warn)'} : {t:'Guardado',c:'var(--good)'};
  const put = (k,v) => { setDb(d=>({...d,[k]:v})); if(SUPA_KEY) pushCloud(k,v); else save(k,v); };
  const setBiz = v => { setBizS(v); if(SUPA_KEY) pushCloud('name',v); else save('ritual-name',v); };
  const setIcon = v => { setIconS(v); if(SUPA_KEY) pushCloud('icon',v); else save('ritual-icon',v); };
  const setProfile = v => { setProfileS(v); if(SUPA_KEY) pushCloud('profile',v); else save('ritual-profile',v); };

  useEffect(()=>{
    if(!sb)return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,ses)=>setSession(ses||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  // Cada cuenta carga solo sus propios registros.
  useEffect(()=>{
    if(!sb)return;
    setDb(EMPTY); setBizS(''); setIconS(''); setProfileS({}); setTab('home'); setCloud('cargando');
    if(!uidNow)return;
    let dead=false;
    sb.from('ritual_data').select('key,value').eq('owner',uidNow).then(({data,error})=>{
      if(dead)return;
      if(error){ setCloud('error'); return; }
      const m = Object.fromEntries(data.map(r=>[r.key,r.value]));
      const n = {...EMPTY}; KEYS.forEach(k=>{ if(Array.isArray(m[k])) n[k]=m[k]; });
      setJobsRemote(Object.fromEntries(data.filter(r=>r.key.startsWith('jobs:')).map(r=>[r.key.slice(5),r.value])));
      setDb(n); setBizS(typeof m.name==='string'?m.name:''); setIconS(typeof m.icon==='string'?m.icon:''); setProfileS(m.profile&&typeof m.profile==='object'?m.profile:{}); setCloud('ok');
    });
    return ()=>{dead=true;};
  },[uidNow]);

  // Plan, equipo e invitaciones de la cuenta.
  useEffect(()=>{
    setPlan('profesional'); setMembers([]); setInvites([]); setCollab([]); setCalTok(''); setModeS('own');
    if(!sb||!uidNow) return;
    let dead=false;
    (async()=>{
      const [pl,mem] = await Promise.all([sb.from('ritual_plans').select('plan').maybeSingle(), sb.from('ritual_members').select('owner,email,name')]);
      if(dead) return;
      if(pl.data&&PLANS[pl.data.plan]) setPlan(pl.data.plan);
      const rows = mem.data||[];
      setMembers(rows.filter(r=>r.owner===uidNow));
      const inv = rows.filter(r=>r.owner!==uidNow);
      setInvites(inv);
      if(inv.length) setModeS(load('ritual-mode-'+uidNow,'team'));
    })();
    return ()=>{dead=true;};
  },[uidNow]);
  // Colaborador: carga sus trabajos de cada negocio que lo invitó.
  const loadCollab = async () => {
    if(!sb||!invites.length) return;
    const owners=[...new Set(invites.map(i=>i.owner))];
    const {data} = await sb.from('ritual_data').select('owner,key,value').in('owner',owners);
    const rows=data||[];
    setCollab(owners.map(o=>({owner:o,biz:(rows.find(r=>r.owner===o&&r.key==='name')||{}).value||'Negocio',jobs:(rows.find(r=>r.owner===o&&r.key==='jobs:'+myEmail)||{}).value||[]})));
  };
  const loadCollabRef = useRef(null); loadCollabRef.current = loadCollab;
  useEffect(()=>{ if(mode==='team') loadCollab(); },[mode,invites]);
  const updateJob = async (owner,id,patch) => {
    const g=collab.find(x=>x.owner===owner); if(!g) return;
    const jobs=g.jobs.map(j=>j.id===id?{...j,...patch}:j);
    setCollab(c=>c.map(x=>x.owner===owner?{...x,jobs}:x));
    const {error} = await sb.from('ritual_data').update({value:jobs,updated_at:new Date().toISOString()}).eq('owner',owner).eq('key','jobs:'+myEmail);
    if(error) flash('No se pudo guardar. Revisa tu conexión.');
  };
  // Cambios en vivo: trabajos marcados por colaboradores y ediciones desde otro dispositivo.
  useEffect(()=>{
    if(!sb||!uidNow) return;
    const owners = mode==='team' ? [...new Set(invites.map(i=>i.owner))] : [uidNow];
    const chans = owners.map(o=>sb.channel('rd-'+o+'-'+mode).on('postgres_changes',{event:'*',schema:'public',table:'ritual_data',filter:'owner=eq.'+o},p=>{
      const r=p.new; if(!r||!r.key) return;
      if(mode==='team'){ loadCollabRef.current&&loadCollabRef.current(); return; }
      if(r.key.startsWith('jobs:')){ setJobsRemote(j=>({...j,[r.key.slice(5)]:r.value})); return; }
      if(Date.now()-(lastPush.current[r.key]||0)<5000) return;
      if(KEYS.includes(r.key)&&JSON.stringify(dbRef.current[r.key])!==JSON.stringify(r.value)) setDb(d=>({...d,[r.key]:r.value}));
    }).subscribe());
    return ()=>chans.forEach(c=>sb.removeChannel(c));
  },[uidNow,mode,invites]);
  // Jefe: publica a cada colaborador sus trabajos y trae sus avances a las citas.
  useEffect(()=>{
    if(!SUPA_KEY||mode!=='own'||cloud!=='ok'||!APP.members.length) return;
    const t=setTimeout(()=>{
      let changed=false;
      const appts=db.appts.map(a=>{
        if(!a.assignee) return a;
        const j=(jobsRemote[a.assignee]||[]).find(x=>x.id===a.id); if(!j) return a;
        let n=a;
        if(j.status==='hecha'&&a.status==='pendiente') n={...n,status:'hecha'};
        if((j.report||'')!==(a.report||'')) n={...n,report:j.report||''};
        if(n!==a) changed=true; return n;
      });
      if(changed){ put('appts',appts); return; }
      const since=dKey(addDays(new Date(),-30));
      APP.members.forEach(m=>{
        const cur=jobsRemote[m.email]||[];
        const jobs=db.appts.filter(a=>a.assignee===m.email&&a.date>=since).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))
          .map(a=>{ const j=toJob(db,a), c=cur.find(x=>x.id===a.id); return c?{...j,report:c.report||'',doneAt:c.doneAt||''}:j; });
        if(JSON.stringify(jobs)!==JSON.stringify(cur)){ pushCloud('jobs:'+m.email,jobs); setJobsRemote(r=>({...r,[m.email]:jobs})); }
      });
    },800);
    return ()=>clearTimeout(t);
  },[db.appts,db.clients,db.services,db.projects,members,jobsRemote,cloud,mode,plan]);
  const addMember = async (name,email) => {
    const em=(email||'').trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(em)) return 'Escribe un correo válido.';
    if(em===myEmail) return 'Ese es tu propio correo.';
    const {error} = await sb.from('ritual_members').insert({owner:uidNow,email:em,name:(name||'').trim()});
    if(error) return error.code==='23505'?'Esa persona ya está en tu equipo.':/row-level|policy/i.test(error.message||'')?'Tu plan no incluye colaboradores.':'No se pudo agregar. ¿Ya corriste el SQL de equipo en Supabase?';
    setMembers(m=>[...m,{owner:uidNow,email:em,name:(name||'').trim()}]); return '';
  };
  const removeMember = em => ask(`¿Quitar a ${em} de tu equipo?`, async ()=>{
    await sb.from('ritual_members').delete().eq('owner',uidNow).eq('email',em);
    await sb.from('ritual_data').delete().eq('owner',uidNow).eq('key','jobs:'+em);
    setMembers(m=>m.filter(x=>x.email!==em)); setJobsRemote(j=>{const n={...j}; delete n[em]; return n;});
    put('appts',dbRef.current.appts.map(a=>a.assignee===em?{...a,assignee:''}:a));
  },'Sus trabajos asignados vuelven a quedar contigo. Ya no podrá entrar a tu negocio.');
  const getCalLink = async () => {
    let {data} = await sb.from('ritual_cal').select('token').maybeSingle();
    if(!data){ const r=await sb.from('ritual_cal').insert({user_id:uidNow}).select('token').single(); data=r.data; }
    if(data&&data.token) setCalTok(data.token); else flash('No se pudo crear tu link. ¿Ya corriste el SQL de equipo y calendario en Supabase?');
  };

  if(SUPA_KEY){
    if(session===undefined) return html`<${Splash} text="Cargando…"/>`;
    if(!session) return html`<${AuthScreen}/>`;
    if(cloud==='cargando') return html`<${Splash} text="Cargando tus registros…"/>`;
    if(cloud==='error') return html`<${Splash} text="No se pudieron cargar tus registros. Para no perder nada, la app no te deja editar hasta que carguen.">
      <div class="stack" style="margin-top:16px">
        <button class="btn-p" style="justify-content:center" onClick=${()=>location.reload()}>Reintentar</button>
        <button class="btn-g" style="justify-content:center" onClick=${()=>sb.auth.signOut()}>Cerrar sesión</button>
      </div><//>`;
  }

  if(SUPA_KEY&&mode==='team'&&invites.length) return html`
    <div style="min-height:100vh">
      <header class="topbar" style="display:flex">
        <img src="icon.svg" width="24" height="24" alt="" style="border-radius:6px;margin-left:6px"/>
        <span class="logo-word ellip" style="flex:1">Mis trabajos</span>
        <button class="btn-g" style="min-height:30px;font-size:12px" onClick=${()=>setMode('own')}>Mi negocio</button>
        <button class="icon-btn" aria-label="Ajustes" onClick=${()=>setShowSet(true)}><${Ic} n="settings" s=${20} c="var(--ink)"/></button>
      </header>
      <main style="padding-top:calc(52px + env(safe-area-inset-top,0px));padding-bottom:40px"><${CollabHome} collab=${collab} updateJob=${updateJob} email=${myEmail}/></main>
      <${Modal} open=${showSet} onClose=${()=>setShowSet(false)} title="Ajustes">
        <div class="stack" style="gap:14px">
          <${TeamCal} owner=${false} calTok=${calTok} getCalLink=${getCalLink}/>
          <div><label class="lbl">Tema de la app</label><div class="seg">${[['dark','Oscuro'],['rosa','Claro']].map(([k,l])=>html`<button class=${theme===k?'on':''} onClick=${()=>setTheme(k)}>${l}</button>`)}</div></div>
          <button class="btn-g" style="justify-content:center" onClick=${()=>{setShowSet(false);sb.auth.signOut();}}>Cerrar sesión (${myEmail})</button>
        </div>
      <//>
      ${toast&&html`<div class="toast">${toast.msg}</div>`}
    </div>`;

  const pages = {home:PageHome,finance:PageFinance,appts:PageAppts,clients:PageClients,docs:PageDocs,services:PageServices,projects:PageProjects,cal:PageCalendar};
  const Page  = pages[tab]||PageHome;

  return html`
    <div style="min-height:100vh">
      <nav class=${"sidebar"+(menu?" open":"")}>
        <div style="display:flex;align-items:center;gap:10px;padding:6px 10px 4px">
          <img src="icon.svg" width="24" height="24" alt="" style="border-radius:6px"/>
          <div style="min-width:0">
            <p class="logo-word ellip">${biz||'ritual.'}</p>
            ${biz&&html`<p class="tiny" style="font-size:11px;line-height:1.2">ritual.</p>`}
          </div>
        </div>
        <p class="side-label">Negocio</p>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1">
          ${TABS.filter(t=>planOf().tabs.includes(t.id)).map(t=>html`
            <button class=${'nav-item'+(tab===t.id?' active':'')} onClick=${()=>go(t.id)}>
              <${Ic} n=${t.icon} s=${16}/>${t.label}
            </button>
          `)}
        </div>
        ${invites.length>0&&html`<button class="nav-item" onClick=${()=>setMode('team')}><${Ic} n="user" s=${16}/>Mis trabajos (equipo)</button>`}
        <button onClick=${saveState.click} style=${{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',background:'none',border:0,cursor:saveState.click?'pointer':'default',color:'var(--ink-2)',fontSize:11,textAlign:'left'}}>
          <span class="dot" style=${{width:6,height:6,background:saveState.c}}/>${saveState.t}
        </button>
        ${session&&html`<p class="tiny ellip" style="padding:0 10px 4px;font-size:11px">${session.user.email}</p>`}
        <button class="nav-item" onClick=${()=>{setMenu(false);setShowSet(true);}}>
          <${Ic} n="settings" s=${16}/>Ajustes
        </button>
      </nav>

      <main class="main-content">
        <${Page} key=${tab} db=${db} put=${put} setTab=${go} biz=${biz} icon=${icon} profile=${profile} setProfile=${setProfile} openSettings=${()=>setShowSet(true)}/>
      </main>

      <header class="topbar">
        <button class="icon-btn" aria-label="Abrir menú" onClick=${()=>setMenu(true)}><${Ic} n="menu" s=${22} c="var(--ink)"/></button>
        <span class="logo-word ellip" style="flex:1;text-align:center">${(TABS.find(t=>t.id===tab)||{}).label||'ritual.'}</span>
        <button class="icon-btn" aria-label="Ajustes" onClick=${()=>setShowSet(true)}><${Ic} n="settings" s=${20} c="var(--ink)"/></button>
      </header>
      ${menu&&html`<div class="drawer-bg" onClick=${()=>setMenu(false)}/>`}

      ${showSet&&html`<${Settings} open=${true} onClose=${()=>setShowSet(false)} biz=${biz} setBiz=${setBiz} icon=${icon} setIcon=${setIcon} profile=${profile} setProfile=${setProfile} session=${session} theme=${theme} setTheme=${setTheme} exportBackup=${exportBackup} importBackup=${importBackup} team=${SUPA_KEY&&session?{plan,members,addMember,removeMember,calTok,getCalLink}:null}/>`}
      ${conf&&html`
        <div class="modal-bg" style="z-index:70" onClick=${()=>setConf(null)}>
          <div class="modal-box fade-up" style="max-width:360px" onClick=${e=>e.stopPropagation()}>
            <div class="modal-body" style="text-align:center;padding:26px 22px 22px">
              <div class="empty-ic" style="background:var(--bad-soft);color:var(--bad)"><${Ic} n="trash" s=${18}/></div>
              <p style="font-size:16px;font-weight:600;margin-bottom:6px">${conf.msg}</p>
              <p class="muted" style="margin-bottom:18px">${conf.detail?conf.detail+' ':''}Podrás deshacerlo durante unos segundos.</p>
              <div style="display:flex;gap:8px">
                <button class="btn-g" style="flex:1;justify-content:center" onClick=${()=>setConf(null)}>Cancelar</button>
                <button class="btn-d" style="flex:1" onClick=${confirmDelete}>Sí, eliminar</button>
              </div>
            </div>
          </div>
        </div>`}
      <${ApptForms} db=${db} put=${put} setTab=${setTab}/>
      <${TxnForm} db=${db} put=${put}/>
      <${DocForm} db=${db} put=${put} biz=${biz} profile=${profile}/>

      ${fab&&html`<div style="position:fixed;inset:0;z-index:39" onClick=${()=>setFab(false)}/>`}
      <div class="fab-wrap">
        ${fab&&html`<div class="fab-menu fade-up">
          ${[['cal','Nueva cita',()=>act.newAppt()],['up','Ingreso',()=>act.newTxn('income')],['down','Gasto',()=>act.newTxn('expense')],['cam','Gasto con foto',()=>act.scanExpense()],['doc','Cotización',()=>act.newDoc('cot')],['doc','Nota de venta',()=>act.newDoc('nv')]].filter(FAB_OK).map(([ic,l,fn])=>html`
            <button class="nav-item" onClick=${()=>{setFab(false);fn();}}><${Ic} n=${ic} s=${15}/>${l}</button>`)}
        </div>`}
        <button class="fab" aria-label="Agregar" onClick=${()=>setFab(!fab)} style=${{transform:fab?'rotate(45deg)':'none'}}><${Ic} n="plus" s=${22} c="var(--on-acc)" sw=${2.2}/></button>
      </div>

      ${nFailed>0&&html`<div class="toast" style="top:16px;bottom:auto;background:var(--bad);color:#fff">No se pudieron guardar algunos cambios. Reintentando… <button onClick=${retry} style="margin-left:8px;background:none;border:0;color:#fff;font-weight:600;text-decoration:underline;cursor:pointer">Reintentar ahora</button></div>`}
      ${toast&&html`<div class="toast">${toast.msg}${toast.undo&&html`<button onClick=${()=>{const u=toast.undo;setToast(null);u();}} style="margin-left:12px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer">Deshacer</button>`}</div>`}
    </div>
  `;
};

render(html`<${App}/>`, document.getElementById('root'));
if('serviceWorker' in navigator && location.hostname!=='localhost') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ritual. — negocio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ── PINKY design tokens ── */
    :root{
      --bg:        #FFF9FA;
      --surface:   rgba(255,255,255,0.52);
      --surface-2: rgba(255,255,255,0.55);
      --line:      rgba(255,255,255,0.85);
      --ink:       #3D0F1C;
      --ink-2:     #7A3F4E;
      --ink-3:     #A26B7B;
      --pink:      #FF4D6D;
      --pink-deep: #F0345A;
      --pink-soft: rgba(255,92,122,0.15);
      --violet:    #7C5CD6;
      --violet-soft:#EEE9FB;
      --good:      #0E9467;
      --good-soft: #E3F6EE;
      --bad:       #D92D4B;
      --bad-soft:  #FDE8EC;
      --warn:      #B7791F;
      --warn-soft: #FDF3DC;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Montserrat',sans-serif;overflow-x:hidden;min-height:100vh;color:var(--ink);background:var(--bg);}

    /* ══ BACKGROUND ══ */
    .bg-scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);pointer-events:none;}
    .blob{position:absolute;border-radius:42% 58% 63% 37% / 45% 40% 60% 55%;}
    .blob.b1{width:54vmax;height:50vmax;right:-14vmax;top:-18vmax;background:#FF6B8A;opacity:.9;}
    .blob.b2{width:40vmax;height:42vmax;right:6vmax;top:-6vmax;background:#FF3D62;opacity:.55;border-radius:58% 42% 38% 62% / 52% 60% 40% 48%;}
    .blob.b3{width:46vmax;height:44vmax;left:-14vmax;bottom:-16vmax;background:#FF5C7A;opacity:.85;border-radius:60% 40% 45% 55% / 40% 55% 45% 60%;}
    .blob.b4{width:30vmax;height:30vmax;left:30vw;top:42vh;background:#FF8FA8;opacity:.55;border-radius:50% 50% 38% 62% / 60% 42% 58% 40%;}
    .blob.d1{width:34px;height:22px;right:38vw;top:9vh;background:#FF4D6D;border-radius:50%;}
    .blob.d2{width:16px;height:12px;right:35vw;top:5vh;background:#FF4D6D;border-radius:50%;}
    .blob.d3{width:40px;height:30px;left:34vw;bottom:8vh;background:#FF4D6D;border-radius:50%;}

    /* ══ SHELL ══ */
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:220px;z-index:30;
      background:rgba(255,255,255,0.78);
      backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
      border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:24px 12px;
    }
    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;padding:18px;
      box-shadow:0 6px 24px rgba(240,52,90,0.07);
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .card.click{cursor:pointer;}
    .card.click:hover{border-color:rgba(240,52,90,0.35);box-shadow:0 8px 28px rgba(240,52,90,0.13);}
    .nav-item{
      display:flex;align-items:center;gap:10px;padding:10px 12px;
      border-radius:12px;font-size:13px;font-weight:500;
      color:var(--ink-2);cursor:pointer;transition:all .15s ease;
      border:1px solid transparent;background:none;width:100%;text-align:left;font-family:'Montserrat',sans-serif;
    }
    .nav-item:hover{background:var(--pink-soft);color:var(--pink-deep);}
    .nav-item.active{background:var(--pink-soft);color:var(--pink-deep);border-color:rgba(240,52,90,0.22);font-weight:600;}
    .bottom-nav{
      display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;
      padding:8px 6px env(safe-area-inset-bottom,14px);
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
      border-top:1px solid var(--line);
    }
    .bnav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 2px;border-radius:12px;font-size:10px;font-weight:500;
      color:var(--ink-3);cursor:pointer;transition:all .18s ease;
      border:none;background:none;font-family:'Montserrat',sans-serif;
    }
    .bnav-item.active{color:var(--pink-deep);font-weight:600;}
    .main-content{min-height:100vh;max-width:1080px;padding-bottom:40px;}

    @media(min-width:768px){.main-content{margin-left:220px;}.mobile-only{display:none!important;}}
    @media(max-width:767px){
      .sidebar{display:none;}
      .bottom-nav{display:flex;}
      .main-content{margin-left:0;padding-bottom:96px;}
      .page{padding:18px 14px 0!important;}
      .card{padding:14px;}
      input,textarea,select{font-size:16px!important;}
      .btn-p,.btn-g{min-height:44px;}
    }

    /* Inputs */
    input,textarea,select{
      background:var(--surface-2);border:1px solid var(--line);
      color:var(--ink);border-radius:12px;padding:11px 14px;width:100%;outline:none;
      font-family:'Montserrat',sans-serif;font-size:13px;transition:all .2s;
    }
    input:focus,textarea:focus,select:focus{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px rgba(255,77,109,0.15);}
    input::placeholder,textarea::placeholder{color:var(--ink-3);}

    /* Buttons */
    .btn-p{
      background:linear-gradient(135deg,#FF7A93 0%,#F0345A 100%);color:#fff;
      border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;
      cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;
      font-family:'Montserrat',sans-serif;box-shadow:0 6px 16px rgba(240,52,90,0.28);
    }
    .btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(240,52,90,0.38);}
    .btn-p:active{transform:translateY(0);}
    .btn-g{
      background:var(--pink-soft);color:var(--pink-deep);
      border:1px solid rgba(240,52,90,0.22);border-radius:999px;
      padding:10px 16px;font-size:13px;font-weight:500;
      cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif;
      display:inline-flex;align-items:center;gap:7px;
    }
    .btn-g:hover{background:rgba(255,77,109,0.24);}
    .btn-d{
      background:var(--bad-soft);color:var(--bad);border:1px solid #F7C2CC;
      border-radius:999px;padding:10px 14px;font-size:13px;font-weight:500;
      cursor:pointer;font-family:'Montserrat',sans-serif;transition:all .2s;
      display:inline-flex;align-items:center;justify-content:center;
    }
    .btn-d:hover{background:#FAD3DA;}
    .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:8px;display:inline-flex;}
    .icon-btn:hover{color:var(--pink-deep);background:var(--pink-soft);}

    .check-box{
      width:22px;height:22px;border-radius:50%;
      border:1.5px solid rgba(240,52,90,0.38);background:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:all .2s;flex-shrink:0;
    }
    .check-box.done{background:var(--pink-deep);border-color:var(--pink-deep);}
    .prog-track{height:7px;background:var(--pink-soft);border-radius:4px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#FF7A93 0%,#F0345A 100%);transition:width .5s ease;}

    /* Modal */
    .modal-bg{
      position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
      padding:20px 16px;background:rgba(90,20,55,0.28);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    }
    .modal-box{
      background:#fff;border:1px solid var(--line);
      box-shadow:0 24px 70px rgba(120,20,70,0.28);border-radius:24px;
      width:100%;max-width:460px;display:flex;flex-direction:column;
      max-height:calc(100vh - 40px);overflow:hidden;
    }
    .modal-header-sticky{flex-shrink:0;padding:18px 20px 14px;border-bottom:1px solid var(--line);}
    .modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 20px;}
    @media(max-width:767px){.modal-box{max-height:calc(100vh - 100px);}}

    /* Badges & pills */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
    .b-pink{background:var(--pink-soft);color:var(--pink-deep);}
    .b-violet{background:var(--violet-soft);color:#5B3FC4;}
    .b-good{background:var(--good-soft);color:var(--good);}
    .b-bad{background:var(--bad-soft);color:var(--bad);}
    .b-warn{background:var(--warn-soft);color:var(--warn);}
    .b-mute{background:#F5EEF2;color:var(--ink-2);}
    .tab-pill{
      padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;
      border:1px solid var(--line);background:#fff;color:var(--ink-2);
      transition:all .15s;font-family:'Montserrat',sans-serif;white-space:nowrap;
    }
    .tab-pill.active{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep);}
    .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
    .seg button{padding:11px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--ink-2);font-family:'Montserrat',sans-serif;}
    .seg button.on{background:var(--pink-deep);color:#fff;}

    ::-webkit-scrollbar{width:4px;height:4px;} ::-webkit-scrollbar-thumb{background:rgba(240,52,90,0.3);border-radius:2px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
    .fade-up{animation:fadeUp .28s cubic-bezier(.4,0,.2,1);}

    /* Layout */
    .page{padding:28px 28px 0;}
    .page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
    .h1{font-size:22px;font-weight:700;letter-spacing:-0.3px;color:var(--ink);}
    .h3{font-size:13px;font-weight:600;color:var(--ink);}
    .muted{font-size:12px;color:var(--ink-2);}
    .tiny{font-size:11px;color:var(--ink-3);}
    .col{display:flex;flex-direction:column;gap:4px;}
    .stack{display:flex;flex-direction:column;gap:10px;}
    .rowx{display:flex;align-items:center;gap:10px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    .cols2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start;}
    @media(max-width:980px){.kpis{grid-template-columns:1fr 1fr;}.cols2{grid-template-columns:1fr;}}
    @media(max-width:420px){.cards{grid-template-columns:1fr;}}
    label.lbl{font-size:11px;font-weight:500;color:var(--ink-2);display:block;margin-bottom:5px;}
    .empty-state{text-align:center;padding:36px 20px;}
    .empty-state .emo{font-size:38px;margin-bottom:10px;}
    .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .chip{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .num{font-variant-numeric:tabular-nums;}
    .list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(240,52,90,0.10);}
    .list-row:last-child{border-bottom:none;}
    .readonly .page .btn-p,.readonly .page .btn-g,.readonly .page .add-dash,
    .readonly .page [aria-label="Editar"],.readonly .page [aria-label^="Quitar"]{display:none!important;}
    .readonly .page .check-box{pointer-events:none;}
    .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;
      padding:10px 16px;border-radius:999px;font-size:12px;font-weight:500;box-shadow:0 10px 30px rgba(58,17,40,0.35);max-width:calc(100vw - 32px);text-align:center;}
    /* ══ LIQUID GLASS ══ */
    .card,.sidebar,.bottom-nav,.modal-box,.tab-pill,.auth-card{
      backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    }
    .card{border-radius:24px;border:1px solid rgba(255,255,255,0.85);
      box-shadow:0 12px 40px rgba(240,52,90,0.13), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.35);}
    .card.click:hover{border-color:#fff;}
    .sidebar{background:rgba(255,255,255,0.42);border-right:1px solid rgba(255,255,255,0.8);}
    .bottom-nav{background:rgba(255,255,255,0.62);border-top:1px solid rgba(255,255,255,0.85);}
    .modal-bg{background:rgba(120,20,45,0.22);}
    .modal-box{background:rgba(255,255,255,0.82);border:1px solid rgba(255,255,255,0.95);box-shadow:0 30px 80px rgba(160,20,55,0.3), inset 0 1px 0 #fff;}
    .modal-header-sticky{border-bottom:1px solid rgba(240,52,90,0.12);}
    input,textarea,select{background:rgba(255,255,255,0.72);border:1px solid rgba(240,52,90,0.2);}
    .tab-pill{background:rgba(255,255,255,0.55);border-color:rgba(255,255,255,0.9);}
    .nav-item{border-radius:999px;padding:10px 16px;}
    .nav-item:hover{background:rgba(255,255,255,0.6);}
    .nav-item.active{background:#fff;color:var(--pink-deep);font-weight:700;border-color:transparent;box-shadow:0 8px 22px rgba(240,52,90,0.18);}
    .h1{font-weight:300;font-size:28px;letter-spacing:.3px;}
    .h3{font-weight:600;letter-spacing:.2px;}
    .over{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--ink-2);}
    .badge{text-transform:uppercase;letter-spacing:.8px;font-size:9.5px;font-weight:700;}
    .b-pink{background:#fff;color:var(--pink-deep);}
    .btn-p{letter-spacing:.3px;}
    .logo-word{font-size:20px;font-weight:300;letter-spacing:1px;color:var(--ink);}
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
    .auth-card{width:100%;max-width:400px;padding:34px 28px;border-radius:30px;background:rgba(255,255,255,0.5);
      border:1px solid rgba(255,255,255,0.9);box-shadow:0 30px 80px rgba(240,52,90,0.22), inset 0 1px 0 #fff;text-align:center;}
    .glass-pill{display:inline-block;background:#fff;color:var(--pink-deep);font-weight:700;letter-spacing:2px;font-size:22px;padding:4px 16px;border-radius:10px;}
    .bar{width:14px;border-radius:4px 4px 0 0;transition:height .5s;}
  </style>
</head>

<div class="bg-scene"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob d1"></div><div class="blob d2"></div><div class="blob d3"></div></div>
<div id="root" style="position:relative;z-index:1;min-height:100vh;"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useEffect } from 'https://esm.sh/preact@10.23.1/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ── NUBE (Supabase) ────────────────────────────────────────────────────────
// SUPA_KEY es la llave pública (anon / publishable). Vacía = solo este navegador.
const SUPA_URL = 'https://tefxfxbdylunaeajtcak.supabase.co';
const SUPA_KEY = 'sb_publishable_3CERy3XxHXUWnqyhXnqB4Q_y8IvLrS1';
let sb = null;
if(SUPA_KEY){
  try{ sb = (await import('https://esm.sh/@supabase/supabase-js@2')).createClient(SUPA_URL,SUPA_KEY); }catch{}
}
const KEYS = ['txns','appts','projects','goals'];

// ── UTILS ──────────────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,'0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dKey(new Date());
const load = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };
const save = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
const uid  = () => Date.now()+Math.random().toString(36).slice(2,6);
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const fmtMoney = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmtMonth = ym => { const s=new Date(ym+'-15T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'}); return s[0].toUpperCase()+s.slice(1); };
const shiftMonth = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const sum = (list,type) => list.filter(t=>t.type===type).reduce((s,t)=>s+(Number(t.amount)||0),0);
const upsert = (list,item) => item.id ? list.map(x=>x.id===item.id?item:x) : [...list,{...item,id:uid()}];

const FCATS = {
  income:['Ventas','Servicios','Anticipo','Abono','Comisiones','Inversión','Otro ingreso'],
  expense:['Insumos','Renta','Nómina','Marketing','Servicios','Software','Transporte','Impuestos','Equipo','Otro gasto'],
};
const C_INC = '#F0345A', C_EXP = '#7C5CD6';
const P_STATUS = {propuesta:{l:'Propuesta',b:'b-warn'},curso:{l:'En curso',b:'b-pink'},pausa:{l:'En pausa',b:'b-mute'},listo:{l:'Terminado',b:'b-good'}};
const A_STATUS = {pendiente:{l:'Pendiente',b:'b-pink'},hecha:{l:'Realizada',b:'b-good'},cancelada:{l:'Cancelada',b:'b-mute'}};

const apptPaid = (txns,id) => txns.filter(t=>t.apptId===id&&t.type==='income').reduce((s,t)=>s+(Number(t.amount)||0),0);
const apptOwed = (txns,a) => a.status==='cancelada' ? 0 : Math.max(0,(Number(a.price)||0)-apptPaid(txns,a.id));
const taskPct = p => { const t=p.tasks||[]; return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):(p.status==='listo'?100:0); };
const goalPct = g => {
  if(g.kind==='monto'){ const t=Number(g.target)||0; return t?Math.min(100,Math.round((Number(g.current)||0)/t*100)):0; }
  const s=g.subtasks||[]; return s.length?Math.round(s.filter(x=>x.done).length/s.length*100):0;
};

// ── ICONS ─────────────────────────────────────────────────────────────────
const ICON = {
  home: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  finance:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  cal:  '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  proj: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>',
  goal: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/>',
  x:    '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  up:   '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  down: '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/>',
  left: '<polyline points="15 18 9 12 15 6"/>',
  right:'<polyline points="9 18 15 12 9 6"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pin:  '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
  user: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',

const Modal = ({open,onClose,title,children}) => {
  if(!open) return null;
  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal-box fade-up" onClick=${e=>e.stopPropagation()}>
        <div class="modal-header-sticky">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <h3 style="font-size:16px;font-weight:600">${title}</h3>
            <button class="icon-btn" onClick=${onClose} aria-label="Cerrar"><${Ic} n="x" s=${16}/></button>
          </div>
        </div>
        <div class="modal-body">${children}</div>
      </div>
    </div>
  `;
};
const Empty = ({emo,title,text}) => html`

const FormActions = ({isEdit,onDelete,onSave,label}) => html`

    ${isEdit&&html`<button class="btn-d" style="flex:1" onClick=${onDelete}>Eliminar</button>`}

const CardHead = ({title,action,onAction}) => html`

    <p class="h3">${title}</p>
    ${action&&html`<button onClick=${onAction} style="background:none;border:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--pink-deep);font-family:Montserrat,sans-serif">${action}</button>`}
  </div>`;

  {id:'home',    label:'Dashboard', icon:'home'},

// PAGE: DASHBOARD
// ══════════════════════════════════════════════════════════════════════════
const PageHome = ({db,setTab,biz,openSettings}) => {
  const today = todayKey();
  const mo = today.slice(0,7);
  const {txns,appts,projects,goals} = db;
  const inMo = txns.filter(t=>(t.date||'').startsWith(mo));
  const prev = txns.filter(t=>(t.date||'').startsWith(shiftMonth(mo,-1)));
  const inc = sum(inMo,'income'), exp = sum(inMo,'expense'), net = inc-exp;
  const pInc = sum(prev,'income'), pExp = sum(prev,'expense');
  const delta = (a,b) => b ? Math.round((a-b)/b*100) : null;
  const margin = inc ? Math.round(net/inc*100) : null;

  const months = Array.from({length:6},(_,i)=>shiftMonth(mo,i-5)).map(ym=>{
    const l=txns.filter(t=>(t.date||'').startsWith(ym));
    return {ym,l:new Date(ym+'-15T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.',''),inc:sum(l,'income'),exp:sum(l,'expense')};
  });
  const maxV = Math.max(...months.flatMap(m=>[m.inc,m.exp]),1);
  const [hov,setHov] = useState(null);
  const shown = hov ?? months[5];

  const upcoming = appts.filter(a=>a.status!=='cancelada'&&a.status!=='hecha'&&a.date>=today)
    .sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,5);
  const active = projects.filter(p=>p.status==='curso'||p.status==='propuesta').slice(0,5);
  const openGoals = [...goals].sort((a,b)=>goalPct(a)-goalPct(b)).filter(g=>goalPct(g)<100).slice(0,4);
  const byCat={}; inMo.filter(t=>t.type==='expense').forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const debtors = appts.filter(a=>apptOwed(txns,a)>0);
  const owedTotal = debtors.reduce((s,a)=>s+apptOwed(txns,a),0);
  const kpis = [
    {l:'Ingresos del mes', v:fmtMoney(inc), d:delta(inc,pInc), goodUp:true, i:'up', bg:'var(--pink-soft)', c:C_INC},
    {l:'Gastos del mes',   v:fmtMoney(exp), d:delta(exp,pExp), goodUp:false, i:'down', bg:'var(--violet-soft)', c:C_EXP},
    {l:'Utilidad',         v:fmtMoney(net), sub:margin===null?'Sin ingresos aún':`Margen ${margin}%`, i:'finance', bg:net>=0?'var(--good-soft)':'var(--bad-soft)', c:net>=0?'var(--good)':'var(--bad)'},
    {l:'Por cobrar',       v:fmtMoney(owedTotal), sub:debtors.length?`${debtors.length} cita${debtors.length===1?'':'s'} con saldo`:'Nadie te debe', i:'cal', bg:'var(--warn-soft)', c:'var(--warn)', t:'appts'},
  ];

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col">
          <p class="over">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</p>
          <h1 class="h1">${biz||'Mi negocio'} 🎀</h1>
        </div>
        <button class="icon-btn mobile-only" onClick=${openSettings} aria-label="Ajustes"><${Ic} n="settings" s=${20}/></button>
      </div>

      <div class="kpis">
        ${kpis.map(k=>html`
          <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <span class="muted" style="font-weight:500">${k.l}</span>
              <div class="chip" style=${{background:k.bg,width:30,height:30,borderRadius:10}}><${Ic} n=${k.i} s=${15} c=${k.c}/></div>
            </div>
            <p class="num" style="font-size:24px;font-weight:700;letter-spacing:-0.5px">${k.v}</p>
            <p class="tiny" style="margin-top:4px">
              ${k.sub || (k.d===null ? 'Sin datos del mes pasado' : html`<span style=${{fontWeight:600,color:(k.d>=0)===k.goodUp?'var(--good)':'var(--bad)'}}>${k.d>=0?'▲':'▼'} ${Math.abs(k.d)}%</span> vs mes pasado`)}
            </p>
          </div>
        `)}
      </div>

      <div class="cols2">
        <div class="stack" style="gap:16px">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px">
              <div>
                <p class="h3">Ingresos vs gastos</p>
                <p class="tiny">Últimos 6 meses · ${fmtMonth(shown.ym)}</p>
              </div>
              <div style="display:flex;gap:14px;flex-wrap:wrap">
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_INC}}/>Ingresos <b class="num" style="color:var(--ink)">${fmtMoney(shown.inc)}</b></span>
                <span class="muted rowx" style="gap:6px"><span style=${{width:10,height:10,borderRadius:3,background:C_EXP}}/>Gastos <b class="num" style="color:var(--ink)">${fmtMoney(shown.exp)}</b></span>
              </div>
            </div>
            <div style="position:relative;height:150px;border-bottom:1px solid var(--line)">
              <div style="position:absolute;left:0;right:0;top:0;border-top:1px dashed rgba(240,52,90,0.10)"/>
              <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(240,52,90,0.10)"/>
              <span class="tiny num" style="position:absolute;left:0;top:2px">${fmtMoney(maxV)}</span>
              <div style="position:absolute;inset:0;display:flex;align-items:flex-end">
                ${months.map(m=>html`
                  <div onMouseEnter=${()=>setHov(m)} onMouseLeave=${()=>setHov(null)} onClick=${()=>setHov(m)}
                       style=${{flex:1,height:'100%',display:'flex',alignItems:'flex-end',justifyContent:'center',gap:2,cursor:'default',borderRadius:8,background:shown.ym===m.ym?'rgba(255,77,109,0.06)':'transparent'}}>
                    <div class="bar" style=${{background:C_INC,height:`${m.inc?Math.max(3,m.inc/maxV*140):0}px`}}/>
                    <div class="bar" style=${{background:C_EXP,height:`${m.exp?Math.max(3,m.exp/maxV*140):0}px`}}/>
                  </div>
                `)}
              </div>
            </div>
            <div style="display:flex;margin-top:6px">
              ${months.map(m=>html`<span class="tiny" style=${{flex:1,textAlign:'center',fontWeight:shown.ym===m.ym?600:400,color:shown.ym===m.ym?'var(--ink)':'var(--ink-3)'}}>${m.l}</span>`)}
            </div>
          </div>

          <div class="card">
            <${CardHead} title="Proyectos activos" action="Ver todos" onAction=${()=>setTab('projects')}/>
            ${active.length===0&&html`<p class="muted" style="padding:10px 0">Aún no hay proyectos en curso.</p>`}
            ${active.map(p=>{const pc=taskPct(p);return html`
              <div class="list-row">
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${p.name}</p>
                  <p class="tiny ellip">${p.client||'Sin cliente'}${p.due?` · entrega ${fmtDate(p.due)}`:''}</p>
                </div>
                <div class="prog-track" style="width:80px"><div class="prog-fill" style=${{width:`${pc}%`}}/></div>
                <span class="num muted" style="min-width:34px;text-align:right;font-weight:600">${pc}%</span>
              </div>`;})}
          </div>
        </div>

        <div class="stack" style="gap:16px">
          <div class="card">
            <${CardHead} title="Próximas citas" action="Agenda" onAction=${()=>setTab('appts')}/>
            ${upcoming.length===0&&html`<p class="muted" style="padding:10px 0">No tienes citas pendientes.</p>`}
            ${upcoming.map(a=>html`
              <div class="list-row">
                <div class="chip" style="background:var(--pink-soft);flex-direction:column;width:42px;height:42px">
                  <span style="font-size:14px;font-weight:700;color:var(--pink-deep);line-height:1">${Number(a.date.slice(8))}</span>
                  <span style="font-size:9px;font-weight:600;color:var(--pink-deep);text-transform:uppercase">${new Date(a.date+'T12:00:00').toLocaleDateString('es-MX',{month:'short'}).replace('.','')}</span>
                </div>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:600">${a.title}</p>
                  <p class="tiny ellip">${a.date===today?'Hoy':fmtDate(a.date)}${a.time?` · ${a.time}`:''}${a.client?` · ${a.client}`:''}</p>
                </div>
                ${apptOwed(txns,a)>0&&html`<span class="badge b-warn num">Falta ${fmtMoney(apptOwed(txns,a))}</span>`}
              </div>`)}
          </div>

          <div class="card">
            <${CardHead} title="Objetivos" action="Ver todos" onAction=${()=>setTab('goals')}/>
            ${openGoals.length===0&&html`<p class="muted" style="padding:10px 0">${goals.length?'¡Todos tus objetivos están cumplidos! 🎉':'Define tu primer objetivo.'}</p>`}
            ${openGoals.map(g=>{const pc=goalPct(g);return html`
              <div style="padding:8px 0">
                <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px">
                  <span class="ellip" style="font-size:13px;font-weight:500">${g.title}</span>
                  <span class="num muted" style="font-weight:600">${pc}%</span>
                </div>
                <div class="prog-track"><div class="prog-fill" style=${{width:`${pc}%`}}/></div>
              </div>`;})}
          </div>

          <div class="card">
            <${CardHead} title="En qué se va el dinero" action="Finanzas" onAction=${()=>setTab('finance')}/>
            ${cats.length===0&&html`<p class="muted" style="padding:10px 0">Sin gastos registrados este mes.</p>`}
            ${cats.map(([c,a])=>html`
              <div class="rowx" style="margin-bottom:8px">
                <span class="muted ellip" style="flex:1">${c}</span>
                <div class="prog-track" style="width:80px;background:var(--violet-soft)"><div style=${{height:'100%',borderRadius:4,background:C_EXP,width:`${Math.min(100,a/exp*100)}%`}}/></div>
                <span class="num" style="font-size:12px;font-weight:600;min-width:72px;text-align:right">${fmtMoney(a)}</span>
              </div>`)}
          </div>
        </div>
      </div>
    </div>
  `;
};

// PAGE: FINANCE  (ingresos y egresos)

const PageFinance = ({db,put}) => {
  const today = todayKey();
  const {txns,projects} = db;
  const [ym,setYm] = useState(today.slice(0,7));
  const [scope,setScope] = useState('mes');
  const [kind,setKind] = useState('todos');
  const [f,setF] = useState(null);
  const blank = type => ({type,amount:'',category:FCATS[type][0],note:'',date:today,projectId:''});
  const saveF = () => { if(!Number(f.amount))return; put('txns',upsert(txns,{...f,amount:Number(f.amount)})); setF(null); };
  const del = id => put('txns',txns.filter(x=>x.id!==id));

  const pfx = scope==='mes'?ym:ym.slice(0,4);
  const inP = txns.filter(t=>(t.date||'').startsWith(pfx));
  const inc = sum(inP,'income'), exp = sum(inP,'expense'), bal = inc-exp;
  const list = inP.filter(t=>kind==='todos'||t.type===kind).sort((a,b)=>b.date.localeCompare(a.date));
  const byDay={}; list.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t);});
  const cats = f ? [...new Set([...FCATS[f.type],f.category])] : [];
  const pName = id => (projects.find(p=>p.id===id)||{}).name;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Ingresos y egresos</h2><p class="muted">${scope==='mes'?fmtMonth(ym):`Año ${ym.slice(0,4)}`}</p></div>
        <div class="rowx" style="gap:8px">
          <button class="btn-g" onClick=${()=>setF(blank('expense'))}><${Ic} n="down" s=${14}/>Gasto</button>
          <button class="btn-p" onClick=${()=>setF(blank('income'))}><${Ic} n="up" s=${14} c="#fff"/>Ingreso</button>
        </div>
      </div>

      <div class="rowx" style="margin-bottom:16px;flex-wrap:wrap">
        <div class="rowx" style="gap:2px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px">
          <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,scope==='mes'?-1:-12))} aria-label="Anterior"><${Ic} n="left" s=${16}/></button>
          <span style="font-size:12px;font-weight:600;min-width:110px;text-align:center">${scope==='mes'?fmtMonth(ym):ym.slice(0,4)}</span>
          <button class="icon-btn" onClick=${()=>setYm(shiftMonth(ym,scope==='mes'?1:12))} aria-label="Siguiente"><${Ic} n="right" s=${16}/></button>
        </div>
        ${[['mes','Mes'],['año','Año']].map(([v,l])=>html`<button class=${'tab-pill'+(scope===v?' active':'')} onClick=${()=>setScope(v)}>${l}</button>`)}
      </div>

      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        ${[
          {l:'Ingresos',v:inc,i:'up',bg:'var(--pink-soft)',c:C_INC},
          {l:'Gastos',v:exp,i:'down',bg:'var(--violet-soft)',c:C_EXP},
          {l:'Utilidad',v:bal,i:'finance',bg:bal>=0?'var(--good-soft)':'var(--bad-soft)',c:bal>=0?'var(--good)':'var(--bad)'},
        ].map(s=>html`
          <div class="card" style="padding:14px">
            <div class="rowx" style="gap:8px;margin-bottom:6px"><div class="chip" style=${{background:s.bg,width:26,height:26,borderRadius:9}}><${Ic} n=${s.i} s=${13} c=${s.c}/></div><span class="muted">${s.l}</span></div>
            <p class="num" style="font-size:19px;font-weight:700;letter-spacing:-0.3px">${fmtMoney(s.v)}</p>
          </div>`)}
      </div>

      <div class="rowx" style="margin-bottom:14px;overflow-x:auto">
        ${[['todos','Todos'],['income','Ingresos'],['expense','Gastos']].map(([v,l])=>html`<button class=${'tab-pill'+(kind===v?' active':'')} onClick=${()=>setKind(v)}>${l}</button>`)}
      </div>

      ${list.length===0&&html`<${Empty} emo="💸" title="Sin movimientos" text="Registra tu primer ingreso o gasto de este periodo."/>`}
      ${Object.entries(byDay).map(([day,ts])=>html`
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;padding:0 4px">
            <span class="muted" style="font-weight:600;text-transform:capitalize">${day===today?'Hoy':fmtDate(day)}</span>
            <span class="tiny num">${fmtMoney(sum(ts,'income')-sum(ts,'expense'))}</span>
          </div>
          <div class="card" style="padding:4px 16px">
            ${ts.map(t=>html`
              <div class="list-row">
                <div class="chip" style=${{background:t.type==='income'?'var(--pink-soft)':'var(--violet-soft)'}}><${Ic} n=${t.type==='income'?'up':'down'} s=${15} c=${t.type==='income'?C_INC:C_EXP}/></div>
                <div style="flex:1;min-width:0">
                  <p class="ellip" style="font-size:13px;font-weight:500">${t.note||t.category}</p>
                  <p class="tiny ellip">${t.category}${pName(t.projectId)?` · ${pName(t.projectId)}`:''}</p>
                </div>
                <p class="num" style="font-size:14px;font-weight:700;flex-shrink:0">${t.type==='income'?'+':'−'}${fmtMoney(t.amount)}</p>
                <button class="icon-btn" onClick=${()=>setF({projectId:'',...t,amount:String(t.amount)})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
              </div>`)}
          </div>
        </div>`)}

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar movimiento':'Nuevo movimiento'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div class="seg">
            ${[['income','💰 Ingreso'],['expense','💸 Gasto']].map(([tp,l])=>html`<button class=${f.type===tp?'on':''} onClick=${()=>setF({...f,type:tp,category:FCATS[tp][0]})}>${l}</button>`)}
          </div>
          <div><label class="lbl">Monto</label><input type="number" inputmode="decimal" min="0" value=${f.amount} onInput=${e=>setF({...f,amount:e.target.value})} placeholder="0" autoFocus/></div>
          <div class="grid2">
            <div><label class="lbl">Categoría</label><select value=${f.category} onChange=${e=>setF({...f,category:e.target.value})}>${cats.map(c=>html`<option value=${c}>${c}</option>`)}</select></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
          </div>
          <div><label class="lbl">Descripción</label><input value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Cliente, proveedor o concepto"/></div>
          ${projects.length>0&&html`<div><label class="lbl">Proyecto (opcional)</label><select value=${f.projectId||''} onChange=${e=>setF({...f,projectId:e.target.value})}><option value="">Sin proyecto</option>${projects.map(p=>html`<option value=${p.id}>${p.name}</option>`)}</select></div>`}
          <${FormActions} isEdit=${!!f.id} label="Guardar" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// PAGE: CITAS
// ══════════════════════════════════════════════════════════════════════════
const PageAppts = ({db,put}) => {
  const today = todayKey();
  const {appts,txns} = db;
  const [f,setF] = useState(null);
  const [pay,setPay] = useState(null);
  const [onlyDebt,setOnlyDebt] = useState(false);
  const blank = {title:'',client:'',date:today,time:'',price:'',abono:'',note:'',status:'pendiente'};
  const paid = a => apptPaid(txns,a.id);
  const owed = a => apptOwed(txns,a);
  const payTxn = (a,amount,category,date) => ({id:uid(),type:'income',amount:Number(amount),category,note:[a.title,a.client].filter(Boolean).join(' — '),date,apptId:a.id,projectId:''});
  const saveF = () => {
    if(!f.title.trim()||!f.date)return;
    const {abono,...rest} = f;
    const item = {...rest,id:f.id||uid(),price:Number(f.price)||0};
    put('appts',f.id?appts.map(x=>x.id===item.id?item:x):[...appts,item]);
    if(!f.id&&Number(abono)>0) put('txns',[payTxn(item,abono,'Anticipo',today),...txns]);
    setF(null);
  };
  const savePay = () => { if(!(Number(pay.amount)>0))return; put('txns',[payTxn(pay.appt,pay.amount,paid(pay.appt)>0?'Abono':'Anticipo',pay.date),...txns]); setPay(null); };
  const delPay = id => put('txns',txns.filter(t=>t.id!==id));
  const owedTotal = appts.reduce((s,a)=>s+owed(a),0);
  const del = id => put('appts',appts.filter(x=>x.id!==id));
  const toggle = a => put('appts',appts.map(x=>x.id===a.id?{...x,status:x.status==='hecha'?'pendiente':'hecha'}:x));
  const key = a => a.date+(a.time||'');
  const asc = appts.filter(a=>!onlyDebt||owed(a)>0).sort((a,b)=>key(a).localeCompare(key(b)));
  const groups = [
    ['Hoy', asc.filter(a=>a.date===today)],
    ['Próximas', asc.filter(a=>a.date>today)],
    ['Anteriores', asc.filter(a=>a.date<today).reverse().slice(0,15)],
  ].filter(g=>g[1].length);
  const pending = appts.filter(a=>a.status==='pendiente'&&a.date>=today).length;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Citas</h2><p class="muted">${pending} pendiente${pending===1?'':'s'} · por cobrar <b class="num" style="color:var(--ink)">${fmtMoney(owedTotal)}</b></p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="#fff"/>Nueva cita</button>
      </div>
      <div class="rowx" style="margin-bottom:16px">
        ${[[false,'Todas'],[true,'Me deben']].map(([v,l])=>html`<button class=${'tab-pill'+(onlyDebt===v?' active':'')} onClick=${()=>setOnlyDebt(v)}>${l}</button>`)}
      </div>
      ${appts.length===0&&html`<${Empty} emo="📅" title="Tu agenda está vacía" text="Agenda tu primera cita con un cliente."/>`}
      ${appts.length>0&&groups.length===0&&html`<${Empty} emo="💖" title="Nadie te debe" text="Todas tus citas están liquidadas."/>`}
      ${groups.map(([name,items])=>html`
        <div style="margin-bottom:20px">
          <p class="muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.6px;font-size:11px;margin-bottom:8px">${name}</p>
          <div class="cards">
            ${items.map(a=>{const st=A_STATUS[a.status]||A_STATUS.pendiente;const off=a.status!=='pendiente';return html`
              <div class="card" style=${{display:'flex',gap:12,alignItems:'flex-start',opacity:off?0.7:1}}>
                <div class=${'check-box'+(a.status==='hecha'?' done':'')} style="margin-top:2px" onClick=${()=>toggle(a)} title="Marcar como realizada">${a.status==='hecha'&&html`<${Ic} n="check" s=${13} c="#fff"/>`}</div>
                <div style="flex:1;min-width:0">
                  <div class="rowx" style="justify-content:space-between;gap:8px">
                    <p class="ellip" style=${{fontSize:14,fontWeight:600,textDecoration:a.status==='cancelada'?'line-through':'none'}}>${a.title}</p>
                    <span class=${'badge '+st.b}>${st.l}</span>
                  </div>
                  <div class="stack" style="gap:4px;margin-top:8px">
                    <span class="muted rowx" style="gap:6px;text-transform:capitalize"><${Ic} n="clock" s=${13} c="var(--ink-3)"/>${fmtDate(a.date)}${a.time?` · ${a.time}`:''}</span>
                    ${a.client&&html`<span class="muted rowx" style="gap:6px"><${Ic} n="user" s=${13} c="var(--ink-3)"/>${a.client}</span>`}
                    ${a.note&&html`<p class="tiny" style="margin-top:4px">${a.note}</p>`}
                  </div>
                  ${(a.price>0||paid(a)>0)&&html`
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding:10px;background:var(--surface-2);border-radius:12px">
                      ${[['Precio',a.price],['Abonado',paid(a)],['Falta',owed(a)]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:700">${fmtMoney(v)}</p></div>`)}
                    </div>
                    <div class="rowx" style="margin-top:8px;justify-content:space-between">
                      ${a.status==='cancelada'?html`<span class="tiny">Cancelada, no se cobra</span>`:owed(a)>0?html`<span class="badge b-warn">Debe ${fmtMoney(owed(a))}</span>`:html`<span class="badge b-good">✓ Pagado</span>`}
                      ${owed(a)>0&&html`<button class="btn-g" style="padding:6px 12px;font-size:12px;min-height:0" onClick=${()=>setPay({appt:a,amount:String(owed(a)),date:today})}><${Ic} n="plus" s=${12}/>Agregar pago</button>`}
                    </div>`}
                </div>
                <button class="icon-btn" onClick=${()=>setF({...blank,...a})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
              </div>`;})}
          </div>
        </div>`)}

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar cita':'Nueva cita'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Motivo</label><input value=${f.title} onInput=${e=>setF({...f,title:e.target.value})} placeholder="Ej. Reunión de propuesta" autoFocus/></div>
          <div><label class="lbl">Cliente</label><input value=${f.client} onInput=${e=>setF({...f,client:e.target.value})} placeholder="Nombre del cliente"/></div>
          <div class="grid2">
            <div><label class="lbl">Fecha</label><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/></div>
            <div><label class="lbl">Hora</label><input type="time" value=${f.time} onInput=${e=>setF({...f,time:e.target.value})}/></div>
          </div>
          <div class="grid2">
            <div><label class="lbl">Precio</label><input type="number" inputmode="decimal" min="0" value=${f.price} onInput=${e=>setF({...f,price:e.target.value})} placeholder="0"/></div>
            ${f.id?html`<div><label class="lbl">Falta por cobrar</label><input class="num" value=${fmtMoney(Math.max(0,(Number(f.price)||0)-apptPaid(txns,f.id)))} disabled/></div>`
                  :html`<div><label class="lbl">Anticipo (si dejó)</label><input type="number" inputmode="decimal" min="0" value=${f.abono} onInput=${e=>setF({...f,abono:e.target.value})} placeholder="0 = sin anticipo"/></div>`}
          </div>
          ${!f.id&&Number(f.price)>0&&html`<p class="tiny">Falta por cobrar: <b class="num" style="color:var(--ink)">${fmtMoney(Math.max(0,Number(f.price)-(Number(f.abono)||0)))}</b>${Number(f.abono)>0?' · el anticipo se registra en Finanzas con fecha de hoy':''}</p>`}
          ${f.id&&html`<div>
            <label class="lbl">Pagos recibidos</label>
            ${txns.filter(t=>t.apptId===f.id).length===0&&html`<p class="tiny">Sin pagos todavía.</p>`}
            ${txns.filter(t=>t.apptId===f.id).map(t=>html`
              <div class="list-row" style="padding:6px 0">
                <span class="muted" style="flex:1;text-transform:capitalize">${fmtDate(t.date)} · ${t.category}</span>
                <b class="num" style="font-size:13px">${fmtMoney(t.amount)}</b>
                <button class="icon-btn" style="padding:2px" onClick=${()=>delPay(t.id)} aria-label="Quitar pago"><${Ic} n="x" s=${12}/></button>
              </div>`)}
          </div>`}
          <div><label class="lbl">Estado</label><select value=${f.status} onChange=${e=>setF({...f,status:e.target.value})}>${Object.entries(A_STATUS).map(([k,v])=>html`<option value=${k}>${v.l}</option>`)}</select></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Agendar cita" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>

      <${Modal} open=${!!pay} onClose=${()=>setPay(null)} title="Agregar pago">
        ${pay&&html`<div class="stack" style="gap:12px">
          <p class="muted"><b style="color:var(--ink)">${pay.appt.title}</b>${pay.appt.client?` · ${pay.appt.client}`:''} — falta <b class="num" style="color:var(--ink)">${fmtMoney(owed(pay.appt))}</b></p>
          <div class="grid2">
            <div><label class="lbl">Monto del pago</label><input type="number" inputmode="decimal" min="0" value=${pay.amount} onInput=${e=>setPay({...pay,amount:e.target.value})} autoFocus/></div>
            <div><label class="lbl">Fecha</label><input type="date" value=${pay.date} onInput=${e=>setPay({...pay,date:e.target.value})}/></div>
          </div>
          <p class="tiny">Se acredita como ingreso en Finanzas.</p>
          <button class="btn-p" style="width:100%;justify-content:center" onClick=${savePay}>Registrar pago</button>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// PAGE: PROYECTOS  (tasks drive % progress, money linked from Finanzas)
// ══════════════════════════════════════════════════════════════════════════
const PageProjects = ({db,put}) => {
  const {projects,txns} = db;
  const [f,setF] = useState(null);
  const [filter,setFilter] = useState('activos');
  const [addFor,setAddFor] = useState(null);
  const [taskText,setTaskText] = useState('');
  const blank = {name:'',client:'',status:'curso',budget:'',due:'',note:'',tasks:[]};
  const saveF = () => { if(!f.name.trim())return; put('projects',upsert(projects,{...f,budget:Number(f.budget)||0})); setF(null); };
  const del = id => put('projects',projects.filter(x=>x.id!==id));
  const patch = (id,fn) => put('projects',projects.map(p=>p.id===id?fn(p):p));
  const addTask = id => { if(!taskText.trim())return; patch(id,p=>({...p,tasks:[...(p.tasks||[]),{id:uid(),title:taskText.trim(),done:false}]})); setTaskText(''); };
  const toggleTask = (id,tid) => patch(id,p=>({...p,tasks:p.tasks.map(t=>t.id===tid?{...t,done:!t.done}:t)}));
  const delTask = (id,tid) => patch(id,p=>({...p,tasks:p.tasks.filter(t=>t.id!==tid)}));
  const list = projects.filter(p=>filter==='todos'||(filter==='activos'?p.status!=='listo':p.status==='listo'));

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Proyectos</h2><p class="muted">${projects.filter(p=>p.status==='curso').length} en curso · ${projects.filter(p=>p.status==='listo').length} terminados</p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="#fff"/>Nuevo</button>
      </div>
      <div class="rowx" style="margin-bottom:16px;overflow-x:auto">
        ${[['activos','Activos'],['listos','Terminados'],['todos','Todos']].map(([v,l])=>html`<button class=${'tab-pill'+(filter===v?' active':'')} onClick=${()=>setFilter(v)}>${l}</button>`)}
      </div>
      ${list.length===0&&html`<${Empty} emo="💼" title="Sin proyectos aquí" text="Crea un proyecto y agrega tareas para medir su avance."/>`}
      <div class="cards">
        ${list.map(p=>{
          const pc=taskPct(p); const st=P_STATUS[p.status]||P_STATUS.curso;
          const mine=txns.filter(t=>t.projectId===p.id); const pin=sum(mine,'income'), pout=sum(mine,'expense');
          return html`
            <div class="card">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px">
                <div style="min-width:0">
                  <p style="font-size:15px;font-weight:600">${p.name}</p>
                  <p class="tiny" style="margin-top:2px">${p.client||'Sin cliente'}${p.due?` · entrega ${fmtDate(p.due)}`:''}</p>
                </div>
                <div class="rowx" style="gap:2px;flex-shrink:0">
                  <span class=${'badge '+st.b}>${st.l}</span>
                  <button class="icon-btn" onClick=${()=>setF({...blank,...p,budget:p.budget?String(p.budget):''})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
                </div>
              </div>
              <div class="rowx" style="margin-bottom:12px">
                <div class="prog-track" style="flex:1"><div class="prog-fill" style=${{width:`${pc}%`}}/></div>
                <span class="num" style="font-size:14px;font-weight:700;min-width:40px;text-align:right">${pc}%</span>
              </div>
              ${(p.budget>0||mine.length>0)&&html`
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;padding:10px;background:var(--surface-2);border-radius:12px">
                  ${[['Presupuesto',p.budget],['Cobrado',pin],['Gastado',pout]].map(([l,v])=>html`<div><p class="tiny">${l}</p><p class="num" style="font-size:13px;font-weight:600">${fmtMoney(v)}</p></div>`)}
                </div>`}
              <div class="stack" style="gap:6px">
                ${(p.tasks||[]).map(t=>html`
                  <div class="rowx" style="padding:7px 10px;background:var(--surface-2);border-radius:10px">
                    <div class=${'check-box'+(t.done?' done':'')} style="width:18px;height:18px;border-radius:6px" onClick=${()=>toggleTask(p.id,t.id)}>${t.done&&html`<${Ic} n="check" s=${11} c="#fff"/>`}</div>
                    <p style=${{fontSize:12,flex:1,color:t.done?'var(--ink-3)':'var(--ink)',textDecoration:t.done?'line-through':'none'}}>${t.title}</p>
                    <button class="icon-btn" style="padding:2px" onClick=${()=>delTask(p.id,t.id)} aria-label="Quitar tarea"><${Ic} n="x" s=${12}/></button>
                  </div>`)}
                ${addFor===p.id?html`
                  <div class="rowx" style="gap:6px">
                    <input value=${taskText} onInput=${e=>setTaskText(e.target.value)} placeholder="Nueva tarea…" autoFocus style="flex:1;padding:8px 10px" onKeyDown=${e=>{if(e.key==='Enter')addTask(p.id);if(e.key==='Escape')setAddFor(null);}}/>
                    <button class="btn-p" style="padding:8px 14px" onClick=${()=>addTask(p.id)}>+</button>
                  </div>`:html`
                  <button class="add-dash" onClick=${()=>{setAddFor(p.id);setTaskText('');}} style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1px dashed rgba(240,52,90,0.38);background:none;color:var(--pink-deep);font-size:12px;cursor:pointer;width:100%;font-family:Montserrat,sans-serif">
                    <${Ic} n="plus" s=${12}/> Agregar tarea
                  </button>`}
              </div>
              ${p.note&&html`<p class="tiny" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(240,52,90,0.10)">${p.note}</p>`}
            </div>`;
        })}
      </div>

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar proyecto':'Nuevo proyecto'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Nombre</label><input value=${f.name} onInput=${e=>setF({...f,name:e.target.value})} placeholder="Nombre del proyecto" autoFocus/></div>
          <div><label class="lbl">Cliente</label><input value=${f.client} onInput=${e=>setF({...f,client:e.target.value})} placeholder="¿Para quién es?"/></div>
          <div class="grid2">
            <div><label class="lbl">Estado</label><select value=${f.status} onChange=${e=>setF({...f,status:e.target.value})}>${Object.entries(P_STATUS).map(([k,v])=>html`<option value=${k}>${v.l}</option>`)}</select></div>
            <div><label class="lbl">Entrega</label><input type="date" value=${f.due} onInput=${e=>setF({...f,due:e.target.value})}/></div>
          </div>
          <div><label class="lbl">Presupuesto</label><input type="number" inputmode="decimal" min="0" value=${f.budget} onInput=${e=>setF({...f,budget:e.target.value})} placeholder="0"/></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Crear proyecto" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// PAGE: OBJETIVOS  (por pasos o por monto)
// ══════════════════════════════════════════════════════════════════════════
const PageGoals = ({db,put}) => {
  const {goals} = db;
  const [f,setF] = useState(null);
  const [addFor,setAddFor] = useState(null);
  const [stepText,setStepText] = useState('');
  const blank = {title:'',kind:'pasos',target:'',current:'',due:'',note:'',subtasks:[]};
  const saveF = () => { if(!f.title.trim())return; put('goals',upsert(goals,{...f,target:Number(f.target)||0,current:Number(f.current)||0})); setF(null); };
  const del = id => put('goals',goals.filter(x=>x.id!==id));
  const patch = (id,fn) => put('goals',goals.map(g=>g.id===id?fn(g):g));
  const addStep = id => { if(!stepText.trim())return; patch(id,g=>({...g,subtasks:[...(g.subtasks||[]),{id:uid(),title:stepText.trim(),done:false}]})); setStepText(''); };
  const done = goals.filter(g=>goalPct(g)>=100).length;

  return html`
    <div class="page fade-up">
      <div class="page-header">
        <div class="col"><h2 class="h1">Objetivos</h2><p class="muted">${done}/${goals.length} cumplidos</p></div>
        <button class="btn-p" onClick=${()=>setF({...blank})}><${Ic} n="plus" s=${15} c="#fff"/>Nuevo</button>
      </div>
      ${goals.length===0&&html`<${Empty} emo="🎯" title="Define tu primer objetivo" text="Puede ser una meta de ventas en dinero o una lista de pasos."/>`}
      <div class="cards">
        ${goals.map(g=>{
          const pc=goalPct(g); const isM=g.kind==='monto';
          return html`
            <div class="card">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px">
                <div style="min-width:0">
                  <p style="font-size:15px;font-weight:600">${pc>=100?'⭐ ':''}${g.title}</p>
                  <p class="tiny" style="margin-top:2px">${isM?'Meta en dinero':'Meta por pasos'}${g.due?` · límite ${fmtDate(g.due)}`:''}</p>
                </div>
                <button class="icon-btn" onClick=${()=>setF({...blank,...g,kind:g.kind||'pasos',target:g.target?String(g.target):'',current:g.current?String(g.current):''})} aria-label="Editar"><${Ic} n="edit" s=${14}/></button>
              </div>
              <div class="rowx" style="margin-bottom:10px">
                <div class="prog-track" style="flex:1"><div class="prog-fill" style=${{width:`${pc}%`}}/></div>
                <span class="num" style="font-size:16px;font-weight:700;min-width:44px;text-align:right">${pc}%</span>
              </div>
              ${isM?html`
                <p class="muted num"><b style="color:var(--ink);font-size:14px">${fmtMoney(g.current)}</b> de ${fmtMoney(g.target)}</p>
              `:html`
                <div class="stack" style="gap:6px">
                  ${(g.subtasks||[]).map(s=>html`
                    <div class="rowx" style="padding:7px 10px;background:var(--surface-2);border-radius:10px">
                      <div class=${'check-box'+(s.done?' done':'')} style="width:18px;height:18px;border-radius:6px" onClick=${()=>patch(g.id,x=>({...x,subtasks:x.subtasks.map(y=>y.id===s.id?{...y,done:!y.done}:y)}))}>${s.done&&html`<${Ic} n="check" s=${11} c="#fff"/>`}</div>
                      <p style=${{fontSize:12,flex:1,color:s.done?'var(--ink-3)':'var(--ink)',textDecoration:s.done?'line-through':'none'}}>${s.title}</p>
                      <button class="icon-btn" style="padding:2px" onClick=${()=>patch(g.id,x=>({...x,subtasks:x.subtasks.filter(y=>y.id!==s.id)}))} aria-label="Quitar paso"><${Ic} n="x" s=${12}/></button>
                    </div>`)}
                  ${addFor===g.id?html`
                    <div class="rowx" style="gap:6px">
                      <input value=${stepText} onInput=${e=>setStepText(e.target.value)} placeholder="Nuevo paso…" autoFocus style="flex:1;padding:8px 10px" onKeyDown=${e=>{if(e.key==='Enter')addStep(g.id);if(e.key==='Escape')setAddFor(null);}}/>
                      <button class="btn-p" style="padding:8px 14px" onClick=${()=>addStep(g.id)}>+</button>
                    </div>`:html`
                    <button class="add-dash" onClick=${()=>{setAddFor(g.id);setStepText('');}} style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1px dashed rgba(240,52,90,0.38);background:none;color:var(--pink-deep);font-size:12px;cursor:pointer;width:100%;font-family:Montserrat,sans-serif">
                      <${Ic} n="plus" s=${12}/> Agregar paso
                    </button>`}
                </div>`}
              ${g.note&&html`<p class="tiny" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(240,52,90,0.10)">${g.note}</p>`}
            </div>`;
        })}
      </div>

      <${Modal} open=${!!f} onClose=${()=>setF(null)} title=${f&&f.id?'Editar objetivo':'Nuevo objetivo'}>
        ${f&&html`<div class="stack" style="gap:12px">
          <div><label class="lbl">Objetivo</label><input value=${f.title} onInput=${e=>setF({...f,title:e.target.value})} placeholder="Ej. Vender $50,000 este mes" autoFocus/></div>
          <div class="seg">
            ${[['pasos','✅ Por pasos'],['monto','💰 Por monto']].map(([k,l])=>html`<button class=${f.kind===k?'on':''} onClick=${()=>setF({...f,kind:k})}>${l}</button>`)}
          </div>
          ${f.kind==='monto'&&html`<div class="grid2">
            <div><label class="lbl">Meta</label><input type="number" inputmode="decimal" min="0" value=${f.target} onInput=${e=>setF({...f,target:e.target.value})} placeholder="0"/></div>
            <div><label class="lbl">Avance actual</label><input type="number" inputmode="decimal" min="0" value=${f.current} onInput=${e=>setF({...f,current:e.target.value})} placeholder="0"/></div>
          </div>`}
          <div><label class="lbl">Fecha límite</label><input type="date" value=${f.due} onInput=${e=>setF({...f,due:e.target.value})}/></div>
          <textarea value=${f.note} onInput=${e=>setF({...f,note:e.target.value})} placeholder="Notas" rows="2" style="resize:none"/>
          <${FormActions} isEdit=${!!f.id} label="Crear objetivo" onSave=${saveF} onDelete=${()=>{del(f.id);setF(null);}}/>
        </div>`}
      <//>
    </div>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════════════════════════
const Settings = ({open,onClose,biz,setBiz,session}) => {
  const [name,setName] = useState(biz);
  return html`
    <${Modal} open=${open} onClose=${onClose} title="Ajustes">
      <div class="stack" style="gap:14px">
        <div><label class="lbl">Nombre del negocio</label><input value=${name} onInput=${e=>setName(e.target.value)} placeholder="¿Cómo se llama tu negocio?"/></div>
        <button class="btn-p" style="width:100%;justify-content:center" onClick=${()=>{setBiz(name.trim());onClose();}}>Guardar ajustes</button>
        ${!SUPA_KEY&&html`<p class="tiny">Tus registros se guardan solo en este navegador.</p>`}
        ${session&&html`
          <div style="padding-top:12px;border-top:1px solid rgba(240,52,90,0.12)">
            <p class="muted" style="margin-bottom:10px">☁ Sesión iniciada como <b style="color:var(--ink)">${session.user.email}</b>. Todo se guarda en tu cuenta.</p>
            <button class="btn-g" style="width:100%;justify-content:center" onClick=${()=>{onClose();sb.auth.signOut();}}>Cerrar sesión</button>
          </div>`}
      </div>
    <//>
  `;
};

// ══════════════════════════════════════════════════════════════════════════
// AUTH  (iniciar sesión / crear cuenta — cada cuenta tiene su propio negocio)
// ══════════════════════════════════════════════════════════════════════════
const Splash = ({text,children}) => html`
  <div class="auth-wrap"><div class="auth-card fade-up">
    <p class="logo-word" style="font-size:30px;margin-bottom:10px">ritual.</p>
    <p class="muted">${text}</p>${children}
  </div></div>`;
const AuthScreen = () => {
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState('');
  const [pass,setPass] = useState('');
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const isUp = mode==='up';
  const go = async () => {
    if(!sb){ setMsg({t:'No se pudo conectar con la nube. Revisa tu internet y recarga.'}); return; }
    if(!email.trim()||pass.length<6){ setMsg({t:'Escribe tu correo y una contraseña de al menos 6 caracteres.'}); return; }
    setBusy(true); setMsg(null);
    const cred = {email:email.trim(),password:pass};
    const {data,error} = isUp ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
    setBusy(false);
    if(error){
      const m = (error.message||'').toLowerCase();
      setMsg({t: m.includes('already')?'Ese correo ya tiene cuenta. Inicia sesión.'
        : m.includes('rate')||error.status===429?'Demasiados intentos. Espera unos minutos.'
        : m.includes('not confirmed')?'Falta confirmar tu correo: abre el enlace que te enviamos.'
        : m.includes('signups not allowed')||m.includes('disabled')?'El registro de cuentas nuevas está desactivado.'
        : isUp?'No se pudo crear la cuenta: '+error.message:'Correo o contraseña incorrectos.'});
      return;
    }
    if(isUp&&!data.session){ setMsg({ok:true,t:'¡Cuenta creada! Te enviamos un correo: abre el enlace para confirmarla y luego inicia sesión aquí.'}); setMode('in'); setPass(''); }
  };
  return html`
    <div class="auth-wrap">
      <div class="auth-card fade-up">
        <p class="over" style="margin-bottom:10px">- tu negocio -</p>
        <span class="glass-pill">RITUAL</span>
        <p style="font-size:26px;font-weight:300;letter-spacing:2px;margin:6px 0 22px">${isUp?'crear cuenta':'bienvenida'}</p>
        <div class="seg" style="margin-bottom:14px">
          ${[['in','Iniciar sesión'],['up','Crear cuenta']].map(([k,l])=>html`<button class=${mode===k?'on':''} onClick=${()=>{setMode(k);setMsg(null);}}>${l}</button>`)}
        </div>
        <div class="stack" style="gap:10px;text-align:left">
          <div><label class="lbl">Correo</label><input type="email" autocomplete="username" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="tu@correo.com"/></div>
          <div><label class="lbl">Contraseña</label><input type="password" autocomplete=${isUp?'new-password':'current-password'} value=${pass} onInput=${e=>setPass(e.target.value)} placeholder=${isUp?'Mínimo 6 caracteres':''} onKeyDown=${e=>{if(e.key==='Enter')go();}}/></div>
          ${msg&&html`<p class="tiny" style=${{color:msg.ok?'var(--good)':'var(--bad)',fontWeight:500}}>${msg.t}</p>`}
          <button class="btn-p" style="width:100%;justify-content:center;margin-top:4px" disabled=${busy} onClick=${go}>${busy?'Un momento…':isUp?'Crear mi cuenta':'Entrar'}</button>
          ${isUp&&html`<p class="tiny" style="text-align:center">Cada cuenta tiene su propio negocio. Nadie más ve tus registros.</p>`}
        </div>
      </div>
    </div>`;
};

// ══════════════════════════════════════════════════════════════════════════
// APP ROOT  — all data lives in `db`; `put` is the single write path
// ══════════════════════════════════════════════════════════════════════════
const EMPTY = {txns:[],appts:[],projects:[],goals:[]};
const App = () => {
  const [tab,setTab] = useState('home');
  const [showSet,setShowSet] = useState(false);
  const [biz,setBizS] = useState(()=>SUPA_KEY?'':load('ritual-name',''));
  const [db,setDb] = useState(()=>SUPA_KEY?EMPTY:{txns:load('txns',[]),appts:load('appts',[]),projects:load('projects',[]),goals:load('goals',[])});
  const [session,setSession] = useState(SUPA_KEY&&sb?undefined:null);   // undefined = revisando sesión
  const [cloud,setCloud] = useState(SUPA_KEY?'cargando':'local');
  const [toast,setToast] = useState('');
  const flash = m => { setToast(m); setTimeout(()=>setToast(''),4000); };
  const uidNow = session&&session.user.id;

  const pushCloud = async (k,v) => {
    if(!sb||!uidNow)return;
    const {error} = await sb.from('ritual_data').upsert({owner:uidNow,key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'owner,key'});
    if(error) flash('No se pudo guardar en la nube: '+(error.message||'revisa tu conexión'));
  };
  const put = (k,v) => { setDb(d=>({...d,[k]:v})); if(SUPA_KEY) pushCloud(k,v); else save(k,v); };
  const setBiz = v => { setBizS(v); if(SUPA_KEY) pushCloud('name',v); else save('ritual-name',v); };

  useEffect(()=>{
    if(!sb)return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e,ses)=>setSession(ses||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  // Cada cuenta carga solo sus propios registros.
  useEffect(()=>{
    if(!sb)return;
    setDb(EMPTY); setBizS(''); setTab('home'); setCloud('cargando');
    if(!uidNow)return;
    let dead=false;
    sb.from('ritual_data').select('key,value').eq('owner',uidNow).then(({data,error})=>{
      if(dead)return;
      if(error){ setCloud('error'); return; }
      const m = Object.fromEntries(data.map(r=>[r.key,r.value]));
      const n = {...EMPTY}; KEYS.forEach(k=>{ if(Array.isArray(m[k])) n[k]=m[k]; });
      setDb(n); setBizS(typeof m.name==='string'?m.name:''); setCloud('ok');
    });
    return ()=>{dead=true;};
  },[uidNow]);

  if(SUPA_KEY){
    if(session===undefined) return html`<${Splash} text="Cargando…"/>`;
    if(!session) return html`<${AuthScreen}/>`;
    if(cloud==='cargando') return html`<${Splash} text="Cargando tus registros…"/>`;
    if(cloud==='error') return html`<${Splash} text="No se pudieron cargar tus registros. Para no perder nada, la app no te deja editar hasta que carguen.">
      <div class="stack" style="margin-top:16px">
        <button class="btn-p" style="justify-content:center" onClick=${()=>location.reload()}>Reintentar</button>
        <button class="btn-g" style="justify-content:center" onClick=${()=>sb.auth.signOut()}>Cerrar sesión</button>
      </div><//>`;
  }

  const pages = {home:PageHome,finance:PageFinance,appts:PageAppts,projects:PageProjects,goals:PageGoals};
  const Page  = pages[tab]||PageHome;

  return html`
    <div style="min-height:100vh">
      <nav class="sidebar">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 6px">
          <div style="width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#FF7A93,#F0345A);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(240,52,90,0.3)"><span style="font-size:16px;color:#fff">✦</span></div>
          <span class="logo-word">ritual.</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex:1">
          ${TABS.map(t=>html`
            <button class=${'nav-item'+(tab===t.id?' active':'')} onClick=${()=>setTab(t.id)}>
              <${Ic} n=${t.icon} s=${16}/>${t.label}
            </button>
          `)}
        </div>
        <p class="tiny ellip" style="padding:0 14px">${session?'☁ '+session.user.email:'Guardado solo en este navegador'}</p>
        <button class="nav-item" style="margin-top:8px" onClick=${()=>setShowSet(true)}>
          <${Ic} n="settings" s=${16}/>Ajustes
        </button>
      </nav>

      <main class="main-content">
        <${Page} key=${tab} db=${db} put=${put} setTab=${setTab} biz=${biz} openSettings=${()=>setShowSet(true)}/>
      </main>

      <nav class="bottom-nav">
        ${TABS.map(t=>html`
          <button class=${'bnav-item'+(tab===t.id?' active':'')} onClick=${()=>setTab(t.id)}>
            <${Ic} n=${t.icon} s=${20}/>
            <span>${t.id==='home'?'Inicio':t.label}</span>
          </button>
        `)}
      </nav>

      ${showSet&&html`<${Settings} open=${true} onClose=${()=>setShowSet(false)} biz=${biz} setBiz=${setBiz} session=${session}/>`}
      ${toast&&html`<div class="toast">${toast}</div>`}
    </div>
  `;
};

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
